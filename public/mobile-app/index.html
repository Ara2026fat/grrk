          ${fieldsHtml}
          <div class="co-actions">
            <button type="button" class="btn ghost" data-act="cancel">${escapeHtml(t.cancel || (isAr?'إلغاء':'Cancel'))}</button>
            <button type="submit" class="btn primary">${escapeHtml(t.save || (isAr?'حفظ':'Save'))}</button>
          </div>
        </form>
      </div>`;

    ctx.openOverlay(html, (overlayEl) => {
      overlayEl.querySelector('[data-act="cancel"]').addEventListener('click', () => {
        ctx.closeOverlay();
      });
      const formEl = overlayEl.querySelector('[data-form="co-form"]');
      formEl.addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(formEl);
        const patch = {};
        fd.forEach((v,k) => { patch[k] = v; });
        // minimal validation: require at least one name
        if(!patch.nameAr && !patch.nameEn){
          formEl.querySelector('[name="nameAr"]').focus();
          return;
        }
        const coll = kind === 'company' ? 'companies' : 'organizations';
        if(isEdit){
          DB.update(coll, r.id, patch);
        } else {
          DB.add(coll, patch);
        }
        ctx.closeOverlay();
        renderList();
        ctx.showToast(kind === 'company' ? L.savedCompany : L.savedOrg);
      });
    });
  }

  function exportColumnsAndRows(){
    const coll = state.tab === 'companies' ? 'companies' : 'organizations';
    const all = DB.list(coll).filter(r => matches(r, state.q));
    if(coll === 'companies'){
      const cols = [L.nameAr, L.nameEn, L.crNumber, L.sector, L.licenseExpiry, L.status].map(l => ({key:l, label:l}));
      const rows = all.map(r => ({
        [L.nameAr]: r.nameAr || '',
        [L.nameEn]: r.nameEn || '',
        [L.crNumber]: r.crNumber || '',
        [L.sector]: r.sector || '',
        [L.licenseExpiry]: r.licenseExpiry || '',
        [L.status]: r.status === 'active' ? L.activeStatus : L.inactiveStatus,
      }));
      return { cols, rows, filePrefix: 'companies' };
    }
    const cols = [L.nameAr, L.nameEn, L.type, L.contactPerson, L.relationship].map(l => ({key:l, label:l}));
    const rows = all.map(r => ({
      [L.nameAr]: r.nameAr || '',
      [L.nameEn]: r.nameEn || '',
      [L.type]: r.type || '',
      [L.contactPerson]: r.contactPerson || '',
      [L.relationship]: r.relationship || '',
    }));
    return { cols, rows, filePrefix: 'organizations' };
  }

  function doExportExcel(){
    const { rows, filePrefix } = exportColumnsAndRows();
    const date = new Date().toISOString().slice(0,10);
    const blob = GRRK_EXPORT.exportExcel(rows, `GRRK-${filePrefix}-${date}.xlsx`, filePrefix);
    if(blob) GRRK_EXPORT.shareFile(blob, `GRRK-${filePrefix}-${date}.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', L.hero, ctx.showToast);
  }

  function doExportPDF(){
    const { cols, rows, filePrefix } = exportColumnsAndRows();
    const date = new Date().toISOString().slice(0,10);
    const blob = GRRK_EXPORT.exportPDF(filePrefix === 'companies' ? L.companiesTab : L.orgsTab, cols, rows);
    if(blob) GRRK_EXPORT.shareFile(blob, `GRRK-${filePrefix}-${date}.pdf`, 'application/pdf', L.hero, ctx.showToast);
  }

  function switchTab(tab){
    state.tab = tab;
    root.querySelectorAll('.co-tab').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-tab') === tab);
    });
    renderList();
  }

  // ---- Build base markup ----
  root.innerHTML = `
    <div>
      <div class="glass">
        <div class="eyebrow">${escapeHtml(t.companies || L.hero)} / ${escapeHtml(t.organizations || L.orgsTab)}</div>
        <h1 class="h1">${escapeHtml(L.hero)}</h1>
        <p class="muted" style="margin-top:4px">${escapeHtml(L.heroSub)}</p>
        <div class="co-tabs">
          <button class="co-tab ${state.tab==='companies'?'active':''}" data-tab="companies">${escapeHtml(t.companies || L.companiesTab)}</button>
          <button class="co-tab ${state.tab==='organizations'?'active':''}" data-tab="organizations">${escapeHtml(t.organizations || L.orgsTab)}</button>
        </div>
        <div class="co-search">
          <input type="text" placeholder="${escapeHtml(t.search || (isAr?'بحث...':'Search...'))}" value="${escapeHtml(state.q)}">
        </div>
        <div class="co-export-row">
          <button class="btn sm ghost" data-act="export-excel">${escapeHtml(L.exportExcel)}</button>
          <button class="btn sm ghost" data-act="export-pdf">${escapeHtml(L.exportPDF)}</button>
        </div>
      </div>
      <div class="co-list-wrap">${listHtml()}</div>
    </div>
    <button class="fab" aria-label="${escapeHtml(t.add || (isAr?'إضافة':'Add'))}">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  `;

  root.querySelectorAll('.co-tab').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
  });

  const searchInput = root.querySelector('.co-search input');
  searchInput.addEventListener('input', (e) => {
    state.q = e.target.value;
    renderList();
  });

  root.querySelector('.fab').addEventListener('click', () => {
    const kind = state.tab === 'companies' ? 'company' : 'organization';
    openForm(kind, null);
  });

  root.querySelector('[data-act="export-excel"]').addEventListener('click', doExportExcel);
  root.querySelector('[data-act="export-pdf"]').addEventListener('click', doExportPDF);

  bindRowEvents();
}

// Mount function — called by the shell router.
function renderDocuments(root, ctx){
  const L = ctx.lang;
  const t = ctx.t;
  const isAr = L === 'ar';

  const tr = (ar, en) => isAr ? ar : en;

  const ENTITY_COLL = { employee:'employees', contractor:'contractors', company:'companies' };
  const ENTITY_LABEL = {
    employee: tr('موظف','Employee'),
    contractor: tr('مقاول','Contractor'),
    company: tr('شركة','Company'),
  };

  let searchQuery = '';
  let activeFilter = 'all'; // all | expired | expiringSoon | valid

  function computeMeta(doc){
    const days = daysUntil(doc.expiryDate);
    const status = expiryStatus(doc.expiryDate);
    let pct = 0;
    if(doc.issueDate && doc.expiryDate){
      const start = new Date(doc.issueDate).getTime();
      const end = new Date(doc.expiryDate).getTime();
      const now = new Date().setHours(0,0,0,0);
      const span = end - start;
      if(span > 0){
        pct = Math.max(0, Math.min(100, ((now - start) / span) * 100));
      }
    }
    return { days, status, pct: Math.round(pct) };
  }

  function statusLabelPlain(status, days){
    if(status === 'danger') return tr('منتهي','Expired');
    if(status === 'warn') return tr('ينتهي قريباً','Expiring soon');
    if(status === 'ok') return tr('سارٍ','Valid');
    return '—';
  }

  function exportRowsFor(docs){
    return docs.map(({d, meta}) => {
      const title = isAr ? (d.titleAr || d.titleEn) : (d.titleEn || d.titleAr);
      return {
        [tr('التصنيف','Category')]: d.category || '',
        [tr('العنوان','Title')]: title || '',
        [tr('الرقم','Number')]: d.number || '',
        [tr('تاريخ الانتهاء','Expiry Date')]: d.expiryDate || '',
        [tr('الحالة','Status')]: statusLabelPlain(meta.status, meta.days),
      };
    });
  }

  async function handleBulkExport(kind){
    const rows = filterAndSort();
    if(!rows.length){
      ctx.showToast(tr('لا توجد مستندات للتصدير','No documents to export'));
      return;
    }
    const exportRows = exportRowsFor(rows);
    const stamp = new Date().toISOString().slice(0,10);
    if(kind === 'excel'){
      const blob = GRRK_EXPORT.exportExcel(exportRows, `documents-${stamp}.xlsx`, tr('المستندات','Documents'));
      if(!blob) return;
      await GRRK_EXPORT.shareFile(blob, `documents-${stamp}.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', tr('تصدير المستندات','Documents export'), ctx.showToast);
    } else {
      const columns = [
        { key: tr('التصنيف','Category'), label: tr('التصنيف','Category') },
        { key: tr('العنوان','Title'), label: tr('العنوان','Title') },
        { key: tr('الرقم','Number'), label: tr('الرقم','Number') },
        { key: tr('تاريخ الانتهاء','Expiry Date'), label: tr('تاريخ الانتهاء','Expiry Date') },
        { key: tr('الحالة','Status'), label: tr('الحالة','Status') },
      ];
      const blob = GRRK_EXPORT.exportPDF(tr('تقرير المستندات','Documents Report'), columns, exportRows);
      if(!blob) return;
      await GRRK_EXPORT.shareFile(blob, `documents-${stamp}.pdf`, 'application/pdf', tr('تصدير المستندات','Documents export'), ctx.showToast);
    }
  }

  async function handleSingleShare(doc){
    const meta = computeMeta(doc);
    const title = isAr ? (doc.titleAr || doc.titleEn) : (doc.titleEn || doc.titleAr);
    const entityName = DB.entityLabel(doc.entityType, doc.entityId);
    const columns = [
      { key: 'label', label: tr('الحقل','Field') },
      { key: 'value', label: tr('القيمة','Value') },
    ];
    const rows = [
      { label: tr('العنوان','Title'), value: `${doc.titleAr || ''} / ${doc.titleEn || ''}` },
      { label: tr('الرقم','Number'), value: doc.number || '' },
      { label: tr('الفئة','Category'), value: doc.category || '' },
      { label: tr('تاريخ الإصدار','Issue Date'), value: doc.issueDate || '' },
      { label: tr('تاريخ الانتهاء','Expiry Date'), value: doc.expiryDate || '' },
      { label: tr('الكيان المرتبط','Linked Entity'), value: entityName || '' },
      { label: tr('الحالة','Status'), value: statusLabelPlain(meta.status, meta.days) },
    ];
    const reportTitle = `${tr('ملخص مستند','Document Summary')} — ${title}`;
    const blob = GRRK_EXPORT.exportPDF(reportTitle, columns, rows);
    if(!blob) return;
    const safeName = (doc.number || doc.id || 'document').toString().replace(/[^a-zA-Z0-9-_]+/g,'_');
    await GRRK_EXPORT.shareFile(blob, `document-${safeName}.pdf`, 'application/pdf', reportTitle, ctx.showToast);
  }

  function statusLabel(status, days){
    if(status === 'danger') return tr('منتهي منذ', 'Expired') + (days!==null ? ' ' + Math.abs(days) + ' ' + tr('يوم','d') : '');
    if(status === 'warn') return days + ' ' + t.daysLeft;
    if(status === 'ok') return days + ' ' + t.daysLeft;
    return '—';
  }

  function meterColor(status){
    if(status==='danger') return 'var(--danger)';
    if(status==='warn') return 'var(--warn)';
    return 'var(--ok)';
  }

  function iconFor(status){
    const colors = status==='danger' ? ['#FF6B81','#C83C53'] : status==='warn' ? ['#FFC168','#C9932E'] : ['#52E3A6','#188A5E'];
    return { i1: colors[0], i2: colors[1] };
  }

  const DOC_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6M9 9h2"/></svg>`;

  function getDocs(){
    return DB.list('documents').map(d => ({ d, meta: computeMeta(d) }));
  }

  function filterAndSort(){
    let rows = getDocs();
    if(searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      rows = rows.filter(({d}) =>
        (d.titleAr||'').toLowerCase().includes(q) ||
        (d.titleEn||'').toLowerCase().includes(q) ||
        (d.number||'').toLowerCase().includes(q) ||
        (d.category||'').toLowerCase().includes(q)
      );
    }
    if(activeFilter === 'expired') rows = rows.filter(({meta}) => meta.status === 'danger');
    else if(activeFilter === 'expiringSoon') rows = rows.filter(({meta}) => meta.status === 'warn');
    else if(activeFilter === 'valid') rows = rows.filter(({meta}) => meta.status === 'ok');
    rows.sort((a,b) => {
      const da = a.meta.days === null ? Infinity : a.meta.days;
      const db = b.meta.days === null ? Infinity : b.meta.days;
      return da - db;
    });
    return rows;
  }

  function renderIcon3d(status, sizeCls){
    const { i1, i2 } = iconFor(status);
    return `<div class="icon3d ${sizeCls||''}" style="--i1:${i1};--i2:${i2}">${DOC_SVG}</div>`;
  }

  function renderBadge(status, days){
    return `<span class="badge ${status==='neutral' ? 'neutral' : status}">${statusLabel(status, days)}</span>`;
  }

  function renderRow(doc, meta){
    const title = isAr ? (doc.titleAr || doc.titleEn) : (doc.titleEn || doc.titleAr);
    const entityName = DB.entityLabel(doc.entityType, doc.entityId);
    const sub = `${entityName} · ${doc.category || ''}`;
    return `
      <div class="card pressable doc-row" data-id="${doc.id}">
        ${renderIcon3d(meta.status)}
        <div class="doc-row-body">
          <div class="doc-row-top">
            <div class="doc-row-title">${escapeHtml(title)}</div>
          </div>
          <div class="doc-row-sub">${escapeHtml(sub)}</div>
          <div class="doc-row-meta">
            <div class="meter" style="flex:1"><i style="width:${meta.pct}%; background:${meterColor(meta.status)}"></i></div>
            ${renderBadge(meta.status, meta.days)}
          </div>
        </div>
      </div>
    `;
  }

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function computeStats(){
    const all = getDocs();
    const total = all.length;
    const expiringSoon = all.filter(({meta}) => meta.days !== null && meta.days >= 0 && meta.days <= 30).length;
    return { total, expiringSoon };
  }

  function chipsConfig(){
    return [
      { key:'all', label: tr('الكل','All') },
      { key:'expired', label: t.expired },
      { key:'expiringSoon', label: t.expiringSoon },
      { key:'valid', label: t.valid },
    ];
  }

  function buildEntityOptions(entityType, selectedId){
    const coll = ENTITY_COLL[entityType];
    if(!coll) return '';
    return DB.list(coll).map(e => {
      const label = isAr ? (e.nameAr || e.nameEn) : (e.nameEn || e.nameAr);
      const sel = e.id === selectedId ? 'selected' : '';
      return `<option value="${e.id}" ${sel}>${escapeHtml(label)}</option>`;
    }).join('');
  }

  function openFormOverlay(existing){
    const isEdit = !!existing;
    const doc = existing || { titleAr:'', titleEn:'', entityType:'employee', entityId:'', number:'', issueDate:'', expiryDate:'', category:'' };

    const html = `
      <div class="sheet glass">
        <h2 class="h2" style="margin-bottom:16px">${isEdit ? t.edit : t.add} — ${t.documents}</h2>
        <form id="doc-form">
          <div class="field">
            <label>${tr('العنوان (عربي)','Title (Arabic)')}</label>
            <input type="text" name="titleAr" value="${escapeHtml(doc.titleAr)}" required>
          </div>
          <div class="field">
            <label>${tr('العنوان (إنجليزي)','Title (English)')}</label>
            <input type="text" name="titleEn" value="${escapeHtml(doc.titleEn)}" required>
          </div>
          <div class="field">
            <label>${tr('نوع الكيان','Entity Type')}</label>
            <select name="entityType" id="doc-entity-type">
              <option value="employee" ${doc.entityType==='employee'?'selected':''}>${ENTITY_LABEL.employee}</option>
              <option value="contractor" ${doc.entityType==='contractor'?'selected':''}>${ENTITY_LABEL.contractor}</option>
              <option value="company" ${doc.entityType==='company'?'selected':''}>${ENTITY_LABEL.company}</option>
            </select>
          </div>
          <div class="field">
            <label>${tr('الكيان المرتبط','Linked Entity')}</label>
            <select name="entityId" id="doc-entity-id">
              ${buildEntityOptions(doc.entityType, doc.entityId)}
            </select>
          </div>
          <div class="field">
            <label>${tr('رقم المستند','Document Number')}</label>
            <input type="text" name="number" value="${escapeHtml(doc.number)}" required>
          </div>
          <div class="field">
            <label>${tr('الفئة','Category')}</label>
            <input type="text" name="category" value="${escapeHtml(doc.category)}" required>
          </div>
          <div class="field">
            <label>${tr('تاريخ الإصدار','Issue Date')}</label>
            <input type="date" name="issueDate" value="${doc.issueDate||''}" required>
          </div>
          <div class="field">
            <label>${tr('تاريخ الانتهاء','Expiry Date')}</label>
            <input type="date" name="expiryDate" value="${doc.expiryDate||''}" required>
          </div>
          <div class="doc-actions">
            <button type="button" class="btn ghost" id="doc-form-cancel">${t.cancel}</button>
            <button type="submit" class="btn primary">${t.save}</button>
          </div>
        </form>
      </div>
    `;

    ctx.openOverlay(html, (overlayEl) => {
      const entityTypeSel = overlayEl.querySelector('#doc-entity-type');
      const entityIdSel = overlayEl.querySelector('#doc-entity-id');
      entityTypeSel.addEventListener('change', () => {
        entityIdSel.innerHTML = buildEntityOptions(entityTypeSel.value, null);
      });
      overlayEl.querySelector('#doc-form-cancel').addEventListener('click', () => ctx.closeOverlay());
      overlayEl.querySelector('#doc-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const patch = {
          titleAr: fd.get('titleAr').trim(),
          titleEn: fd.get('titleEn').trim(),
          entityType: fd.get('entityType'),
          entityId: fd.get('entityId'),
          number: fd.get('number').trim(),
          category: fd.get('category').trim(),
          issueDate: fd.get('issueDate'),
          expiryDate: fd.get('expiryDate'),
        };
        if(!patch.titleAr || !patch.titleEn || !patch.number || !patch.issueDate || !patch.expiryDate || !patch.entityId){
          ctx.showToast(tr('يرجى تعبئة جميع الحقول المطلوبة','Please fill all required fields'));
          return;
        }
        if(isEdit){
          DB.update('documents', doc.id, patch);
          ctx.showToast(tr('تم تحديث المستند','Document updated'));
        } else {
          DB.add('documents', patch);
          ctx.showToast(tr('تمت إضافة المستند','Document added'));
        }
        ctx.closeOverlay();
        ctx.rerender();
      });
    });
  }

  function openDeleteConfirm(doc){
    const title = isAr ? (doc.titleAr || doc.titleEn) : (doc.titleEn || doc.titleAr);
    const html = `
      <div class="sheet glass doc-confirm">
        <h2 class="h2" style="margin-bottom:10px">${t.delete}</h2>
        <p class="muted" style="margin-bottom:18px">${tr('هل أنت متأكد من حذف','Are you sure you want to delete')} “${escapeHtml(title)}”؟</p>
        <div class="doc-actions">
          <button type="button" class="btn ghost" id="doc-del-cancel">${t.cancel}</button>
          <button type="button" class="btn danger" id="doc-del-confirm">${t.delete}</button>
        </div>
      </div>
    `;
    ctx.openOverlay(html, (overlayEl) => {
      overlayEl.querySelector('#doc-del-cancel').addEventListener('click', () => ctx.closeOverlay());
      overlayEl.querySelector('#doc-del-confirm').addEventListener('click', () => {
        DB.remove('documents', doc.id);
        ctx.showToast(tr('تم حذف المستند','Document deleted'));
        ctx.closeOverlay();
        ctx.rerender();
      });
    });
  }

  function openDetail(doc){
    const meta = computeMeta(doc);
    const title = isAr ? (doc.titleAr || doc.titleEn) : (doc.titleEn || doc.titleAr);
    const entityName = DB.entityLabel(doc.entityType, doc.entityId);
    const html = `
      <div class="sheet glass">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:6px">
          ${renderIcon3d(meta.status)}
          <div>
            <h2 class="h2">${escapeHtml(title)}</h2>
            <div class="faint">${escapeHtml(doc.category||'')}</div>
          </div>
        </div>
        <div class="doc-detail-grid">
          <div class="doc-detail-row"><span class="doc-detail-label">${tr('العنوان (عربي)','Title (Arabic)')}</span><span class="doc-detail-value">${escapeHtml(doc.titleAr)}</span></div>
          <div class="doc-detail-row"><span class="doc-detail-label">${tr('العنوان (إنجليزي)','Title (English)')}</span><span class="doc-detail-value">${escapeHtml(doc.titleEn)}</span></div>
          <div class="doc-detail-row"><span class="doc-detail-label">${tr('نوع الكيان','Entity Type')}</span><span class="doc-detail-value">${ENTITY_LABEL[doc.entityType]||'—'}</span></div>
          <div class="doc-detail-row"><span class="doc-detail-label">${tr('الكيان المرتبط','Linked Entity')}</span><span class="doc-detail-value">${escapeHtml(entityName)}</span></div>
          <div class="doc-detail-row"><span class="doc-detail-label">${tr('رقم المستند','Document Number')}</span><span class="doc-detail-value num">${escapeHtml(doc.number)}</span></div>
          <div class="doc-detail-row"><span class="doc-detail-label">${tr('تاريخ الإصدار','Issue Date')}</span><span class="doc-detail-value num">${escapeHtml(doc.issueDate)}</span></div>
          <div class="doc-detail-row"><span class="doc-detail-label">${tr('تاريخ الانتهاء','Expiry Date')}</span><span class="doc-detail-value num">${escapeHtml(doc.expiryDate)}</span></div>
          <div class="doc-detail-row"><span class="doc-detail-label">${tr('الحالة','Status')}</span>${renderBadge(meta.status, meta.days)}</div>
        </div>
        <div class="meter" style="margin-bottom:16px"><i style="width:${meta.pct}%; background:${meterColor(meta.status)}"></i></div>
        <div class="doc-actions">
          <button type="button" class="btn ghost" id="doc-detail-close">${t.cancel}</button>
          <button type="button" class="btn auto" id="doc-detail-share">${tr('مشاركة','Share')}</button>
          <button type="button" class="btn auto" id="doc-detail-edit">${t.edit}</button>
          <button type="button" class="btn danger auto" id="doc-detail-delete">${t.delete}</button>
        </div>
      </div>
    `;
    ctx.openOverlay(html, (overlayEl) => {
      overlayEl.querySelector('#doc-detail-close').addEventListener('click', () => ctx.closeOverlay());
      overlayEl.querySelector('#doc-detail-share').addEventListener('click', () => {
        handleSingleShare(doc);
      });
      overlayEl.querySelector('#doc-detail-edit').addEventListener('click', () => {
        ctx.closeOverlay();
        openFormOverlay(doc);
      });
      overlayEl.querySelector('#doc-detail-delete').addEventListener('click', () => {
        ctx.closeOverlay();
        openDeleteConfirm(doc);
      });
    });
  }

  function draw(){
    const stats = computeStats();
    const rows = filterAndSort();
    const chips = chipsConfig();

    root.innerHTML = `
      <div>
        <div class="glass">
          <div class="eyebrow">${t.documents}</div>
          <h1 class="h1">${tr('إدارة المستندات والامتثال','Document & Compliance Management')}</h1>
          <div class="doc-hero-stats">
            <div class="stat">
              <div class="val num">${stats.total}</div>
              <div class="lbl">${t.total}</div>
            </div>
            <div class="stat">
              <div class="val num" style="color:var(--warn)">${stats.expiringSoon}</div>
              <div class="lbl">${tr('ينتهي خلال 30 يوم','Expiring in 30 days')}</div>
            </div>
          </div>
          <div class="doc-search">
            <input type="text" id="doc-search-input" placeholder="${t.search}" value="${escapeHtml(searchQuery)}">
          </div>
          <div class="doc-export-row">
            <button type="button" class="btn sm ghost" id="doc-export-excel">${tr('تصدير Excel','Export Excel')}</button>
            <button type="button" class="btn sm ghost" id="doc-export-pdf">${tr('تصدير PDF','Export PDF')}</button>
          </div>
        </div>

        <div class="doc-chips">
          ${chips.map(c => `<button type="button" class="doc-chip ${activeFilter===c.key?'active':''}" data-key="${c.key}">${c.label}</button>`).join('')}
        </div>

        <div class="doc-list stagger">
          ${rows.length ? rows.map(({d, meta}) => renderRow(d, meta)).join('') : `<div class="empty">${t.empty}</div>`}
        </div>

        <button type="button" class="fab" id="doc-fab" aria-label="${t.add}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    `;

    const searchInput = root.querySelector('#doc-search-input');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      const caret = e.target.selectionStart;
      draw();
      const newInput = root.querySelector('#doc-search-input');
      newInput.focus();
      try{ newInput.setSelectionRange(caret, caret); }catch(err){}
    });

    root.querySelectorAll('.doc-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeFilter = chip.getAttribute('data-key');
        draw();
      });
    });

    root.querySelectorAll('.doc-row').forEach(rowEl => {
      rowEl.addEventListener('click', () => {
        const id = rowEl.getAttribute('data-id');
        const doc = DB.get('documents', id);
        if(doc) openDetail(doc);
      });
    });

    root.querySelector('#doc-fab').addEventListener('click', () => openFormOverlay(null));

    root.querySelector('#doc-export-excel').addEventListener('click', () => handleBulkExport('excel'));
    root.querySelector('#doc-export-pdf').addEventListener('click', () => handleBulkExport('pdf'));
  }

  draw();
}

// Mount function — called by the shell router.
function renderAlerts(root, ctx){
  const t = ctx.t;
  const lang = ctx.lang;
  const isAr = lang === 'ar';

  let activeFilter = 'all';

  function daysUntilLocal(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr), n = new Date();
    d.setHours(0,0,0,0); n.setHours(0,0,0,0);
    return Math.round((d - n) / 86400000);
  }
  function statusOf(days){
    if(days === null) return 'neutral';
    if(days < 0) return 'danger';
    if(days <= 30) return 'warn';
    return 'ok';
  }

  function buildFeed(){
    const items = [];

    // Documents
    DB.expiringDocuments(60).forEach(d => {
      items.push({
        kind: 'document',
        id: d.id,
        daysLeft: d.daysLeft,
        status: d.status,
        nameAr: d.titleAr, nameEn: d.titleEn,
        entityAr: DB.entityLabel(d.entityType, d.entityId),
        entityEn: DB.entityLabel(d.entityType, d.entityId),
        labelAr: 'مستند', labelEn: 'document',
        raw: d, collection: 'documents'
      });
    });

    // Employees — idExpiry
    DB.list('employees').forEach(e => {
      const days = daysUntilLocal(e.idExpiry);
      if(days !== null && days <= 60){
        items.push({
          kind: 'employee', id: e.id, daysLeft: days, status: statusOf(days),
          nameAr: e.nameAr, nameEn: e.nameEn,
          labelAr: 'الهوية', labelEn: 'ID',
          raw: e, collection: 'employees'
        });
      }
    });

    // Contractors — contractEnd
    DB.list('contractors').forEach(c => {
      const days = daysUntilLocal(c.contractEnd);
      if(days !== null && days <= 60){
        items.push({
          kind: 'contractor', id: c.id, daysLeft: days, status: statusOf(days),
          nameAr: c.nameAr, nameEn: c.nameEn,
          labelAr: 'العقد', labelEn: 'contract',
          raw: c, collection: 'contractors'
        });
      }
    });

    // Companies — licenseExpiry
    DB.list('companies').forEach(co => {
      const days = daysUntilLocal(co.licenseExpiry);
      if(days !== null && days <= 60){
        items.push({
          kind: 'company', id: co.id, daysLeft: days, status: statusOf(days),
          nameAr: co.nameAr, nameEn: co.nameEn,
          labelAr: 'الرخصة', labelEn: 'license',
          raw: co, collection: 'companies'
        });
      }
    });

    items.sort((a,b) => a.daysLeft - b.daysLeft);
    return items;
  }

  function iconSvg(status){
    if(status === 'danger'){
      return `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 9v4"/><path d="M12 16.5h.01"/>
        <path d="M10.3 3.9 2.6 17.1a1.6 1.6 0 0 0 1.4 2.4h16a1.6 1.6 0 0 0 1.4-2.4L13.7 3.9a1.6 1.6 0 0 0-2.8 0Z"/>
      </svg>`;
    }
    if(status === 'ok'){
      return `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.6 2.6L16 9.5"/>
      </svg>`;
    }
    // bell for warn / amber(31-60)
    return `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 0 0-12 0c0 3.2-1 5-2 7h16c-1-2-2-3.8-2-7Z"/>
      <path d="M9.5 19a2.5 2.5 0 0 0 5 0"/>
    </svg>`;
  }

  function iconGradient(status){
    if(status === 'danger') return 'var(--danger), #8A2338';
    if(status === 'ok') return 'var(--ok), #0E7A52';
    // warn (<=30) uses warn gradient; 31-60 uses a softer amber gradient (still warn family)
    return 'var(--warn), #B9872E';
  }

  function daysLabel(days){
    if(days < 0){
      const abs = Math.abs(days);
      return isAr ? `منتهي منذ ${abs} يوم` : `Expired ${abs}d ago`;
    }
    if(days === 0) return isAr ? 'ينتهي اليوم' : 'Expires today';
    return isAr ? `${days} يوم` : `${days}d`;
  }

  function messageFor(item){
    const nameAr = item.nameAr || item.entityAr || '—';
    const nameEn = item.nameEn || item.entityEn || '—';
    const days = item.daysLeft;
    let ar, en;
    if(days < 0){
      ar = `${nameAr} — انتهت صلاحية ${item.labelAr} منذ ${Math.abs(days)} يوم`;
      en = `${nameEn}'s ${item.labelEn} expired ${Math.abs(days)} days ago`;
    } else if(days === 0){
      ar = `${nameAr} — ${item.labelAr} ينتهي اليوم`;
      en = `${nameEn}'s ${item.labelEn} expires today`;
    } else {
      ar = `${nameAr} — تنتهي صلاحية ${item.labelAr} بعد ${days} يوم`;
      en = `${nameEn}'s ${item.labelEn} expires in ${days} days`;
    }
    return { ar, en };
  }

  function applyFilter(items){
    if(activeFilter === 'expired') return items.filter(i => i.daysLeft < 0);
    if(activeFilter === 'week') return items.filter(i => i.daysLeft >= 0 && i.daysLeft <= 7);
    if(activeFilter === 'month') return items.filter(i => i.daysLeft >= 0 && i.daysLeft <= 30);
    return items;
  }

  function entityDetailFields(item){
    const r = item.raw;
    const rows = [];
    const push = (kAr, kEn, v) => { if(v !== undefined && v !== null && v !== '') rows.push({ kAr, kEn, v }); };

    if(item.kind === 'document'){
      push('العنوان (ع)', 'Title (AR)', r.titleAr);
      push('العنوان (En)', 'Title (EN)', r.titleEn);
      push('الرقم', 'Number', r.number);
      push('الفئة', 'Category', r.category);
      push('تاريخ الإصدار', 'Issue date', r.issueDate);
      push('تاريخ الانتهاء', 'Expiry date', r.expiryDate);
      push('الجهة المرتبطة', 'Linked entity', DB.entityLabel(r.entityType, r.entityId));
    } else if(item.kind === 'employee'){
      push('الاسم (ع)', 'Name (AR)', r.nameAr);
      push('الاسم (En)', 'Name (EN)', r.nameEn);
      push('المسمى الوظيفي', 'Role', r.role);
      push('القسم', 'Department', r.dept);
      push('رقم الهوية', 'National ID', r.nationalId);
      push('الهاتف', 'Phone', r.phone);
      push('البريد الإلكتروني', 'Email', r.email);
      push('انتهاء الهوية', 'ID expiry', r.idExpiry);
      push('الحالة', 'Status', r.status);
    } else if(item.kind === 'contractor'){
      push('الاسم (ع)', 'Name (AR)', r.nameAr);
      push('الاسم (En)', 'Name (EN)', r.nameEn);
      push('الخدمة', 'Service', r.service);
      push('جهة الاتصال', 'Contact', r.contact);
      push('نهاية العقد', 'Contract end', r.contractEnd);
      push('الحالة', 'Status', r.status);
    } else if(item.kind === 'company'){
      push('الاسم (ع)', 'Name (AR)', r.nameAr);
      push('الاسم (En)', 'Name (EN)', r.nameEn);
      push('رقم السجل التجاري', 'CR number', r.crNumber);
      push('القطاع', 'Sector', r.sector);
      push('انتهاء الرخصة', 'License expiry', r.licenseExpiry);
      push('الحالة', 'Status', r.status);
    }
    return rows;
  }

  function openDetail(item){
    const title = isAr ? (item.nameAr || item.entityAr) : (item.nameEn || item.entityEn);
    const rows = entityDetailFields(item);
    const kindLabel = {
      document: isAr ? 'مستند' : 'Document',
      employee: isAr ? 'موظف' : 'Employee',
      contractor: isAr ? 'مقاول' : 'Contractor',
      company: isAr ? 'شركة' : 'Company'
    }[item.kind];
    const html = `
      <div class="overlay" data-overlay>
        <div class="sheet glass">
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px">
            <div class="icon3d" style="--i1:${iconGradient(item.status).split(',')[0]}; --i2:${iconGradient(item.status).split(',')[1]}">
              ${iconSvg(item.status)}
            </div>
            <div style="flex:1; min-width:0">
              <div class="eyebrow">${kindLabel}</div>
              <h2 class="h2" style="margin-top:2px">${title || '—'}</h2>
            </div>
            <span class="badge ${item.status === 'danger' ? 'danger' : (item.status === 'ok' ? 'ok' : 'warn')}">${daysLabel(item.daysLeft)}</span>
          </div>
          <div class="divider"></div>
          ${rows.map(r => `
            <div class="alerts-detail-row">
              <span class="k">${isAr ? r.kAr : r.kEn}</span>
              <span class="v num">${r.v}</span>
            </div>
          `).join('')}
          <div style="margin-top:16px">
            <button class="btn ghost block" data-close-overlay>${isAr ? 'إغلاق' : 'Close'}</button>
          </div>
        </div>
      </div>
    `;
    ctx.openOverlay(html, (overlayEl) => {
      const closeBtn = overlayEl.querySelector('[data-close-overlay]');
      if(closeBtn) closeBtn.addEventListener('click', () => ctx.closeOverlay());
      const overlayBg = overlayEl.querySelector('[data-overlay]');
      if(overlayBg){
        overlayBg.addEventListener('click', (e) => {
          if(e.target === overlayBg) ctx.closeOverlay();
        });
      }
    });
  }

  function renderFeed(){
    const feedEl = root.querySelector('[data-feed]');
    if(!feedEl) return;
    const all = buildFeed();
    const filtered = applyFilter(all);

    if(filtered.length === 0){
      feedEl.innerHTML = `
        <div class="empty">
          <div class="icon3d" style="--i1:var(--ok); --i2:#0E7A52; margin:0 auto 14px">
            ${iconSvg('ok')}
          </div>
          <div>${t.noAlerts}</div>
        </div>
      `;
      return;
    }

    feedEl.innerHTML = `<div class="alerts-feed stagger">
      ${filtered.map((item, idx) => {
        const msg = messageFor(item);
        const badgeClass = item.status === 'danger' ? 'danger' : (item.status === 'ok' ? 'ok' : 'warn');
        const grad = iconGradient(item.status).split(',');
        return `
          <button class="alerts-row" data-idx="${idx}" data-item-ref="${idx}">
            <div class="card pressable" style="display:flex; align-items:center; gap:13px; width:100%">
              <div class="icon3d" style="--i1:${grad[0]}; --i2:${grad[1]}">
                ${iconSvg(item.status)}
              </div>
              <div class="alerts-msg">
                <div class="ar">${isAr ? msg.ar : msg.en}</div>
                <div class="en">${isAr ? msg.en : msg.ar}</div>
              </div>
              <span class="badge ${badgeClass} num">${daysLabel(item.daysLeft)}</span>
            </div>
          </button>
        `;
      }).join('')}
    </div>`;

    feedEl.querySelectorAll('[data-item-ref]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.getAttribute('data-item-ref'));
        openDetail(filtered[idx]);
      });
    });
  }

  function renderHero(){
    const all = buildFeed();
    const criticalCount = all.filter(i => i.status === 'danger').length;
    const upcomingCount = all.filter(i => i.daysLeft >= 0 && i.daysLeft <= 30).length;
    const activeCount = all.length;

    const heroEl = root.querySelector('[data-hero]');
    if(!heroEl) return;
    heroEl.innerHTML = `
      <div class="eyebrow">${t.alerts}</div>
      <div class="alerts-hero-num">${activeCount}</div>
      <div class="alerts-hero-sub">
        ${isAr
          ? `${criticalCount} حرِج (منتهي) · ${upcomingCount} قريب (خلال 30 يوم)`
          : `${criticalCount} critical (expired) · ${upcomingCount} upcoming (within 30 days)`}
      </div>
    `;
  }

  function renderFilters(){
    const filtersEl = root.querySelector('[data-filters]');
    if(!filtersEl) return;
    const chips = [
      { key: 'all', ar: 'الكل', en: 'All' },
      { key: 'expired', ar: 'منتهي', en: 'Expired' },
      { key: 'week', ar: 'هذا الأسبوع', en: 'This week' },
      { key: 'month', ar: 'هذا الشهر', en: 'This month' },
    ];
    filtersEl.innerHTML = chips.map(c => `
      <div class="alerts-chip card pressable ${activeFilter === c.key ? 'active' : ''}" data-filter="${c.key}">
        ${isAr ? c.ar : c.en}
      </div>
    `).join('');
    filtersEl.querySelectorAll('[data-filter]').forEach(chip => {
      chip.addEventListener('click', () => {
        activeFilter = chip.getAttribute('data-filter');
        renderFilters();
        renderFeed();
      });
    });
  }

  root.innerHTML = `
    <div>
      <div class="glass" data-hero></div>
      <div class="alerts-filters" data-filters></div>
      <div data-feed></div>
    </div>
  `;

  renderHero();
  renderFilters();
  renderFeed();
}

// Mount function — called by the shell router.
function renderReports(root, ctx){
  const lang = ctx.lang;
  const isAr = lang === 'ar';
  const t = ctx.t;

  const L = (ar, en) => isAr ? ar : en;

  const collections = ['documents','employees','contractors','visitors','companies','organizations'];
  const totalRecords = collections.reduce((sum, c) => sum + DB.list(c).length, 0);

  const documents = DB.list('documents');
  const employees = DB.list('employees');
  const contractors = DB.list('contractors');
  const companies = DB.list('companies');

  // ---- compliance health: share of all tracked expiry dates not already past ----
  const trackedDates = []
    .concat(documents.map(d => d.expiryDate))
    .concat(employees.map(e => e.idExpiry))
    .concat(contractors.map(c => c.contractEnd))
    .concat(companies.map(c => c.licenseExpiry))
    .filter(Boolean);
  const notPastCount = trackedDates.filter(ds => daysUntil(ds) !== null && daysUntil(ds) >= 0).length;
  const healthPct = trackedDates.length ? Math.round((notPastCount / trackedDates.length) * 100) : 100;

  // ---- breakdown tiles ----
  const docCategories = Array.from(new Set(documents.map(d => d.category).filter(Boolean)));
  const empDepts = Array.from(new Set(employees.map(e => e.dept).filter(Boolean)));
  const activeContractors = contractors.filter(c => c.status === 'active').length;
  const companySectors = Array.from(new Set(companies.map(c => c.sector).filter(Boolean)));

  // ---- documents per category (bar chart) ----
  const catCounts = {};
  documents.forEach(d => {
    const key = d.category || L('غير مصنف','Uncategorized');
    catCounts[key] = (catCounts[key] || 0) + 1;
  });
  const catEntries = Object.entries(catCounts).sort((a,b) => b[1]-a[1]);
  const maxCat = Math.max(1, ...catEntries.map(e => e[1]));

  // ---- expiry status distribution across all tracked dates ----
  const statusCounts = { ok:0, warn:0, danger:0, neutral:0 };
  trackedDates.forEach(ds => { statusCounts[expiryStatus(ds)]++; });
  const statusTotal = Math.max(1, statusCounts.ok + statusCounts.warn + statusCounts.danger);

  // ---- top entities by document count ----
  const entCounts = {};
  documents.forEach(d => {
    if(!d.entityType || !d.entityId) return;
    const key = d.entityType + '::' + d.entityId;
    entCounts[key] = (entCounts[key] || 0) + 1;
  });
  const topEntities = Object.entries(entCounts)
    .sort((a,b) => b[1]-a[1])
    .slice(0,3)
    .map(([key,count]) => {
      const [entityType, entityId] = key.split('::');
      return { entityType, entityId, count, label: DB.entityLabel(entityType, entityId) };
    });

  // ---- Export & Share: unified row set across all tracked collections ----
  const statusLabelOf = (ds) => ({
    ok: L('ساري','OK'),
    warn: L('قريب الانتهاء','Expiring soon'),
    danger: L('منتهي','Expired'),
    neutral: '—'
  }[expiryStatus(ds)]);

  const exportRows = []
    .concat(documents.map(d => ({
      type: L('مستند','Document'),
      name: (isAr ? d.titleAr : (d.titleEn || d.titleAr)) || '—',
      category: d.category || '—',
      expiry: d.expiryDate || '—',
      status: statusLabelOf(d.expiryDate)
    })))
    .concat(employees.map(e => ({
      type: L('موظف','Employee'),
      name: (isAr ? e.nameAr : (e.nameEn || e.nameAr)) || '—',
      category: e.dept || '—',
      expiry: e.idExpiry || '—',
      status: statusLabelOf(e.idExpiry)
    })))
    .concat(contractors.map(c => ({
      type: L('مقاول','Contractor'),
      name: (isAr ? c.nameAr : (c.nameEn || c.nameAr)) || '—',
      category: c.service || '—',
      expiry: c.contractEnd || '—',
      status: statusLabelOf(c.contractEnd)
    })))
    .concat(companies.map(c => ({
      type: L('شركة','Company'),
      name: (isAr ? c.nameAr : (c.nameEn || c.nameAr)) || '—',
      category: c.sector || '—',
      expiry: c.licenseExpiry || '—',
      status: statusLabelOf(c.licenseExpiry)
    })));

  const todayStr = new Date().toISOString().slice(0,10);
  const exportTitle = L('تقرير GRRK','GRRK Report');

  const entityTypeLabel = (type) => ({
    employee: L('موظف','Employee'),
    contractor: L('مقاول','Contractor'),
    company: L('شركة','Company'),
    visitor: L('زائر','Visitor'),
    organization: L('جهة','Organization')
  }[type] || type);

  // ---- SVG bar chart (document counts per category) ----
  const barChartH = Math.max(140, catEntries.length * 40 + 20);
  const barRows = catEntries.map((([name, count], i) => {
    const y = 12 + i * 40;
    const barMaxW = 100; // percentage-based width via viewBox 0-100 units for bar, rest is flex via CSS width 100%
    const w = (count / maxCat) * 70; // leave room for label
    const numAlign = isAr ? 'start' : 'end';
    return `
      <g>
        <text x="0" y="${y - 4}" class="rep-bar-label">${repsEscapeHtml(name)}</text>
        <rect x="0" y="${y}" width="100" height="14" rx="7" fill="var(--flat-line)"></rect>
        <rect x="0" y="${y}" width="${w}" height="14" rx="7" fill="url(#repBarGrad)"></rect>
        <text x="${Math.min(w + 3, 94)}" y="${y + 11}" class="rep-bar-value">${count}</text>
      </g>`;
  }));
  const barSvg = `
    <svg viewBox="0 0 100 ${barChartH}" preserveAspectRatio="none" style="height:${barChartH * 2}px" role="img" aria-label="${L('مستندات حسب الفئة','Documents by category')}">
      <defs>
        <linearGradient id="repBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="var(--gold)"></stop>
          <stop offset="100%" stop-color="var(--glow)"></stop>
        </linearGradient>
      </defs>
      ${barRows.join('')}
    </svg>`;

  // ---- SVG stacked bar (expiry status distribution) ----
  const okW = (statusCounts.ok / statusTotal) * 100;
  const warnW = (statusCounts.warn / statusTotal) * 100;
  const dangerW = (statusCounts.danger / statusTotal) * 100;
  // build in logical order so it reads start->end consistently regardless of dir (SVG itself doesn't mirror with dir, so we just keep a fixed visual order: ok, warn, danger)
  let cursor = 0;
  const segs = [
    { w: okW, color: 'var(--ok)' },
    { w: warnW, color: 'var(--warn)' },
    { w: dangerW, color: 'var(--danger)' }
  ];
  const segRects = segs.map(s => {
    const rect = `<rect x="${cursor}" y="0" width="${s.w}" height="100%" fill="${s.color}"></rect>`;
    cursor += s.w;
    return rect;
  }).join('');
  const donutSvg = `
    <svg viewBox="0 0 100 20" preserveAspectRatio="none" style="height:40px; border-radius:10px; overflow:hidden" role="img" aria-label="${L('توزيع حالة انتهاء الصلاحية','Expiry status distribution')}">
      ${segRects}
    </svg>`;

  root.innerHTML = `
    <div>
      <div id="repSnapshotArea">
        <div class="glass">
          <div class="eyebrow">${L('نظرة عامة تنفيذية','Executive Overview')}</div>
          <h1>${totalRecords}<span style="font-size:.5em; color:var(--ink-soft); font-weight:500"> ${L('سجل إجمالي','total records')}</span></h1>
          <p class="muted" style="margin-top:8px">
            ${L('مؤشر سلامة الامتثال العام','Overall compliance health')}:
            <strong style="color:${healthPct >= 80 ? 'var(--ok)' : healthPct >= 50 ? 'var(--warn)' : 'var(--danger)'}" class="num">${healthPct}%</strong>
            ${L(`من ${trackedDates.length} تاريخ انتهاء متتبع لم يمر موعده بعد`, `of ${trackedDates.length} tracked expiry dates not yet past`)}
          </p>
        </div>

        <div class="rep-grid stagger">
          <div class="stat">
            <div class="val num">${docCategories.length}</div>
            <div class="lbl">${L('فئات المستندات','Document categories')}</div>
            <div class="faint" style="margin-top:4px">${documents.length} ${L('مستند بإجمالي','total documents')}</div>
          </div>
          <div class="stat">
            <div class="val num">${empDepts.length}</div>
            <div class="lbl">${L('إدارات الموظفين','Employee departments')}</div>
            <div class="faint" style="margin-top:4px">${employees.length} ${L('موظف','employees')}</div>
          </div>
          <div class="stat">
            <div class="val num">${activeContractors}</div>
            <div class="lbl">${L('مقاولون نشطون','Active contractors')}</div>
            <div class="faint" style="margin-top:4px">${contractors.length} ${L('إجمالي المقاولين','total contractors')}</div>
          </div>
          <div class="stat">
            <div class="val num">${companySectors.length}</div>
            <div class="lbl">${L('قطاعات الشركات','Company sectors')}</div>
            <div class="faint" style="margin-top:4px">${companies.length} ${L('شركة','companies')}</div>
          </div>
        </div>
      </div>

      <div class="rep-section rep-export-card">
        <h2>${L('تصدير ومشاركة','Export & Share')}</h2>
        <div class="card">
          <div class="rep-export-sub">${L('صدّر لقطة كاملة من حالة الامتثال عبر كل السجلات المتتبعة','Export a full snapshot of compliance status across all tracked records')}</div>
          <div class="rep-export-actions">
            <button type="button" class="btn" id="repExportExcelBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>
              ${L('تصدير Excel','Export Excel')}
            </button>
            <button type="button" class="btn" id="repExportPdfBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l3 3v17H6z"/><path d="M15 2v3h3"/><path d="M8.5 13h2M8.5 16h2.5M13.5 13h2v3h-2z"/></svg>
              ${L('تصدير PDF','Export PDF')}
            </button>
            <button type="button" class="btn" id="repExportImageBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>
              ${L('مشاركة كصورة','Share as image')}
            </button>
          </div>
        </div>
      </div>

      <div class="rep-section">
        <h2>${L('المستندات حسب الفئة','Documents by Category')}</h2>
        <div class="card rep-chart-wrap">
          ${catEntries.length ? barSvg : `<div class="empty">${t.empty}</div>`}
        </div>
      </div>

      <div class="rep-section">
        <h2>${L('توزيع حالة انتهاء الصلاحية','Expiry Status Distribution')}</h2>
        <div class="card">
          <div class="rep-chart-wrap">${donutSvg}</div>
          <div class="rep-legend">
            <div class="rep-legend-item"><span class="rep-legend-dot" style="background:var(--ok)"></span>${L('ساري','OK')} — <span class="num">${statusCounts.ok}</span></div>
            <div class="rep-legend-item"><span class="rep-legend-dot" style="background:var(--warn)"></span>${L('قريب الانتهاء','Expiring soon')} — <span class="num">${statusCounts.warn}</span></div>
            <div class="rep-legend-item"><span class="rep-legend-dot" style="background:var(--danger)"></span>${L('منتهي','Expired')} — <span class="num">${statusCounts.danger}</span></div>
          </div>
        </div>
      </div>

      <div class="rep-section">
        <h2>${L('أعلى الجهات بعدد المستندات','Top Entities by Document Count')}</h2>
        ${topEntities.length ? `
          <div class="rep-top-list stagger">
            ${topEntities.map((e, i) => `
              <div class="card rep-top-row">
                <div class="rep-top-rank num">${i+1}</div>
                <div class="rep-top-body">
                  <div class="rep-top-name">${repsEscapeHtml(e.label)}</div>
                  <div class="rep-top-sub">${entityTypeLabel(e.entityType)}</div>
                </div>
                <div class="rep-top-count num" style="color:var(--glow)">${e.count}</div>
              </div>
            `).join('')}
          </div>
        ` : `<div class="empty">${t.empty}</div>`}
      </div>
    </div>
  `;

  // ---- Export & Share wiring ----
  const excelBtn = root.querySelector('#repExportExcelBtn');
  const pdfBtn = root.querySelector('#repExportPdfBtn');
  const imageBtn = root.querySelector('#repExportImageBtn');

  if(excelBtn) excelBtn.addEventListener('click', () => {
    const filename = `GRRK-report-${todayStr}.xlsx`;
    const excelRows = exportRows.map(r => ({
      [L('النوع','Type')]: r.type,
      [L('الاسم','Name')]: r.name,
      [L('الفئة','Category')]: r.category,
      [L('تاريخ الانتهاء','Expiry Date')]: r.expiry,
      [L('الحالة','Status')]: r.status
    }));
    const blob = GRRK_EXPORT.exportExcel(excelRows, filename, L('التقرير','Report'));
    if(blob) GRRK_EXPORT.shareFile(blob, filename, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', exportTitle, ctx.showToast);
  });

  if(pdfBtn) pdfBtn.addEventListener('click', () => {
    const filename = `GRRK-report-${todayStr}.pdf`;
    const columns = [
      { key:'type', label: L('النوع','Type') },
      { key:'name', label: L('الاسم','Name') },
      { key:'category', label: L('الفئة','Category') },
      { key:'expiry', label: L('تاريخ الانتهاء','Expiry Date') },
      { key:'status', label: L('الحالة','Status') }
    ];
    const blob = GRRK_EXPORT.exportPDF(exportTitle, columns, exportRows);
    if(blob) GRRK_EXPORT.shareFile(blob, filename, 'application/pdf', exportTitle, ctx.showToast);
  });

  if(imageBtn) imageBtn.addEventListener('click', async () => {
    const snapEl = root.querySelector('#repSnapshotArea');
    if(!snapEl) return;
    const filename = `GRRK-report-${todayStr}.png`;
    const blob = await GRRK_EXPORT.exportImage(snapEl);
    if(blob) GRRK_EXPORT.shareFile(blob, filename, 'image/png', exportTitle, ctx.showToast);
  });
}

function repsEscapeHtml(str){
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Mount function — called by the shell router.
// root: a DOM element to render into (clear it first: root.innerHTML = '')
// ctx: { lang: 'ar'|'en', t: I18N[lang], showToast(msg), openOverlay(html, onMount), closeOverlay(), rerender() }
function renderSettings(root, ctx){
  root.innerHTML = '';

  const lang = ctx.lang;
  const t = ctx.t;
  const isAr = lang === 'ar';
  const curTheme = document.documentElement.getAttribute('data-theme') || 'night';
  const curAccent = document.documentElement.getAttribute('data-accent') || 'indigo';
  const ACCENTS = [
    {key:'indigo', c1:'#4F72E0', c2:'#8A6416', labelAr:'كحلي', labelEn:'Navy'},
    {key:'forest', c1:'#1F9E63', c2:'#8A6416', labelAr:'أخضر داكن', labelEn:'Forest'},
    {key:'graphite', c1:'#8792A6', c2:'#8A6416', labelAr:'رمادي فولاذي', labelEn:'Graphite'},
  ];

  const screen = document.createElement('div');
  screen.className = '';

  screen.innerHTML = `
    <div class="glass" style="margin-bottom:16px">
      <div class="eyebrow">${isAr ? 'الإعدادات' : 'SETTINGS'}</div>
      <h1 class="h1" style="margin-top:6px">${t.appName}</h1>
      <div class="muted" style="margin-top:4px">${t.appTag}</div>
      <div class="set-build">GRRK · v1.0 · ${isAr ? 'نسخة محلية' : 'Local build'}</div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="set-label">${isAr ? 'اللغة' : 'Language'}</div>
      <div class="set-choices">
        <button type="button" class="choice set-lang-btn ${lang==='ar' ? 'active' : ''}" data-lang="ar">العربية</button>
        <button type="button" class="choice set-lang-btn ${lang==='en' ? 'active' : ''}" data-lang="en">English</button>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="set-label">${isAr ? 'المظهر' : 'Theme'}</div>
      <div class="set-choices">
        <button type="button" class="choice set-theme-btn ${curTheme==='night' ? 'active' : ''}" data-theme="night">${isAr ? 'ليلي' : 'Night'}</button>
        <button type="button" class="choice set-theme-btn ${curTheme==='day' ? 'active' : ''}" data-theme="day">${isAr ? 'نهاري' : 'Day'}</button>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="set-label">${isAr ? 'لون التطبيق' : 'Accent color'}</div>
      <div class="set-swatches">
        ${ACCENTS.map(a => `
          <button type="button" class="set-swatch ${curAccent===a.key?'active':''}" data-accent="${a.key}" style="--sw-color:${a.c1};--sw-color2:${a.c2}">
            <i></i>
            <span>${isAr ? a.labelAr : a.labelEn}</span>
          </button>
        `).join('')}
      </div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="set-label">${isAr ? 'إدارة البيانات' : 'Data management'}</div>
      <div class="set-actions">
        <button type="button" class="btn" id="set-export-btn">${isAr ? 'تصدير البيانات' : 'Export data'}</button>
        <button type="button" class="btn danger" id="set-reset-btn">${isAr ? 'إعادة ضبط للبيانات الافتراضية' : 'Reset to sample data'}</button>
      </div>
    </div>

    <div class="card set-about">
      <div class="set-label">${isAr ? 'حول المنصة' : 'About'}</div>
      <p>${isAr
        ? 'GRRK هي منصة لإدارة العلاقات الحكومية تجمع الموظفين والمقاولين والزوار والشركات والجهات في مكان واحد.'
        : 'GRRK is a government relations management platform that brings employees, contractors, visitors, companies and organizations together in one place.'}</p>
      <p>${isAr
        ? 'تتابع المنصة دورة حياة المستندات الرسمية وتنبهك قبل انتهاء صلاحيتها بوقت كافٍ.'
        : 'It tracks the full lifecycle of official documents and proactively alerts you before they expire.'}</p>
      <p>${isAr
        ? 'الهدف: مراقبة الامتثال باستمرار وتقليل المخاطر التنظيمية على المؤسسة.'
        : 'The goal: continuous compliance monitoring and reduced regulatory risk for the organization.'}</p>
    </div>
  `;

  root.appendChild(screen);

  // ---- Language toggle ----
  screen.querySelectorAll('.set-lang-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const chosen = btn.getAttribute('data-lang');
      if (typeof ctx.setLang === 'function'){
        ctx.setLang(chosen);
      }
      screen.querySelectorAll('.set-lang-btn').forEach(b=>b.classList.toggle('active', b===btn));
    });
  });

  // ---- Theme toggle ----
  screen.querySelectorAll('.set-theme-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const chosen = btn.getAttribute('data-theme');
      if (typeof ctx.setTheme === 'function'){
        ctx.setTheme(chosen);
      } else {
        document.documentElement.setAttribute('data-theme', chosen);
      }
      screen.querySelectorAll('.set-theme-btn').forEach(b=>b.classList.toggle('active', b===btn));
    });
  });

  // ---- Accent color ----
  screen.querySelectorAll('.set-swatch').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const chosen = btn.getAttribute('data-accent');
      if (typeof ctx.setAccent === 'function'){
        ctx.setAccent(chosen);
      } else {
        document.documentElement.setAttribute('data-accent', chosen);
      }
      screen.querySelectorAll('.set-swatch').forEach(b=>b.classList.toggle('active', b===btn));
    });
  });

  // ---- Export data ----
  const exportBtn = screen.querySelector('#set-export-btn');
  exportBtn.addEventListener('click', ()=>{
    try{
      const json = JSON.stringify(DB.state, null, 2);
      const blob = new Blob([json], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const stamp = new Date().toISOString().slice(0,10);
      a.download = `grrk-export-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      ctx.showToast(isAr ? 'تم تصدير البيانات بنجاح' : 'Data exported successfully');
    }catch(e){
      ctx.showToast(isAr ? 'فشل تصدير البيانات' : 'Failed to export data');
    }
  });

  // ---- Reset to sample data ----
  const resetBtn = screen.querySelector('#set-reset-btn');
  resetBtn.addEventListener('click', ()=>{
    const html = `
      <div class="sheet set-sheet-card">
        <h2 class="h2">${isAr ? 'إعادة ضبط البيانات؟' : 'Reset data?'}</h2>

        <div class="set-sheet-actions">
          <button type="button" class="btn ghost" id="set-reset-cancel">${t.cancel}</button>
          <button type="button" class="btn danger" id="set-reset-confirm">${isAr ? 'إعادة الضبط' : 'Reset'}</button>
        </div>
      </div>
    `;
    ctx.openOverlay(html, (overlayEl)=>{
      const cancelBtn = overlayEl.querySelector('#set-reset-cancel');
      const confirmBtn = overlayEl.querySelector('#set-reset-confirm');
      if (cancelBtn){
        cancelBtn.addEventListener('click', ()=>{ ctx.closeOverlay(); });
      }
      if (confirmBtn){
        confirmBtn.addEventListener('click', ()=>{
          DB.reset();
          ctx.closeOverlay();
          ctx.showToast(isAr ? 'تمت إعادة ضبط البيانات' : 'Data reset to sample data');
          if (typeof ctx.rerender === 'function'){
            ctx.rerender();
          } else {
            renderSettings(root, ctx);
          }
        });
      }
    });
  });
}

// ---- static config: per-entityType collection name + field schema ----
const PROFILE_ENTITY_MAP = {
  employee:     { coll:'employees',    icon:'user',     expiryFields:[{key:'idExpiry', labelAr:'انتهاء الهوية', labelEn:'ID Expiry'}] },
  contractor:   { coll:'contractors',  icon:'briefcase', expiryFields:[{key:'contractEnd', labelAr:'نهاية العقد', labelEn:'Contract End'}] },
  company:      { coll:'companies',    icon:'building',  expiryFields:[{key:'licenseExpiry', labelAr:'انتهاء الترخيص', labelEn:'License Expiry'}] },
  organization: { coll:'organizations',icon:'landmark',  expiryFields:[] },
};

// field schema per collection: [key, labelAr, labelEn, kind]  kind: 'text'|'phone'|'date'|'status'
const PROFILE_FIELD_SCHEMA = {
  employees: [
    ['role','الوظيفة','Role','text'],
    ['dept','الإدارة','Department','text'],
    ['nationalId','الهوية الوطنية','National ID','text'],
    ['phone','الهاتف','Phone','phone'],
    ['email','البريد الإلكتروني','Email','text'],
    ['idExpiry','انتهاء الهوية','ID Expiry','date'],
    ['status','الحالة','Status','status'],
  ],
  contractors: [
    ['service','الخدمة','Service','text'],
    ['contact','التواصل','Contact','phone'],
    ['contractEnd','نهاية العقد','Contract End','date'],
    ['status','الحالة','Status','status'],
  ],
  companies: [
    ['crNumber','السجل التجاري','CR Number','text'],
    ['sector','القطاع','Sector','text'],
    ['licenseExpiry','انتهاء الترخيص','License Expiry','date'],
    ['status','الحالة','Status','status'],
  ],
  organizations: [
    ['type','النوع','Type','text'],
    ['contactPerson','مسؤول التواصل','Contact Person','text'],
    ['relationship','طبيعة العلاقة','Relationship','text'],
  ],
};

function profileIcon(name){
  const icons = {
    user:'<path d="M12 12a4 4 0 100-8 4 4 0 000 8z"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/>',
    briefcase:'<rect x="3" y="7" width="18" height="12" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/>',
    building:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/>',
    landmark:'<path d="M3 21h18M5 21V10M19 21V10M12 3l9 5H3l9-5zM9 10v11M15 10v11"/>',
    doc:'<path d="M7 2h8l4 4v16H7z"/><path d="M15 2v4h4"/>',
    back:'<path d="M15 18l-6-6 6-6"/>',
    chevron:'<path d="M9 6l6 6-6 6"/>',
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[name]||icons.doc}</svg>`;
}

function profileEsc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// worst-of status helper: danger > warn > ok > neutral
function profileWorst(a,b){
  const rank = {danger:3, warn:2, ok:1, neutral:0};
  return (rank[b]||0) > (rank[a]||0) ? b : a;
}

function renderProfile(root, ctx, target){
  root.innerHTML = '';
  const lang = ctx.lang, t = ctx.t;
  const isAr = lang === 'ar';

  const wrap = document.createElement('div');
  wrap.className = '';

  // -------- guard: no target / missing entity --------
  const entityType = target && target.entityType;
  const entityId = target && target.entityId;
  const cfg = entityType && PROFILE_ENTITY_MAP[entityType];
  const row = cfg ? DB.get(cfg.coll, entityId) : null;

  if (!cfg || !entityId || !row){
    wrap.innerHTML = `
      <div class="main-top" style="margin-bottom:12px">
        <button class="btn ghost profile-back-btn" type="button" style="width:auto">
          <span class="icon3d sm" style="--i1:var(--glow);--i2:var(--gold2)">${profileIcon('back')}</span>
          ${isAr?'رجوع':'Back'}
        </button>
      </div>
      <div class="empty">${profileEsc(t.empty || (isAr?'لا توجد بيانات بعد':'No data yet'))}</div>
    `;
    root.appendChild(wrap);
    const backBtn = wrap.querySelector('.profile-back-btn');
    if (backBtn) backBtn.addEventListener('click', ()=>{ if (ctx.navigate) ctx.navigate('back'); });
    return;
  }

  const schema = PROFILE_FIELD_SCHEMA[cfg.coll] || [];
  const nameAr = row.nameAr || '—';
  const nameEn = row.nameEn || '—';

  // subtext line: role/type/sector-ish field (first text field)
  const subField = schema.find(f=>f[3]==='text');
  const subAr = subField ? (row[subField[0]] || '') : '';
  const subEn = subField ? (row[subField[0]] || '') : '';

  // -------- linked documents --------
  const docs = DB.list('documents')
    .filter(d => d.entityType === entityType && d.entityId === entityId)
    .map(d => ({...d, status: expiryStatus(d.expiryDate), daysLeft: daysUntil(d.expiryDate)}));

  // -------- overall worst status: entity's own expiry fields + all linked docs --------
  let overallStatus = 'neutral';
  (cfg.expiryFields||[]).forEach(ef=>{
    overallStatus = profileWorst(overallStatus, expiryStatus(row[ef.key]));
  });
  docs.forEach(d=>{ overallStatus = profileWorst(overallStatus, d.status); });

  const statusLabel = {
    ok: t.valid || (isAr?'ساري':'Valid'),
    warn: t.expiringSoon || (isAr?'قريب الانتهاء':'Expiring soon'),
    danger: t.expired || (isAr?'منتهي الصلاحية':'Expired'),
    neutral: isAr?'بلا تواريخ':'No dates',
  }[overallStatus];

  // -------- key-info grid --------
  const kvHtml = schema.map(([key, labelAr, labelEn, kind])=>{
    let raw = row[key];
    let displayVal;
    if (kind === 'status'){
      const sOk = raw === 'active' || raw === 'scheduled';
      const STATUS_LABELS = {
        active:{ar:'نشط',en:'Active'}, inactive:{ar:'غير نشط',en:'Inactive'},
        scheduled:{ar:'مجدول',en:'Scheduled'}, completed:{ar:'مكتمل',en:'Completed'}, cancelled:{ar:'ملغى',en:'Cancelled'},
      };
      const sLabel = STATUS_LABELS[raw] ? (isAr ? STATUS_LABELS[raw].ar : STATUS_LABELS[raw].en) : (raw || '—');
      displayVal = `<span class="badge ${sOk?'ok':'neutral'}">${profileEsc(sLabel)}</span>`;
    } else if (kind === 'phone'){
      displayVal = `<span class="v ltr" style="direction:ltr">${profileEsc(raw || '—')}</span>`;
    } else {
      displayVal = `<span class="v">${profileEsc(raw || '—')}</span>`;
    }
    const label = isAr ? labelAr : labelEn;
    const valueBlock = (kind==='status') ? `<div class="v">${displayVal}</div>` : (kind==='phone' ? `<div>${displayVal}</div>` : `<div class="v">${profileEsc(raw || '—')}</div>`);
    return `<div class="profile-kv"><div class="k">${profileEsc(label)}</div>${valueBlock}</div>`;
  }).join('');

  // -------- linked documents list --------
  const docsHtml = docs.length ? docs.map(d=>{
    const title = isAr ? (d.titleAr||d.titleEn) : (d.titleEn||d.titleAr);
    const badgeLabel = d.status==='danger' ? (t.expired||(isAr?'منتهي الصلاحية':'Expired'))
                      : d.status==='warn' ? (t.expiringSoon||(isAr?'قريب الانتهاء':'Expiring soon'))
                      : d.status==='ok' ? (t.valid||(isAr?'ساري':'Valid'))
                      : (isAr?'—':'—');
    return `
      <button type="button" class="card pressable profile-doc-row" data-doc-id="${profileEsc(d.id)}">
        <span class="icon3d sm" style="--i1:var(--glow);--i2:var(--gold2)">${profileIcon('doc')}</span>
        <span class="doc-main">
          <span class="doc-title-ar">${profileEsc(title)}</span>
          <span class="doc-sub">${profileEsc(d.category||'')} · ${profileEsc(d.expiryDate||'—')}</span>
        </span>
        <span class="badge ${d.status}">${profileEsc(badgeLabel)}</span>
      </button>
    `;
  }).join('') : `<div class="empty">${profileEsc(t.empty || (isAr?'لا توجد بيانات بعد':'No data yet'))}</div>`;

  // -------- timeline: own expiry fields + each linked doc's issue/expiry dates --------
  const timelineEvents = [];
  (cfg.expiryFields||[]).forEach(ef=>{
    if (row[ef.key]) timelineEvents.push({
      date: row[ef.key],
      labelAr: ef.labelAr, labelEn: ef.labelEn,
    });
  });
  docs.forEach(d=>{
    const dt = isAr ? (d.titleAr||d.titleEn) : (d.titleEn||d.titleAr);
    if (d.issueDate) timelineEvents.push({ date: d.issueDate, labelAr: `${dt} — إصدار`, labelEn: `${dt} — Issued` });
    if (d.expiryDate) timelineEvents.push({ date: d.expiryDate, labelAr: `${dt} — انتهاء`, labelEn: `${dt} — Expiry` });
  });
  timelineEvents.sort((a,b)=> new Date(a.date) - new Date(b.date));

  const today = new Date(); today.setHours(0,0,0,0);
  const timelineHtml = timelineEvents.length ? timelineEvents.map(ev=>{
    const isFuture = new Date(ev.date) >= today;
    const dotColor = isFuture ? 'var(--ok)' : 'var(--ink-faint)';
    return `
      <div class="profile-tl-row">
        <span class="profile-tl-dot" style="background:${dotColor}"></span>
        <span class="profile-tl-main">
          <span class="profile-tl-label">${profileEsc(isAr ? ev.labelAr : ev.labelEn)}</span>
          <span class="profile-tl-date">${profileEsc(ev.date)}</span>
        </span>
      </div>
    `;
  }).join('') : `<div class="empty">${profileEsc(t.empty || (isAr?'لا توجد بيانات بعد':'No data yet'))}</div>`;

  wrap.innerHTML = `
    <div style="margin-bottom:12px">
      <button class="btn ghost profile-back-btn" type="button" style="width:auto">
        <span class="icon3d sm" style="--i1:var(--glow);--i2:var(--gold2)">${profileIcon('back')}</span>
        ${isAr?'رجوع':'Back'}
      </button>
    </div>

    <div class="glass profile-hero">
      <span class="icon3d" style="--i1:var(--glow);--i2:var(--gold2)">${profileIcon(cfg.icon)}</span>
      <div class="profile-identity">
        <div class="name-ar">${profileEsc(nameAr)}</div>
        <div class="name-en">${profileEsc(nameEn)}</div>
        ${subAr ? `<div class="subline">${profileEsc(isAr ? subAr : subEn)}</div>` : ''}
      </div>
      <span class="badge ${overallStatus} profile-status">${profileEsc(statusLabel)}</span>
    </div>

    <div class="profile-section">
      <div class="section-head"><h2 class="h2">${isAr?'البيانات الأساسية':'Key Information'}</h2></div>
      <div class="card profile-kv-grid">${kvHtml}</div>
    </div>

    <div class="profile-section">
      <div class="section-head">
        <h2 class="h2">${isAr?'المستندات المرتبطة':'Linked Documents'}</h2>
        <span class="faint">${docs.length} ${isAr?'مستند':'docs'}</span>
      </div>
      <div class="stagger">${docsHtml}</div>
    </div>

    <div class="profile-section">
      <div class="section-head"><h2 class="h2">${isAr?'المخطط الزمني':'Timeline'}</h2></div>
      <div class="card profile-timeline">${timelineHtml}</div>
    </div>
  `;

  root.appendChild(wrap);

  // -------- events --------
  const backBtn = wrap.querySelector('.profile-back-btn');
  if (backBtn) backBtn.addEventListener('click', ()=>{ if (ctx.navigate) ctx.navigate('back'); });

  wrap.querySelectorAll('.profile-doc-row').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const docId = btn.getAttribute('data-doc-id');
      const doc = DB.get('documents', docId);
      if (!doc || !ctx.openOverlay) return;
      const title = isAr ? (doc.titleAr||doc.titleEn) : (doc.titleEn||doc.titleAr);
      const docFields = [
        ['titleAr','العنوان (عربي)','Title (Arabic)'],
        ['titleEn','العنوان (إنجليزي)','Title (English)'],
        ['number','الرقم المرجعي','Reference Number'],
        ['category','التصنيف','Category'],
        ['issueDate','تاريخ الإصدار','Issue Date'],
        ['expiryDate','تاريخ الانتهاء','Expiry Date'],
      ];
      const status = expiryStatus(doc.expiryDate);
      const badgeLabel = status==='danger' ? (t.expired||(isAr?'منتهي الصلاحية':'Expired'))
                        : status==='warn' ? (t.expiringSoon||(isAr?'قريب الانتهاء':'Expiring soon'))
                        : status==='ok' ? (t.valid||(isAr?'ساري':'Valid')) : '—';
      const html = `
        <div class="overlay">
          <div class="sheet glass">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
              <h2 class="h2">${profileEsc(title)}</h2>
              <span class="badge ${status}">${profileEsc(badgeLabel)}</span>
            </div>
            <div class="profile-doc-overlay-grid">
              ${docFields.map(([key,labelAr,labelEn])=>`
                <div class="profile-kv">
                  <div class="k">${profileEsc(isAr?labelAr:labelEn)}</div>
                  <div class="v">${profileEsc(doc[key] || '—')}</div>
                </div>
              `).join('')}
            </div>
            <button class="btn ghost profile-doc-close-btn" type="button" style="margin-top:16px">${isAr?'إغلاق':'Close'}</button>
          </div>
        </div>
      `;
      ctx.openOverlay(html, (overlayRoot)=>{
        const closeBtn = overlayRoot.querySelector('.profile-doc-close-btn');
        if (closeBtn) closeBtn.addEventListener('click', ()=>{ if (ctx.closeOverlay) ctx.closeOverlay(); });
      });
    });
  });
}
