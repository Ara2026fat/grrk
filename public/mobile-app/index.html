      headphone: '<path d="M4 13v4a2 2 0 0 0 2 2h1v-7H5a2 2 0 0 0-2 2z"/><path d="M20 13v4a2 2 0 0 1-2 2h-1v-7h1a2 2 0 0 1 2 2z"/><path d="M4 13a8 8 0 0 1 16 0"/>',
      play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5-6-3.5z" fill="currentColor" stroke="none"/>',
      drive: '<path d="M8 3h8l5 9-4 9H7L3 12z"/><path d="M8 3l5 9m0 0l-4 9m4-9h8"/>',
      link: '<path d="M9 15l6-6"/><path d="M11 6l1-1a4 4 0 0 1 6 6l-1 1"/><path d="M13 18l-1 1a4 4 0 0 1-6-6l1-1"/>',
      chevron: L ? '<path d="M15 18l-6-6 6-6"/>' : '<path d="M9 18l6-6-6-6"/>',
      x: '<path d="M18 6L6 18M6 6l12 12"/>',
      trash: '<path d="M4 7h16M9 7V4h6v3m-7 0l1 13h8l1-13"/>',
      caret: '<path d="M9 6l6 6-6 6"/>',
      warn: '<path d="M12 9v4"/><circle cx="12" cy="16" r="0.6" fill="currentColor"/><path d="M10.3 4.3L2.8 18a1 1 0 0 0 .9 1.5h16.6a1 1 0 0 0 .9-1.5L13.7 4.3a1 1 0 0 0-1.8 0z"/>',
      share: '<circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.7l7.4-4.2M8.3 13.3l7.4 4.2"/>',
    };
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[name]||''}</svg>`;
  }

  function iconColors(mediaType){
    switch(mediaType){
      case 'audio': return ['#4F72E0', '#8792E8'];
      case 'video': return ['#F2667A', '#C9324E'];
      case 'youtube': return ['#FF4B4B', '#C21818'];
      case 'drive': return ['#52B788', '#1F9E63'];
      default: return ['#C9932E', '#8A6416'];
    }
  }

  function iconFor(mediaType){
    if(mediaType === 'audio') return 'headphone';
    if(mediaType === 'video' || mediaType === 'youtube') return 'play';
    if(mediaType === 'drive') return 'drive';
    return 'link';
  }

  // ---------- URL / media detection ----------
  function extOf(url){
    const clean = (url.split('?')[0] || '').split('#')[0];
    const m = clean.match(/\.([a-zA-Z0-9]+)$/);
    return m ? m[1].toLowerCase() : '';
  }
  function youTubeId(url){
    let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
  }
  function driveFileId(url){
    let m = url.match(/\/d\/([A-Za-z0-9_-]+)/) || url.match(/[?&]id=([A-Za-z0-9_-]+)/);
    return m ? m[1] : null;
  }
  // Returns { mediaType, playable } — playable is used at render time to build the actual player.
  function detectMediaType(src){
    if(!src) return 'link';
    const s = src.trim();
    if(/^data:audio/i.test(s)) return 'audio';
    if(/^data:video/i.test(s)) return 'video';
    const isHttp = /^https?:\/\//i.test(s);
    if(isHttp){
      if(/youtu\.be|youtube\.com/i.test(s)) return 'youtube';
      if(/drive\.google\.com/i.test(s)) return 'drive';
      const ext = extOf(s);
      if(['mp3','wav','m4a','aac','ogg','oga','flac'].includes(ext)) return 'audio';
      if(['mp4','webm','mov','m4v'].includes(ext)) return 'video';
      return 'link';
    }
    // relative path (self-hosted alongside index.html)
    const ext = extOf(s);
    if(['mp3','wav','m4a','aac','ogg','oga','flac'].includes(ext)) return 'audio';
    if(['mp4','webm','mov','m4v'].includes(ext)) return 'video';
    return 'link';
  }

  function buildPlayerHtml(item){
    const src = item.src || '';
    const type = item.mediaType || detectMediaType(src);
    if(!src){
      return `<div class="lib-link-open muted">${tr('لا يوجد رابط أو ملف مُرفق لهذا العنصر.','No link or file attached for this item.')}</div>`;
    }
    if(type === 'audio'){
      return `<div class="lib-player-wrap"><audio controls preload="none" src="${escapeAttr(src)}"></audio></div>`;
    }
    if(type === 'video'){
      return `<div class="lib-player-wrap"><video controls preload="none" src="${escapeAttr(src)}"></video></div>`;
    }
    if(type === 'youtube'){
      const id = youTubeId(src);
      if(id){
        return `<div class="lib-iframe-box"><iframe src="https://www.youtube.com/embed/${id}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
      }
    }
    if(type === 'drive'){
      const id = driveFileId(src);
      if(id){
        return `<div class="lib-iframe-box"><iframe src="https://drive.google.com/file/d/${id}/preview" allowfullscreen></iframe></div>`;
      }
    }
    // generic link fallback
    return `<div class="lib-link-open">
      <a class="btn primary auto" href="${escapeAttr(src)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">${tr('فتح في نافذة جديدة','Open in new tab')}</a>
    </div>`;
  }

  function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }
  function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function typeLabel(t){
    const map = {
      audio: tr('صوت','Audio'), video: tr('فيديو','Video'), youtube: tr('يوتيوب','YouTube'),
      drive: tr('درايف','Drive'), link: tr('رابط','Link')
    };
    return map[t] || map.link;
  }

  function getItems(){ return DB.list('library'); }

  function categories(){
    const set = new Set();
    getItems().forEach(it => { if(it.category) set.add(it.category); });
    return Array.from(set);
  }

  function filteredItems(){
    const q = search.trim().toLowerCase();
    return getItems().filter(it => {
      if(activeCategory !== '__all__' && it.category !== activeCategory) return false;
      if(!q) return true;
      const hay = `${it.titleAr||''} ${it.titleEn||''} ${it.category||''}`.toLowerCase();
      return hay.includes(q);
    });
  }

  function paint(){
    const items = getItems();
    const shown = filteredItems();
    const cats = categories();

    root.innerHTML = `
      <div>
        <div class="glass">
          <div class="lib-hero-row">
            <div>
              <div class="eyebrow">${tr('مكتبة التدريب','Training Library')}</div>
              <div class="lib-hero-count">${items.length}<span>${tr('مقطع صوتي / فيديو','audio & video clips')}</span></div>
            </div>
            <div class="icon3d" style="--i1:#4F72E0;--i2:#8A6416">${icon('headphone')}</div>
          </div>
          <div class="lib-search">
            <input id="lib-search-input" type="text" placeholder="${tr('ابحث بالعنوان أو التصنيف...','Search by title or category...')}" value="${escapeAttr(search)}" />
          </div>
        </div>

        <div class="lib-chips" id="lib-chips">
          <button class="lib-chip ${activeCategory==='__all__'?'active':''}" data-cat="__all__">${tr('الكل','All')}</button>
          ${cats.map(c=>`<button class="lib-chip ${activeCategory===c?'active':''}" data-cat="${escapeAttr(c)}">${escapeHtml(c)}</button>`).join('')}
        </div>

        <div class="lib-list stagger" id="lib-list">
          ${shown.length ? shown.map(rowHtml).join('') : `<div class="empty">${ctx.t.empty || tr('لا توجد بيانات بعد','No data yet')}</div>`}
        </div>
      </div>
      <button class="fab" id="lib-fab" aria-label="${tr('إضافة','Add')}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    `;

    root.querySelector('#lib-search-input').addEventListener('input', (e) => {
      search = e.target.value;
      paint();
      // restore focus & caret after re-render
      const inp = root.querySelector('#lib-search-input');
      if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    });

    root.querySelectorAll('#lib-chips [data-cat]').forEach(btn => {
      btn.addEventListener('click', () => { activeCategory = btn.getAttribute('data-cat'); paint(); });
    });

    root.querySelectorAll('.lib-row').forEach(row => {
      row.addEventListener('click', () => openDetail(row.getAttribute('data-id')));
    });

    root.querySelector('#lib-fab').addEventListener('click', () => openForm(null));
  }

  function rowHtml(item){
    const type = item.mediaType || detectMediaType(item.src);
    const [i1, i2] = iconColors(type);
    const title = L ? (item.titleAr || item.titleEn) : (item.titleEn || item.titleAr);
    return `
      <div class="card pressable lib-row" data-id="${item.id}">
        <div class="icon3d" style="--i1:${i1};--i2:${i2}">${icon(iconFor(type))}</div>
        <div class="lib-row-body">
          <div class="lib-row-title">${escapeHtml(title || tr('بدون عنوان','Untitled'))}</div>
          <div class="lib-row-sub">
            ${item.category ? `<span class="badge neutral">${escapeHtml(item.category)}</span>` : ''}
            <span>${typeLabel(type)}</span>
          </div>
        </div>
        <div class="lib-row-chevron">${icon('chevron')}</div>
      </div>
    `;
  }

  // ---------- Detail sheet ----------
  function openDetail(id){
    const item = DB.get('library', id);
    if(!item) return;
    const title = L ? (item.titleAr || item.titleEn) : (item.titleEn || item.titleAr);
    const notesAr = item.notesAr || '';
    const notesEn = item.notesEn || '';
    const html = `
      <div class="sheet glass" id="lib-detail-sheet">
        <div class="lib-sheet-title">${escapeHtml(title || tr('بدون عنوان','Untitled'))}</div>
        <div class="lib-sheet-sub">${item.category ? escapeHtml(item.category) + ' · ' : ''}${typeLabel(item.mediaType || detectMediaType(item.src))}</div>
        ${buildPlayerHtml(item)}
        ${(notesAr || notesEn) ? `
          <div class="lib-notes">
            ${L ? (notesAr ? `<b>${tr('ملاحظات','Notes')}</b>${escapeHtml(notesAr)}` : (notesEn?`<b>${tr('ملاحظات','Notes')}</b>${escapeHtml(notesEn)}`:'')) :
                  (notesEn ? `<b>Notes</b>${escapeHtml(notesEn)}` : (notesAr?`<b>Notes</b>${escapeHtml(notesAr)}`:''))}
          </div>` : ''}
        <div class="lib-actions lib-actions-3">
          <button class="btn ghost" id="lib-detail-share" ${!item.src ? 'disabled' : ''}>${icon('share')} ${tr('مشاركة','Share')}</button>
          <button class="btn ghost" id="lib-detail-edit">${ctx.t.edit || tr('تعديل','Edit')}</button>
          <button class="btn danger" id="lib-detail-delete">${ctx.t.delete || tr('حذف','Delete')}</button>
        </div>
        ${!item.src ? `<div class="lib-share-note">${tr('لا يوجد ملف أو رابط لمشاركته.','Nothing attached yet to share.')}</div>` : ''}
      </div>
    `;
    ctx.openOverlay(html, () => {
      root.querySelector('#lib-detail-edit')?.addEventListener('click', () => { ctx.closeOverlay(); openForm(item); });
      root.querySelector('#lib-detail-delete')?.addEventListener('click', () => { confirmDelete(item); });
      const shareBtn = root.querySelector('#lib-detail-share');
      if(shareBtn && item.src){
        shareBtn.addEventListener('click', () => shareItem(item));
      }
    });
  }

  // ---------- Share ----------
  // Guesses a file extension from a data: URL's mime type (header before the comma).
  function extFromMime(mime){
    const map = {
      'audio/mpeg':'mp3', 'audio/mp3':'mp3', 'audio/wav':'wav', 'audio/x-wav':'wav',
      'audio/mp4':'m4a', 'audio/aac':'aac', 'audio/ogg':'ogg', 'audio/flac':'flac', 'audio/webm':'weba',
      'video/mp4':'mp4', 'video/webm':'webm', 'video/quicktime':'mov', 'video/x-m4v':'m4v'
    };
    return map[mime] || (mime && mime.startsWith('video') ? 'mp4' : 'mp3');
  }

  async function shareItem(item){
    const title = L ? (item.titleAr || item.titleEn) : (item.titleEn || item.titleAr);
    const src = item.src || '';
    if(!src){ ctx.showToast(tr('لا يوجد شيء لمشاركته.','Nothing to share.')); return; }

    if(src.startsWith('data:')){
      // A real local file we hold in memory — share the actual bytes.
      try{
        const res = await fetch(src);
        const blob = await res.blob();
        const mime = blob.type || (item.mediaType === 'video' ? 'video/mp4' : 'audio/mpeg');
        const ext = extFromMime(mime);
        const safeName = (title || (item.mediaType === 'video' ? tr('مقطع فيديو','clip') : tr('مقطع صوتي','clip'))).replace(/[^\w؀-ۿ\- ]+/g, '').trim() || 'clip';
        const filename = `${safeName}.${ext}`;
        await GRRK_EXPORT.shareFile(blob, filename, mime, title || filename, ctx.showToast);
      }catch(e){
        ctx.showToast(tr('تعذرت مشاركة الملف.','Could not share the file.'));
      }
    } else {
      // External URL (YouTube / Drive / direct link) — we can only share the link itself,
      // a static page cannot fetch and re-attach arbitrary cross-origin bytes.
      await GRRK_EXPORT.shareText(src, title || src, ctx.showToast);
    }
  }

  function confirmDelete(item){
    const title = L ? (item.titleAr || item.titleEn) : (item.titleEn || item.titleAr);
    const html = `
      <div class="sheet glass">
        <div class="lib-confirm-icon">${icon('warn')}</div>
        <div class="lib-sheet-title" style="text-align:center">${tr('تأكيد الحذف','Confirm delete')}</div>
        <div class="lib-sheet-sub" style="text-align:center">${tr('سيتم حذف','This will delete')} "${escapeHtml(title||'')}" ${tr('نهائياً.','permanently.')}</div>
        <div class="lib-actions">
          <button class="btn ghost" id="lib-confirm-cancel">${ctx.t.cancel || tr('إلغاء','Cancel')}</button>
          <button class="btn danger" id="lib-confirm-ok">${ctx.t.delete || tr('حذف','Delete')}</button>
        </div>
      </div>
    `;
    ctx.openOverlay(html, () => {
      root.querySelector('#lib-confirm-cancel')?.addEventListener('click', () => ctx.closeOverlay());
      root.querySelector('#lib-confirm-ok')?.addEventListener('click', () => {
        DB.remove('library', item.id);
        ctx.closeOverlay();
        ctx.showToast(tr('تم الحذف','Deleted'));
        paint();
      });
    });
  }

  // ---------- Add / Edit form ----------
  function openForm(item){
    const isEdit = !!item;
    const v = item || { titleAr:'', titleEn:'', category:'', mediaType:'', src:'', notesAr:'', notesEn:'' };
    const html = `
      <div class="sheet glass">
        <div class="lib-sheet-title">${isEdit ? (ctx.t.edit||tr('تعديل','Edit')) : (ctx.t.add||tr('إضافة','Add'))}</div>
        <div class="lib-sheet-sub">${tr('مقطع تدريبي صوتي أو فيديو','Training audio or video clip')}</div>

        <div class="lib-form-row2">
          <div class="field">
            <label>${tr('العنوان (عربي)','Title (Arabic)')}</label>
            <input id="lib-f-titleAr" type="text" value="${escapeAttr(v.titleAr)}" placeholder="${tr('مثال: شرح نموذج الترخيص','e.g. License form walkthrough')}"/>
          </div>
          <div class="field">
            <label>${tr('العنوان (إنجليزي)','Title (English)')}</label>
            <input id="lib-f-titleEn" type="text" value="${escapeAttr(v.titleEn)}" placeholder="e.g. License form walkthrough"/>
          </div>
        </div>

        <div class="field">
          <label>${tr('التصنيف','Category')}</label>
          <input id="lib-f-category" type="text" value="${escapeAttr(v.category)}" placeholder="${tr('مثال: تدريب عام، امتثال، تراخيص...','e.g. General training, Compliance, Licensing...')}"/>
        </div>

        <div class="field">
          <label>${tr('رابط المقطع (يوتيوب / درايف / ملف مباشر)','Clip URL (YouTube / Drive / direct file)')}</label>
          <input id="lib-f-src" type="text" value="${escapeAttr(v.src && !v.src.startsWith('data:') ? v.src : '')}" placeholder="https://..."/>
          <div class="lib-upload-note">${tr('يتم تحديد نوع الوسائط تلقائياً من الرابط (يوتيوب، درايف، ملف صوتي/فيديو مباشر، أو رابط عادي).','Media type is detected automatically from the URL (YouTube, Drive, direct audio/video file, or a plain link).')}</div>
        </div>

        <details class="lib-disclosure" id="lib-upload-disclosure">
          <summary>${icon('caret')} ${tr('أو ارفع ملفاً صغيراً من هذا الجهاز','Or upload a small file from this device')}</summary>
          <div class="lib-upload-box">
            <div class="field" style="margin-bottom:8px">
              <input id="lib-f-file" type="file" accept="audio/*,video/*"/>
            </div>
            <div class="lib-upload-note">${tr('يُحفظ على هذا الجهاز فقط، غير مشترك مع باقي المندوبين. الحد الأقصى 3 ميغابايت.','Saved to this device only — not shared with other reps. Maximum 3MB.')}</div>
            <div id="lib-file-status" class="lib-upload-note"></div>
          </div>
        </details>

        <div class="field" style="margin-top:10px">
          <label>${tr('ملاحظات (عربي)','Notes (Arabic)')}</label>
          <textarea id="lib-f-notesAr" rows="2" placeholder="${tr('اختياري','Optional')}">${escapeHtml(v.notesAr)}</textarea>
        </div>
        <div class="field">
          <label>${tr('ملاحظات (إنجليزي)','Notes (English)')}</label>
          <textarea id="lib-f-notesEn" rows="2" placeholder="Optional">${escapeHtml(v.notesEn)}</textarea>
        </div>

        <div class="lib-actions">
          <button class="btn ghost" id="lib-form-cancel">${ctx.t.cancel || tr('إلغاء','Cancel')}</button>
          <button class="btn primary" id="lib-form-save">${ctx.t.save || tr('حفظ','Save')}</button>
        </div>
      </div>
    `;

    let uploadedDataUrl = (v.src && v.src.startsWith('data:')) ? v.src : null;
    let uploadedMediaType = null;

    ctx.openOverlay(html, () => {
      const fileInput = root.querySelector('#lib-f-file');
      const statusEl = root.querySelector('#lib-file-status');

      if(uploadedDataUrl && statusEl){
        statusEl.textContent = tr('يوجد ملف مرفوع محفوظ على هذا الجهاز.','A device-saved file is currently attached.');
      }

      fileInput?.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if(!file) return;
        const MAX_BYTES = 3 * 1024 * 1024; // 3MB
        if(file.size > MAX_BYTES){
          ctx.showToast(tr('حجم الملف أكبر من 3 ميغابايت — لا يمكن حفظه على الجهاز.','File is larger than 3MB — cannot be saved on this device.'));
          fileInput.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          uploadedDataUrl = reader.result;
          uploadedMediaType = file.type.startsWith('video') ? 'video' : 'audio';
          if(statusEl) statusEl.textContent = tr(`تم تحميل: ${file.name}`, `Loaded: ${file.name}`);
          // clear the URL field since the uploaded file takes precedence
          const srcInput = root.querySelector('#lib-f-src');
          if(srcInput) srcInput.value = '';
        };
        reader.onerror = () => {
          ctx.showToast(tr('تعذر قراءة الملف.','Could not read the file.'));
        };
        reader.readAsDataURL(file);
      });

      root.querySelector('#lib-form-cancel')?.addEventListener('click', () => ctx.closeOverlay());
      root.querySelector('#lib-form-save')?.addEventListener('click', () => {
        const titleAr = root.querySelector('#lib-f-titleAr').value.trim();
        const titleEn = root.querySelector('#lib-f-titleEn').value.trim();
        const category = root.querySelector('#lib-f-category').value.trim();
        const urlVal = root.querySelector('#lib-f-src').value.trim();
        const notesAr = root.querySelector('#lib-f-notesAr').value.trim();
        const notesEn = root.querySelector('#lib-f-notesEn').value.trim();

        if(!titleAr && !titleEn){
          ctx.showToast(tr('يرجى إدخال عنوان على الأقل.','Please enter at least one title.'));
          return;
        }

        let src = '';
        let mediaType = 'link';
        if(uploadedDataUrl){
          src = uploadedDataUrl;
          mediaType = uploadedMediaType || 'audio';
        } else if(urlVal){
          src = urlVal;
          mediaType = detectMediaType(urlVal);
        }

        const payload = { titleAr, titleEn, category, mediaType, src, notesAr, notesEn };

        if(isEdit){
          DB.update('library', item.id, payload);
          ctx.showToast(tr('تم الحفظ','Saved'));
        } else {
          DB.add('library', payload);
          ctx.showToast(tr('تمت الإضافة','Added'));
        }
        ctx.closeOverlay();
        paint();
      });
    });
  }

  paint();
}

.forms-empty-icon{ width:68px; height:68px; margin:0 auto 16px; border-radius:22px; display:grid; place-items:center;
  background:radial-gradient(120% 120% at 25% 20%, rgba(255,255,255,.5), transparent 55%), linear-gradient(155deg, var(--glow), var(--gold2));
  box-shadow:0 10px 24px -8px var(--glow-tint), inset 0 1px 0 rgba(255,255,255,.35); color:#fff }

.forms-detail-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:3px }
.forms-detail-desc{ font-size:14.5px; line-height:1.7; color:var(--ink); margin:14px 0 18px; white-space:pre-wrap }
.forms-nolink-note{ font-size:12.5px; color:var(--ink-faint); text-align:center; margin-top:8px }
.forms-hint{ font-size:12px; color:var(--ink-faint); margin-top:6px; line-height:1.5 }
.forms-sheet-actions{ display:flex; gap:10px; margin-top:6px }
.forms-sheet-actions .btn{ width:auto; flex:1 }
.forms-confirm-icon{ width:52px; height:52px; margin:0 auto 14px; border-radius:16px; display:grid; place-items:center;
  background:rgba(255,107,129,.14); color:var(--danger) }
.forms-confirm-icon svg{ width:26px; height:26px }

.forms-export-row .btn{ flex:none }

// Mount function — called by the shell router.
function renderForms(root, ctx){
  const lang = ctx.lang;
  const t = ctx.t;
  const isAr = lang === 'ar';

  const L = {
    title: isAr ? 'النماذج' : 'Forms',
    tag: isAr ? 'مكتبة النماذج والمستندات الرسمية' : 'Library of official form templates',
    totalLbl: isAr ? 'إجمالي النماذج' : 'Total forms',
    searchPh: isAr ? 'بحث بالاسم أو التصنيف...' : 'Search by title or category...',
    all: isAr ? 'الكل' : 'All',
    uncategorized: isAr ? 'بدون تصنيف' : 'Uncategorized',
    emptyTitle: isAr ? 'لا توجد نماذج بعد' : 'No forms yet',
    emptyBody: isAr
      ? 'ابدأ بإضافة أول نموذج عبر زر (+) — عنوان، تصنيف، ورابط الملف.'
      : 'Add your first form template with the + button — a title, category, and a file link.',
    open: isAr ? 'فتح' : 'Open',
    openForm: isAr ? 'فتح النموذج' : 'Open form',
    noLink: isAr ? 'لم تتم إضافة رابط للملف بعد' : 'No file link has been added yet',
    updated: isAr ? 'آخر تحديث' : 'Updated',
    addTitle: isAr ? 'إضافة نموذج' : 'Add form',
    editTitle: isAr ? 'تعديل النموذج' : 'Edit form',
    titleAr: isAr ? 'العنوان (عربي)' : 'Title (Arabic)',
    titleEn: isAr ? 'العنوان (إنجليزي)' : 'Title (English)',
    category: isAr ? 'التصنيف' : 'Category',
    fileUrl: isAr ? 'رابط الملف' : 'File URL',
    fileUrlHint: isAr
      ? 'يمكن أن يكون رابط مشاركة من Google Drive، أو رابط مباشر لملف PDF/Word، أو مسار نسبي لملف ترفعه في مستودعك (مثل forms/form1.pdf).'
      : 'Can be a Google Drive share link, a direct PDF/Word URL, or a relative path to a file you upload in your repo (e.g. forms/form1.pdf).',
    descAr: isAr ? 'الوصف (عربي)' : 'Description (Arabic)',
    descEn: isAr ? 'الوصف (إنجليزي)' : 'Description (English)',
    updatedDate: isAr ? 'تاريخ آخر تحديث' : 'Last updated date',
    save: t.save, cancel: t.cancel, delete: t.delete, edit: t.edit, add: t.add,
    deleteConfirmTitle: isAr ? 'حذف النموذج؟' : 'Delete this form?',
    deleteConfirmBody: isAr
      ? 'سيتم حذف هذا النموذج نهائياً من المكتبة. لا يمكن التراجع عن هذا الإجراء.'
      : 'This form will be permanently removed from the library. This cannot be undone.',
    savedToast: isAr ? 'تم الحفظ بنجاح' : 'Saved successfully',
    deletedToast: isAr ? 'تم حذف النموذج' : 'Form deleted',
    noDesc: isAr ? 'لا يوجد وصف لهذا النموذج.' : 'No description provided for this form.',
    validation: isAr ? 'يرجى إدخال العنوان بالعربي والإنجليزي على الأقل' : 'Please enter at least the Arabic and English title',
    exportExcel: isAr ? 'تصدير Excel' : 'Export Excel',
    exportPDF: isAr ? 'تصدير PDF' : 'Export PDF',
    shareLink: isAr ? 'مشاركة الرابط' : 'Share link',
    colTitle: isAr ? 'العنوان' : 'Title',
    colCategory: isAr ? 'التصنيف' : 'Category',
  };

  let search = '';
  let activeCategory = L.all;

  function iconDoc(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
      <path d="M14 3v4h4"/>
      <path d="M9 13h6"/><path d="M9 17h6"/><path d="M9 9h2"/>
    </svg>`;
  }
  function iconOpen(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/>
    </svg>`;
  }
  function iconTrash(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      <path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/>
    </svg>`;
  }
  function iconEdit(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>`;
  }
  function iconPlus(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>`;
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function getItems(){ return DB.list('forms') || []; }
  function getCategories(items){
    const set = new Set();
    items.forEach(f=>{ if(f.category) set.add(f.category); });
    return [L.all, ...Array.from(set)];
  }
  function titleOf(f){ return isAr ? (f.titleAr || f.titleEn || '') : (f.titleEn || f.titleAr || ''); }
  function descOf(f){ return isAr ? (f.descriptionAr || f.descriptionEn || '') : (f.descriptionEn || f.descriptionAr || ''); }
  function catOf(f){ return f.category || L.uncategorized; }

  function filtered(){
    const items = getItems();
    const q = search.trim().toLowerCase();
    return items.filter(f=>{
      if(activeCategory !== L.all && catOf(f) !== activeCategory) return false;
      if(!q) return true;
      const hay = `${f.titleAr||''} ${f.titleEn||''} ${f.category||''}`.toLowerCase();
      return hay.includes(q);
    });
  }

  function iconPair(idx){
    const pairs = [
      ['#4F72E0','#C9932E'], ['#1F9E63','#52E3A6'], ['#C9932E','#F2C879'],
      ['#8792A6','#4F72E0'], ['#FF6B81','#C9932E'], ['#52E3A6','#1F9E63'],
    ];
    return pairs[idx % pairs.length];
  }

  function exportRows(){
    return filtered().map(f=>({
      [L.colTitle]: titleOf(f),
      [L.colCategory]: catOf(f),
      [L.updated]: f.updatedDate || '',
    }));
  }

  function doExportExcel(){
    const rows = exportRows();
    const date = new Date().toISOString().slice(0,10);
    const blob = GRRK_EXPORT.exportExcel(rows, `GRRK-forms-${date}.xlsx`, 'forms');
    if(blob) GRRK_EXPORT.shareFile(blob, `GRRK-forms-${date}.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', L.title, ctx.showToast);
  }

  function doExportPDF(){
    const rows = exportRows();
    const cols = [L.colTitle, L.colCategory, L.updated].map(l=>({key:l,label:l}));
    const date = new Date().toISOString().slice(0,10);
    const blob = GRRK_EXPORT.exportPDF(L.title, cols, rows);
    if(blob) GRRK_EXPORT.shareFile(blob, `GRRK-forms-${date}.pdf`, 'application/pdf', L.title, ctx.showToast);
  }

  function paint(){
    const items = getItems();
    const cats = getCategories(items);
    const list = filtered();

    root.innerHTML = `
      <div>
        <div class="glass">
          <div class="forms-hero-row">
            <div>
              <div class="eyebrow">${esc(L.title)}</div>
              <div class="forms-hero-val num">${items.length}</div>
              <div class="forms-hero-lbl">${esc(L.totalLbl)}</div>
            </div>
          </div>
          <div class="field forms-search" style="margin-bottom:0">
            <input type="text" id="forms-search-input" placeholder="${esc(L.searchPh)}" value="${esc(search)}" />
          </div>
          <div class="forms-export-row">
            <button type="button" class="btn sm ghost" id="forms-export-excel">${esc(L.exportExcel)}</button>
            <button type="button" class="btn sm ghost" id="forms-export-pdf">${esc(L.exportPDF)}</button>
          </div>
        </div>

        <div class="forms-chips" id="forms-chips">
          ${cats.map(c=>`<button type="button" class="forms-chip${c===activeCategory?' active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
        </div>

        ${list.length === 0 ? `
          <div class="empty">
            ${items.length === 0 ? `
              <div class="forms-empty-icon">${iconDoc()}</div>
              <div class="forms-empty-title">${esc(L.emptyTitle)}</div>
              <div class="faint">${esc(L.emptyBody)}</div>
            ` : `<div>${esc(t.empty)}</div>`}
          </div>
        ` : `
          <div class="forms-list stagger">
            ${list.map((f,i)=>{
              const [i1,i2] = iconPair(i);
              const cat = catOf(f);
              const upd = f.updatedDate ? `${esc(L.updated)}: ${esc(f.updatedDate)}` : '';
              return `
                <div class="card pressable forms-row" data-id="${esc(f.id)}">
                  <div class="icon3d" style="--i1:${i1};--i2:${i2}">${iconDoc()}</div>
                  <div class="forms-body">
                    <div class="forms-title">${esc(titleOf(f))}</div>
                    <div class="forms-sub">
                      <span class="badge neutral">${esc(cat)}</span>
                      ${upd ? `<span class="faint">${upd}</span>` : ''}
                    </div>
                  </div>
                  <div class="forms-open">${iconOpen()}</div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>
      <button class="fab" id="forms-fab" aria-label="${esc(L.add)}">${iconPlus()}</button>
    `;

    const searchInput = root.querySelector('#forms-search-input');
    searchInput.addEventListener('input', (e)=>{ search = e.target.value; paintPreserveFocus(); });

    root.querySelectorAll('.forms-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeCategory = btn.getAttribute('data-cat'); paint(); });
    });

    root.querySelectorAll('.forms-row').forEach(row=>{
      row.addEventListener('click', ()=>{ openDetail(row.getAttribute('data-id')); });
    });

    root.querySelector('#forms-fab').addEventListener('click', ()=> openEditor(null));

    root.querySelector('#forms-export-excel').addEventListener('click', doExportExcel);
    root.querySelector('#forms-export-pdf').addEventListener('click', doExportPDF);

    function paintPreserveFocus(){
      const pos = searchInput.selectionStart;
      paint();
      const ni = root.querySelector('#forms-search-input');
      if(ni){ ni.focus(); try{ ni.setSelectionRange(pos,pos); }catch(e){} }
    }
  }

  function openDetail(id){
    const f = DB.get('forms', id);
    if(!f) return;
    const hasLink = !!(f.fileUrl && f.fileUrl.trim());
    const html = `
      <div class="sheet glass">
        <div class="forms-detail-head">
          <div class="icon3d">${iconDoc()}</div>
          <div>
            <div class="forms-detail-title">${esc(titleOf(f))}</div>
            <div class="forms-detail-meta">
              <span class="badge neutral">${esc(catOf(f))}</span>
              ${f.updatedDate ? ` · ${esc(L.updated)}: ${esc(f.updatedDate)}` : ''}
            </div>
          </div>
        </div>
        <div class="forms-detail-desc">${esc(descOf(f)) || `<span class="faint">${esc(L.noDesc)}</span>`}</div>

        ${hasLink
          ? `<button class="btn primary" id="forms-open-btn">${iconOpen()} ${esc(L.openForm)}</button>
             <button class="btn ghost" id="forms-share-btn" style="margin-top:10px; width:100%">${esc(L.shareLink)}</button>`
          : `<button class="btn primary" disabled style="opacity:.45; cursor:not-allowed">${iconOpen()} ${esc(L.openForm)}</button>
             <div class="forms-nolink-note">${esc(L.noLink)}</div>`
        }

        <div class="forms-sheet-actions" style="margin-top:14px">
          <button class="btn ghost" id="forms-edit-btn">${iconEdit()} ${esc(L.edit)}</button>
          <button class="btn danger" id="forms-delete-btn">${iconTrash()} ${esc(L.delete)}</button>
        </div>
      </div>
    `;
    ctx.openOverlay(html, (overlayRoot)=>{
      const openBtn = overlayRoot.querySelector('#forms-open-btn');
      if(openBtn){
        openBtn.addEventListener('click', ()=>{
          window.open(f.fileUrl, '_blank');
        });
      }
      const shareBtn = overlayRoot.querySelector('#forms-share-btn');
      if(shareBtn){
        shareBtn.addEventListener('click', ()=>GRRK_EXPORT.shareText(f.fileUrl, titleOf(f), ctx.showToast));
      }
      overlayRoot.querySelector('#forms-edit-btn').addEventListener('click', ()=>{
        ctx.closeOverlay();
        openEditor(f.id);
      });
      overlayRoot.querySelector('#forms-delete-btn').addEventListener('click', ()=>{
        openDeleteConfirm(f);
      });
    });
  }

  function openDeleteConfirm(f){
    const html = `
      <div class="sheet glass" style="text-align:center">
        <div class="forms-confirm-icon">${iconTrash()}</div>
        <div class="h2" style="margin-bottom:8px">${esc(L.deleteConfirmTitle)}</div>
        <div class="faint" style="margin-bottom:18px">${esc(L.deleteConfirmBody)}</div>
        <div class="forms-sheet-actions">
          <button class="btn ghost" id="forms-cancel-del">${esc(L.cancel)}</button>
          <button class="btn danger" id="forms-confirm-del">${esc(L.delete)}</button>
        </div>
      </div>
    `;
    ctx.openOverlay(html, (overlayRoot)=>{
      overlayRoot.querySelector('#forms-cancel-del').addEventListener('click', ()=> ctx.closeOverlay());
      overlayRoot.querySelector('#forms-confirm-del').addEventListener('click', ()=>{
        DB.remove('forms', f.id);
        ctx.closeOverlay();
        ctx.showToast(L.deletedToast);
        paint();
      });
    });
  }

  function openEditor(id){
    const existing = id ? DB.get('forms', id) : null;
    const isEdit = !!existing;
    const v = existing || { titleAr:'', titleEn:'', category:'', fileUrl:'', descriptionAr:'', descriptionEn:'', updatedDate:'' };

    const html = `
      <div class="sheet glass">
        <div class="h2" style="margin-bottom:16px">${esc(isEdit ? L.editTitle : L.addTitle)}</div>
        <div class="field">
          <label>${esc(L.titleAr)}</label>
          <input type="text" id="f-titleAr" value="${esc(v.titleAr)}" dir="rtl" />
        </div>
        <div class="field">
          <label>${esc(L.titleEn)}</label>
          <input type="text" id="f-titleEn" value="${esc(v.titleEn)}" dir="ltr" />
        </div>
        <div class="field">
          <label>${esc(L.category)}</label>
          <input type="text" id="f-category" value="${esc(v.category)}" />
        </div>
        <div class="field">
          <label>${esc(L.fileUrl)}</label>
          <input type="text" id="f-fileUrl" value="${esc(v.fileUrl)}" dir="ltr" placeholder="https://... / forms/form1.pdf" />
          <div class="forms-hint">${esc(L.fileUrlHint)}</div>
        </div>
        <div class="field">
          <label>${esc(L.descAr)}</label>
          <textarea id="f-descriptionAr" rows="3" dir="rtl">${esc(v.descriptionAr)}</textarea>
        </div>
        <div class="field">
          <label>${esc(L.descEn)}</label>
          <textarea id="f-descriptionEn" rows="3" dir="ltr">${esc(v.descriptionEn)}</textarea>
        </div>
        <div class="field">
          <label>${esc(L.updatedDate)}</label>
          <input type="date" id="f-updatedDate" value="${esc(v.updatedDate)}" />
        </div>
        <div class="forms-sheet-actions">
          <button class="btn ghost" id="forms-cancel-edit">${esc(L.cancel)}</button>
          <button class="btn primary" id="forms-save-edit">${esc(L.save)}</button>
        </div>
      </div>
    `;

    ctx.openOverlay(html, (overlayRoot)=>{
      overlayRoot.querySelector('#forms-cancel-edit').addEventListener('click', ()=> ctx.closeOverlay());
      overlayRoot.querySelector('#forms-save-edit').addEventListener('click', ()=>{
        const titleAr = overlayRoot.querySelector('#f-titleAr').value.trim();
        const titleEn = overlayRoot.querySelector('#f-titleEn').value.trim();
        if(!titleAr || !titleEn){
          ctx.showToast(L.validation);
          return;
        }
        const patch = {
          titleAr,
          titleEn,
          category: overlayRoot.querySelector('#f-category').value.trim(),
          fileUrl: overlayRoot.querySelector('#f-fileUrl').value.trim(),
          descriptionAr: overlayRoot.querySelector('#f-descriptionAr').value.trim(),
          descriptionEn: overlayRoot.querySelector('#f-descriptionEn').value.trim(),
          updatedDate: overlayRoot.querySelector('#f-updatedDate').value,
        };
        if(isEdit){
          DB.update('forms', existing.id, patch);
        }else{
          DB.add('forms', patch);
        }
        ctx.closeOverlay();
        ctx.showToast(L.savedToast);
        paint();
      });
    });
  }

  paint();
}

// Mount function — called by the shell router.
function renderArchive(root, ctx){
  const t = ctx.t;
  const lang = ctx.lang;
  const isAr = lang === 'ar';

  // local UI state (kept across re-renders within one mount life via closure vars)
  let activeCat = 'all';
  let searchQ = '';

  function label(ar, en){ return isAr ? ar : en; }

  function catName(cat){ if(!cat) return '—'; return isAr ? (cat.nameAr||cat.nameEn) : (cat.nameEn||cat.nameAr); }

  function fmtDate(s){ return s || ''; }

  function iconArchiveBox(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="5" rx="1.4"/>
      <path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/>
      <path d="M10 13h4"/>
    </svg>`;
  }
  function iconGear(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>`;
  }
  function iconFile(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
      <path d="M14 3v5h5"/>
    </svg>`;
  }
  function iconPlus(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`;
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function getItems(){
    let items = DB.list('archiveItems').slice();
    if(activeCat !== 'all') items = items.filter(i=>i.categoryId===activeCat);
    if(searchQ.trim()){
      const q = searchQ.trim().toLowerCase();
      items = items.filter(i => (i.titleAr||'').toLowerCase().includes(q) || (i.titleEn||'').toLowerCase().includes(q));
    }
    return items;
  }

  function exportRows(){
    const cats = DB.list('archiveCategories');
    const items = getItems();
    return items.map(it=>{
      const cat = cats.find(c=>c.id===it.categoryId);
      const title = isAr ? (it.titleAr||it.titleEn) : (it.titleEn||it.titleAr);
      return {
        [label('العنوان','Title')]: title || '',
        [label('التصنيف','Category')]: catName(cat),
        [label('التاريخ','Date')]: it.dateAr || '',
      };
    });
  }

  function doExportExcel(){
    const rows = exportRows();
    const date = new Date().toISOString().slice(0,10);
    const blob = GRRK_EXPORT.exportExcel(rows, `GRRK-archive-${date}.xlsx`, 'archive');
    if(blob) GRRK_EXPORT.shareFile(blob, `GRRK-archive-${date}.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', label('الأرشيف','Archive'), ctx.showToast);
  }

  function doExportPDF(){
    const rows = exportRows();
    const cols = [label('العنوان','Title'), label('التصنيف','Category'), label('التاريخ','Date')].map(l=>({key:l,label:l}));
    const date = new Date().toISOString().slice(0,10);
    const blob = GRRK_EXPORT.exportPDF(label('الأرشيف','Archive'), cols, rows);
    if(blob) GRRK_EXPORT.shareFile(blob, `GRRK-archive-${date}.pdf`, 'application/pdf', label('الأرشيف','Archive'), ctx.showToast);
  }

  function paint(){
    const cats = DB.list('archiveCategories');
    const allItems = DB.list('archiveItems');
    const items = getItems();

    const chips = `
      <div class="archive-chips" id="arch-chips">
        <div class="archive-chip ${activeCat==='all'?'active':''}" data-cat="all">${label('الكل','All')}</div>
        ${cats.map(c=>`<div class="archive-chip ${activeCat===c.id?'active':''}" data-cat="${esc(c.id)}">${esc(catName(c))}</div>`).join('')}
        <div class="archive-chip add" id="arch-add-cat" title="${label('إضافة فئة','Add category')}">${iconPlus()}</div>
        <div class="archive-chip gear" id="arch-manage-cats" title="${label('إدارة الفئات','Manage categories')}">${iconGear()}</div>
      </div>
    `;

    const list = items.length ? `
      <div class="stagger" id="arch-list">
        ${items.map(it=>{
          const cat = cats.find(c=>c.id===it.categoryId);
          const title = isAr ? (it.titleAr||it.titleEn) : (it.titleEn||it.titleAr);
          return `
          <div class="card pressable archive-row" data-id="${esc(it.id)}">
            <div class="icon3d" style="--i1:#4F72E0;--i2:#C9932E">${iconArchiveBox()}</div>
            <div class="meta">
              <div class="ttl">${esc(title)}</div>
              <div class="sub">
                <span>${esc(catName(cat))}</span>
                ${it.dateAr ? `<span>· ${esc(fmtDate(it.dateAr))}</span>` : ''}
                ${it.fileUrl ? `<span class="file-dot">${iconFile()} ${label('مرفق','File')}</span>` : ''}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    ` : `
      <div class="empty">
        <p>${allItems.length===0 ? label('لا توجد عناصر في الأرشيف بعد. أضف أول عنصر بالضغط على زر +', 'Nothing archived yet. Tap + to add your first item.') : label('لا توجد عناصر في هذه الفئة أو تطابق بحثك', 'No items in this category or matching your search')}</p>
      </div>
    `;

    root.innerHTML = `
      <div>
        <div class="glass">
          <div class="eyebrow">${label('الأرشيف','Archive')}</div>
          <div style="display:flex; gap:22px; margin-top:10px; flex-wrap:wrap">
            <div>
              <div class="h1 num">${allItems.length}</div>
              <div class="faint">${label('عنصر محفوظ','Archived items')}</div>
            </div>
            <div>
              <div class="h1 num">${cats.length}</div>
              <div class="faint">${label('فئة','Categories')}</div>
            </div>
          </div>
          <div class="field" style="margin-top:16px; margin-bottom:0">
            <input type="text" id="arch-search" placeholder="${label('بحث بالعنوان...','Search by title...')}" value="${esc(searchQ)}" />
          </div>
          <div class="archive-export-row">
            <button class="btn sm ghost" id="arch-export-excel">${label('تصدير Excel','Export Excel')}</button>
            <button class="btn sm ghost" id="arch-export-pdf">${label('تصدير PDF','Export PDF')}</button>
          </div>
        </div>

        ${chips}
        ${list}
      </div>
      <button class="fab" id="arch-fab" aria-label="${label('إضافة','Add')}">${iconPlus()}</button>
    `;

    // wire events
    root.querySelector('#arch-search').addEventListener('input', e=>{
      searchQ = e.target.value;
      paint();
      // restore focus/caret after rerender
      const inp = root.querySelector('#arch-search');
      if(inp){ inp.focus(); const v=inp.value; inp.value=''; inp.value=v; }
    });

    root.querySelectorAll('[data-cat]').forEach(el=>{
      el.addEventListener('click', ()=>{ activeCat = el.getAttribute('data-cat'); paint(); });
    });

    root.querySelector('#arch-export-excel').addEventListener('click', doExportExcel);
    root.querySelector('#arch-export-pdf').addEventListener('click', doExportPDF);
    root.querySelector('#arch-add-cat').addEventListener('click', openAddCategorySheet);
    root.querySelector('#arch-manage-cats').addEventListener('click', openManageCategoriesSheet);
    root.querySelector('#arch-fab').addEventListener('click', ()=>openItemForm(null));

    root.querySelectorAll('.archive-row').forEach(el=>{
      el.addEventListener('click', ()=>openItemDetail(el.getAttribute('data-id')));
    });
  }

  // ---------- Category: add ----------
  function openAddCategorySheet(){
    const html = `
      <div class="sheet card">
        <h2>${label('فئة جديدة','New category')}</h2>
        <div class="field" style="margin-top:16px">
          <label>${label('الاسم (عربي)','Name (Arabic)')}</label>
          <input type="text" id="cat-nameAr" />
        </div>
        <div class="field">
          <label>${label('الاسم (إنجليزي)','Name (English)')}</label>
          <input type="text" id="cat-nameEn" />
        </div>
        <div style="display:flex; gap:10px; margin-top:6px">
          <button class="btn ghost" id="cat-cancel">${t.cancel}</button>
          <button class="btn primary" id="cat-save">${t.save}</button>
        </div>
      </div>
    `;
    ctx.openOverlay(html, (ov)=>{
      ov.querySelector('#cat-cancel').addEventListener('click', ctx.closeOverlay);
      ov.querySelector('#cat-save').addEventListener('click', ()=>{
        const nameAr = ov.querySelector('#cat-nameAr').value.trim();
        const nameEn = ov.querySelector('#cat-nameEn').value.trim();
        if(!nameAr && !nameEn){ ctx.showToast(label('أدخل اسم الفئة','Enter a category name')); return; }
        DB.add('archiveCategories', { nameAr, nameEn });
        ctx.closeOverlay();
        ctx.showToast(label('تمت إضافة الفئة','Category added'));
        paint();
      });
    });
  }

  // ---------- Category: manage (list / edit / delete) ----------
  function openManageCategoriesSheet(){
    function body(){
      const cats = DB.list('archiveCategories');
      return `
        <div class="sheet card">
          <h2>${label('إدارة الفئات','Manage categories')}</h2>
          <div style="margin-top:16px">
            ${cats.length ? cats.map(c=>`
              <div class="card archive-cat-row" data-id="${esc(c.id)}">
                <div class="meta" style="flex:1; min-width:0">
                  <div class="ttl" style="font-weight:700">${esc(catName(c))}</div>
                  <div class="faint">${esc(c.nameAr||'')}${c.nameAr && c.nameEn ? ' / ' : ''}${esc(c.nameEn||'')}</div>
                </div>
                <div class="actions">
                  <button class="btn sm ghost cat-edit-btn" data-id="${esc(c.id)}">${t.edit}</button>
                  <button class="btn sm danger cat-del-btn" data-id="${esc(c.id)}">${t.delete}</button>
                </div>
              </div>
            `).join('') : `<div class="empty"><p>${label('لا توجد فئات','No categories')}</p></div>`}
          </div>
          <button class="btn ghost" id="cats-close" style="margin-top:8px">${label('إغلاق','Close')}</button>
        </div>
      `;
    }
    ctx.openOverlay(body(), wireManage);
    function wireManage(ov){
      ov.querySelector('#cats-close').addEventListener('click', ctx.closeOverlay);
      ov.querySelectorAll('.cat-edit-btn').forEach(b=>{
        b.addEventListener('click', ()=>openRenameCategory(b.getAttribute('data-id'), ov));
      });
      ov.querySelectorAll('.cat-del-btn').forEach(b=>{
        b.addEventListener('click', ()=>confirmDeleteCategory(b.getAttribute('data-id'), ov));
      });
    }
    function refreshManage(ov){
      ov.innerHTML = body();
      wireManage(ov);
    }

    function openRenameCategory(catId, manageOv){
      const cat = DB.get('archiveCategories', catId);
      if(!cat) return;
      manageOv.innerHTML = `
        <div class="sheet card">
          <h2>${label('تعديل الفئة','Edit category')}</h2>
          <div class="field" style="margin-top:16px">
            <label>${label('الاسم (عربي)','Name (Arabic)')}</label>
            <input type="text" id="cat-edit-nameAr" value="${esc(cat.nameAr||'')}" />
          </div>
          <div class="field">
            <label>${label('الاسم (إنجليزي)','Name (English)')}</label>
            <input type="text" id="cat-edit-nameEn" value="${esc(cat.nameEn||'')}" />
          </div>
          <div style="display:flex; gap:10px; margin-top:6px">
            <button class="btn ghost" id="cat-edit-back">${label('رجوع','Back')}</button>
            <button class="btn primary" id="cat-edit-save">${t.save}</button>
          </div>
        </div>
      `;
      manageOv.querySelector('#cat-edit-back').addEventListener('click', ()=>refreshManage(manageOv));
      manageOv.querySelector('#cat-edit-save').addEventListener('click', ()=>{
        const nameAr = manageOv.querySelector('#cat-edit-nameAr').value.trim();
        const nameEn = manageOv.querySelector('#cat-edit-nameEn').value.trim();
        if(!nameAr && !nameEn){ ctx.showToast(label('أدخل اسم الفئة','Enter a category name')); return; }
        DB.update('archiveCategories', catId, { nameAr, nameEn });
        ctx.showToast(label('تم حفظ التعديلات','Changes saved'));
        refreshManage(manageOv);
        paint();
      });
    }

    function confirmDeleteCategory(catId, manageOv){
      const cat = DB.get('archiveCategories', catId);
      if(!cat) return;
      const inUse = DB.list('archiveItems').some(i=>i.categoryId===catId);
      if(inUse){
        manageOv.innerHTML = `
          <div class="sheet card">
            <div class="archive-confirm">
              <h2>${label('لا يمكن الحذف','Cannot delete')}</h2>
              <p class="muted" style="margin-top:12px">${label(
                'هذه الفئة تحتوي على عناصر مؤرشفة. يرجى نقل أو حذف تلك العناصر أولاً قبل حذف الفئة.',
                'This category still has archived items in it. Please move or delete those items first before deleting the category.'
              )}</p>
            </div>
            <button class="btn primary" id="cat-del-ok" style="margin-top:18px">${label('حسناً','OK')}</button>
          </div>
        `;
        manageOv.querySelector('#cat-del-ok').addEventListener('click', ()=>refreshManage(manageOv));
        return;
      }
      manageOv.innerHTML = `
        <div class="sheet card">
          <div class="archive-confirm">
            <h2>${label('تأكيد الحذف','Confirm delete')}</h2>
            <p class="muted" style="margin-top:12px">${label('هل تريد حذف الفئة','Delete category')} "${esc(catName(cat))}"؟</p>
          </div>
          <div style="display:flex; gap:10px; margin-top:18px">
            <button class="btn ghost" id="cat-del-cancel">${t.cancel}</button>
            <button class="btn danger" id="cat-del-confirm">${t.delete}</button>
          </div>
        </div>
      `;
      manageOv.querySelector('#cat-del-cancel').addEventListener('click', ()=>refreshManage(manageOv));
      manageOv.querySelector('#cat-del-confirm').addEventListener('click', ()=>{
        DB.remove('archiveCategories', catId);
        if(activeCat === catId) activeCat = 'all';
        ctx.showToast(label('تم حذف الفئة','Category deleted'));
        refreshManage(manageOv);
        paint();
      });
    }
  }

  // ---------- Item: add / edit form ----------
  function openItemForm(existing){
    const cats = DB.list('archiveCategories');
    const it = existing || { titleAr:'', titleEn:'', categoryId: cats[0]?cats[0].id:'', notesAr:'', notesEn:'', dateAr:'', fileUrl:'' };
    const html = `
      <div class="sheet card">
        <h2>${existing ? t.edit : label('عنصر جديد','New item')}</h2>
        <div class="field" style="margin-top:16px">
          <label>${label('العنوان (عربي)','Title (Arabic)')}</label>
          <input type="text" id="it-titleAr" value="${esc(it.titleAr)}" />
        </div>
        <div class="field">
          <label>${label('العنوان (إنجليزي)','Title (English)')}</label>
          <input type="text" id="it-titleEn" value="${esc(it.titleEn)}" />
        </div>
        <div class="field">
          <label>${label('الفئة','Category')}</label>
          <select id="it-categoryId">
            ${cats.length ? cats.map(c=>`<option value="${esc(c.id)}" ${it.categoryId===c.id?'selected':''}>${esc(catName(c))}</option>`).join('')
              : `<option value="">${label('لا توجد فئات — أضف فئة أولاً','No categories — add one first')}</option>`}
          </select>
        </div>
        <div class="field">
          <label>${label('التاريخ (اختياري)','Date (optional)')}</label>
          <input type="date" id="it-dateAr" value="${esc(it.dateAr||'')}" />
        </div>
        <div class="field">
          <label>${label('رابط/مسار الملف (اختياري)','File URL/path (optional)')}</label>
          <input type="text" id="it-fileUrl" value="${esc(it.fileUrl||'')}" placeholder="https://... ${label('أو','or')} files/doc.pdf" />
          <div class="archive-hint">${label('رابط خارجي أو مسار نسبي لملف داخل نفس موقع GitHub Pages — لا يوجد رفع للملفات.', 'External link or a relative path to a file in this same GitHub Pages site — no file upload.')}</div>
        </div>
        <div class="field">
          <label>${label('ملاحظات (عربي)','Notes (Arabic)')}</label>
          <textarea id="it-notesAr" rows="3">${esc(it.notesAr||'')}</textarea>
        </div>
        <div class="field">
          <label>${label('ملاحظات (إنجليزي)','Notes (English)')}</label>
          <textarea id="it-notesEn" rows="3">${esc(it.notesEn||'')}</textarea>
        </div>
        <div style="display:flex; gap:10px; margin-top:6px">
          <button class="btn ghost" id="it-cancel">${t.cancel}</button>
          <button class="btn primary" id="it-save">${t.save}</button>
        </div>
      </div>
    `;
    ctx.openOverlay(html, (ov)=>{
      ov.querySelector('#it-cancel').addEventListener('click', ctx.closeOverlay);
      ov.querySelector('#it-save').addEventListener('click', ()=>{
        const titleAr = ov.querySelector('#it-titleAr').value.trim();
        const titleEn = ov.querySelector('#it-titleEn').value.trim();
        const categoryId = ov.querySelector('#it-categoryId').value;
        const dateAr = ov.querySelector('#it-dateAr').value;
        const fileUrl = ov.querySelector('#it-fileUrl').value.trim();
        const notesAr = ov.querySelector('#it-notesAr').value.trim();
        const notesEn = ov.querySelector('#it-notesEn').value.trim();
        if(!titleAr && !titleEn){ ctx.showToast(label('أدخل عنواناً','Enter a title')); return; }
        if(!categoryId){ ctx.showToast(label('يرجى اختيار فئة (أضف فئة أولاً)','Please choose a category (add one first)')); return; }
        const payload = { titleAr, titleEn, categoryId, dateAr, fileUrl, notesAr, notesEn };
        if(existing){ DB.update('archiveItems', existing.id, payload); }
        else { DB.add('archiveItems', payload); }
        ctx.closeOverlay();
        ctx.showToast(existing ? label('تم حفظ التعديلات','Changes saved') : label('تمت الإضافة','Item added'));
        paint();
      });
    });
  }

  // ---------- Item: detail view ----------
  function openItemDetail(id){
    const it = DB.get('archiveItems', id);
    if(!it) return;
    const cat = DB.get('archiveCategories', it.categoryId);
    const title = isAr ? (it.titleAr||it.titleEn) : (it.titleEn||it.titleAr);
    const notes = isAr ? (it.notesAr||it.notesEn) : (it.notesEn||it.notesAr);
    const html = `
      <div class="sheet card">
        <div style="display:flex; align-items:center; gap:12px">
          <div class="icon3d" style="--i1:#4F72E0;--i2:#C9932E">${iconArchiveBox()}</div>
          <div style="min-width:0">
            <h2 style="overflow:hidden; text-overflow:ellipsis">${esc(title)}</h2>
            <div class="faint" style="margin-top:3px">${esc(catName(cat))}</div>
          </div>
        </div>
        ${it.dateAr ? `<div class="faint" style="margin-top:14px">${label('التاريخ','Date')}: <span class="num">${esc(it.dateAr)}</span></div>` : ''}
        ${notes ? `<div class="archive-detail-notes">${esc(notes)}</div>` : `<p class="faint" style="margin-top:14px">${label('لا توجد ملاحظات','No notes')}</p>`}
        ${it.fileUrl ? `<button class="btn auto" id="it-open-file" style="margin-top:16px; width:100%">${iconFile()} ${label('فتح الملف','Open file')}</button>` : ''}
        ${it.fileUrl ? `<button class="btn ghost" id="it-share-file" style="margin-top:10px; width:100%">${label('مشاركة الرابط','Share link')}</button>` : ''}
        <div class="divider"></div>
        <div style="display:flex; gap:10px">
          <button class="btn ghost" id="it-edit-btn">${t.edit}</button>
          <button class="btn danger" id="it-del-btn">${t.delete}</button>
        </div>
      </div>
    `;
    ctx.openOverlay(html, (ov)=>{
      const fileBtn = ov.querySelector('#it-open-file');
      if(fileBtn) fileBtn.addEventListener('click', ()=>window.open(it.fileUrl, '_blank'));
      const shareBtn = ov.querySelector('#it-share-file');
      if(shareBtn) shareBtn.addEventListener('click', ()=>GRRK_EXPORT.shareText(it.fileUrl, title, ctx.showToast));
      ov.querySelector('#it-edit-btn').addEventListener('click', ()=>openItemForm(it));
      ov.querySelector('#it-del-btn').addEventListener('click', ()=>confirmDeleteItem(it, ov));
    });
  }

  function confirmDeleteItem(it, ov){
    const title = isAr ? (it.titleAr||it.titleEn) : (it.titleEn||it.titleAr);
    ov.innerHTML = `
      <div class="sheet card">
        <div class="archive-confirm">
          <h2>${label('تأكيد الحذف','Confirm delete')}</h2>
          <p class="muted" style="margin-top:12px">${label('هل تريد حذف','Delete')} "${esc(title)}"؟</p>
        </div>
        <div style="display:flex; gap:10px; margin-top:18px">
          <button class="btn ghost" id="it-del-cancel">${t.cancel}</button>
          <button class="btn danger" id="it-del-confirm">${t.delete}</button>
        </div>
      </div>
    `;
    ov.querySelector('#it-del-cancel').addEventListener('click', ctx.closeOverlay);
    ov.querySelector('#it-del-confirm').addEventListener('click', ()=>{
      DB.remove('archiveItems', it.id);
      ctx.closeOverlay();
      ctx.showToast(label('تم الحذف','Deleted'));
      paint();
    });
  }

  paint();
}

/* ============================================================
   GRRK — App Shell (router, i18n/theme state, overlay/toast,
   bottom nav with 3D icons, screen transitions)
   ============================================================ */
(function(){
  const APP = document.getElementById('app');

  const STORE_KEY = 'grrk_ui_v1';
  function loadUI(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
  function saveUI(ui){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(ui)); }catch(e){} }

  const ui0 = loadUI();
  const state = {
    lang: ui0.lang || 'ar',
    theme: ui0.theme || 'night',
    accent: ui0.accent || 'indigo',
    screen: 'dashboard',
    history: [],
    profileTarget: null,
  };

  function applyDocAttrs(){
    document.documentElement.setAttribute('lang', state.lang);
    document.documentElement.setAttribute('dir', I18N[state.lang].dir);
    document.documentElement.setAttribute('data-theme', state.theme);
    document.documentElement.setAttribute('data-accent', state.accent);
  }

  // ---------------- Icons (3D tile glyphs) ----------------
  const ICONS = {
    dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/><path d="M9.5 19v-5.5h5V19"/></svg>',
    employees:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg>',
    contractors:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M8 7.5V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1.5"/></svg>',
    visitors:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M8 3v3M16 3v3M3.5 10h17"/><path d="m9 15 2 2 4-4"/></svg>',
    companiesorgs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V6l7-3 7 3v15"/><path d="M4 21h16M9 21v-5h4v5M9 11h.01M14 11h.01M9 8h.01M14 8h.01"/></svg>',
    documents:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',
    alerts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5c-4 0-5.6 3-5.6 6.2 0 2.6-.6 4-2 5.3h15.2c-1.4-1.3-2-2.7-2-5.3 0-3.2-1.6-6.2-5.6-6.2Z"/><path d="M9.3 18.5a2.8 2.8 0 0 0 5.4 0"/></svg>',
    reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M20 20H4"/></svg>',
    profiles:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.5-1.8 1.8-2.6 3-2.6s2.5.8 3 2.6M14.5 10h4M14.5 13.5h4"/></svg>',
    settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4.6a7.6 7.6 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.4-.6-2 3.4L6.4 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-.6c.5.4 1.1.75 1.7 1l.4 2.6h4l.4-2.6c.6-.25 1.2-.6 1.7-1l2.4.6 2-3.4-2-1.6Z"/></svg>',
    library:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.2"/><path d="M10 8.3v7.4l6-3.7-6-3.7Z" fill="currentColor" stroke="none"/></svg>',
    forms:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v4h4"/><path d="m9.5 13.5 1.6 1.6 3.4-3.6"/></svg>',
    archive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M4.5 9v8a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg>',
    more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>',
    chevronBack:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>',
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>',
  };

  // Bottom nav shows only the top 4 day-to-day screens + a "More" hub.
  // Everything else lives behind "More" (a grid sheet) and in the Dashboard's
  // own Quick Access grid, so the home screen stays the real hub for navigation
  // instead of cramming 13 icons into 3 cramped rows at the bottom.
  const NAV = [
    {key:'dashboard', i1:'var(--glow)', i2:'var(--gold2)'},
    {key:'employees', i1:'var(--glow)', i2:'var(--gold2)'},
    {key:'documents', i1:'#C2524F', i2:'#8C2E2E'},
    {key:'reports', i1:'#B48CE8', i2:'#6B3FA8'},
    {key:'more', i1:'var(--ink-faint)', i2:'var(--ink-soft)'},
  ];

  // The rest of the sections — reachable via the "More" sheet and the
  // Dashboard's Quick Access grid.
  const MORE_ITEMS = [
    {key:'contractors', i1:'#6FA8E0', i2:'#2E6FA8'},
    {key:'visitors', i1:'#E0A86F', i2:'#A86F2E'},
    {key:'companiesorgs', i1:'#7FD6A8', i2:'#2E9966'},
    {key:'alerts', i1:'#FFC168', i2:'#B4790F'},
    {key:'profiles', i1:'#8CC8E8', i2:'#2E7FA8'},
    {key:'library', i1:'#5FB8D9', i2:'#2E7F9C'},
    {key:'forms', i1:'#9AA5B8', i2:'#5A6578'},
    {key:'archive', i1:'#C9A45C', i2:'#8A6416'},
    {key:'settings', i1:'var(--ink-faint)', i2:'var(--ink-soft)'},
  ];
  const PRIMARY_KEYS = NAV.map(n=>n.key).filter(k=>k!=='more');

  function navLabel(key, t){
    const map = {
      dashboard:t.dashboard, employees:t.employees, contractors:t.contractors, visitors:t.visitors,
      companiesorgs: state.lang==='ar' ? 'الشركات/الجهات' : 'Companies/Orgs',
      documents:t.documents, alerts:t.alerts, reports:t.reports,
      profiles: state.lang==='ar' ? 'الملفات' : 'Profiles',
      library: state.lang==='ar' ? 'المكتبة' : 'Library',
      forms: state.lang==='ar' ? 'النماذج' : 'Forms',
      archive: state.lang==='ar' ? 'الأرشيف' : 'Archive',
      settings:t.settings,
      more: state.lang==='ar' ? 'المزيد' : 'More',
    };
    return map[key];
  }

  // ---------------- Toast ----------------
  let toastTimer = null;
  function showToast(msg){
    let el = document.getElementById('toastEl');
    if(!el){ el = document.createElement('div'); el.id='toastEl'; el.className='toast'; document.body.appendChild(el); }
    el.textContent = msg;
    el.style.display = 'block';
    el.style.animation = 'none'; requestAnimationFrame(()=>{ el.style.animation = ''; });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 2600);
  }

  // ---------------- Overlay ----------------
  function openOverlay(innerHtml, onMount){
    closeOverlay();
    const wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.id = 'activeOverlay';
    wrap.innerHTML = '<div class="glass sheet" id="activeSheet">' + innerHtml + '</div>';
    wrap.addEventListener('mousedown', (e)=>{ if(e.target === wrap) closeOverlay(); });
    document.body.appendChild(wrap);
    const sheet = wrap.querySelector('#activeSheet');
    if(typeof onMount === 'function') onMount(sheet);
  }
  function closeOverlay(){
    const el = document.getElementById('activeOverlay');
    if(el) el.remove();
  }

  // ---------------- Context passed to every module ----------------
  function makeCtx(){
    return {
      lang: state.lang,
      t: I18N[state.lang],
      showToast, openOverlay, closeOverlay,
      rerender(){ renderScreen(state.screen, true); },
      navigate(target){
        if(target === 'back'){ goBack(); return; }
        go(target);
      },
      setLang(l){ setLang(l); },
      setTheme(th){ setTheme(th); },
      setAccent(a){ setAccent(a); },
      openProfile(entityType, entityId){ openProfile(entityType, entityId); },
    };
  }

  // ---------------- Screen registry ----------------
  const SCREENS = {
    dashboard: (root, ctx)=> renderDashboard(root, ctx),
    employees: (root, ctx)=> renderEmployees(root, ctx),
    contractors: (root, ctx)=> renderContractors(root, ctx),
    visitors: (root, ctx)=> renderVisitors(root, ctx),
    companiesorgs: (root, ctx)=> renderCompaniesOrgs(root, ctx),
    documents: (root, ctx)=> renderDocuments(root, ctx),
    alerts: (root, ctx)=> renderAlerts(root, ctx),
    reports: (root, ctx)=> renderReports(root, ctx),
    settings: (root, ctx)=> renderSettings(root, ctx),
    profiles: (root, ctx)=> renderProfilePicker(root, ctx),
    library: (root, ctx)=> renderLibrary(root, ctx),
    forms: (root, ctx)=> renderForms(root, ctx),
    archive: (root, ctx)=> renderArchive(root, ctx),
  };

  function go(screen){
    if(screen === state.screen) return;
    state.history.push(state.screen);
    state.screen = screen;
    state.profileTarget = null;
    renderScreen(screen);
    renderNav();
  }
  function goBack(){
    const prev = state.history.pop();
    state.screen = prev || 'dashboard';
    state.profileTarget = null;
    renderScreen(state.screen);
    renderNav();
  }
  function openProfile(entityType, entityId){
    state.history.push(state.screen);
    state.screen = '__profile__';
    state.profileTarget = {entityType, entityId};
    renderScreen('__profile__');
    renderNav();
  }

  function renderScreen(screen, skipAnim){
    const main = document.getElementById('main');
    const ctx = makeCtx();
    const mount = ()=>{
      main.innerHTML = '<div class="screen" id="screenInner"></div>';
      const inner = document.getElementById('screenInner');
      if(screen === '__profile__'){
        renderProfile(inner, ctx, state.profileTarget);
      } else {
        const fn = SCREENS[screen] || SCREENS.dashboard;
        fn(inner, ctx);
      }
      wireDataNav(inner, ctx);
      // Always land at the top of the new screen — without this, the scroll
      // position from the previous screen carries over and the new screen's
      // own content (e.g. the Dashboard hero) can appear to not show until
      // the person manually scrolls up.
      main.scrollTop = 0;
      try{ window.scrollTo({top:0, left:0}); }catch(e){}
    };
    if(skipAnim){ mount(); return; }
    const old = main.querySelector('.screen');
    if(old){ old.classList.add('leaving'); setTimeout(mount, 90); } else { mount(); }
  }

  // Lets any module render a simple `data-nav="key"` button and have it work
  // (used by the Dashboard quick-links grid).
  function wireDataNav(root, ctx){
    root.querySelectorAll('[data-nav]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const key = el.getAttribute('data-nav');
        if(key === 'organizations') go('companiesorgs');
        else if(key === 'companies') go('companiesorgs');
        else go(key);
      });
    });
  }

  // ---------------- Lightweight profile picker (entry point into renderProfile) ----------------
  function renderProfilePicker(root, ctx){
    const t = ctx.t;
    const L = ctx.lang === 'ar'
      ? {title:'ملفات الكيانات', sub:'اختر موظفاً أو مقاولاً أو شركة أو جهة لعرض ملفه الكامل', emp:'الموظفون', con:'المقاولون', co:'الشركات', org:'الجهات'}
      : {title:'Entity Profiles', sub:'Pick an employee, contractor, company or organization to view its full profile', emp:'Employees', con:'Contractors', co:'Companies', org:'Organizations'};
    function section(label, coll, type, icon){
      const items = DB.list(coll);
      if(!items.length) return '';
      return `<div class="card" style="margin-bottom:14px">
        <div class="eyebrow" style="margin-bottom:10px">${label}</div>
        ${items.map(it=>`
          <button type="button" class="row" style="width:100%;background:none;border:none;cursor:pointer;color:inherit" data-pick-type="${type}" data-pick-id="${it.id}">
            <span class="icon3d sm"><span>${icon}</span></span>
            <span style="flex:1;text-align:start">${ctx.lang==='ar' ? (it.nameAr||it.nameEn) : (it.nameEn||it.nameAr)}</span>
          </button>
        `).join('')}
      </div>`;
    }
    root.innerHTML = `
      <div class="glass" style="margin-bottom:16px">
        <div class="eyebrow">${L.title}</div>
        <p class="muted" style="margin-top:6px">${L.sub}</p>
      </div>
      <div class="stagger">
        ${section(L.emp, 'employees', 'employee', ICONS.employees)}
        ${section(L.con, 'contractors', 'contractor', ICONS.contractors)}
        ${section(L.co, 'companies', 'company', ICONS.companiesorgs)}
        ${section(L.org, 'organizations', 'organization', ICONS.companiesorgs)}
      </div>
    `;
    root.querySelectorAll('[data-pick-type]').forEach(btn=>{
      btn.addEventListener('click', ()=> openProfile(btn.getAttribute('data-pick-type'), btn.getAttribute('data-pick-id')));
    });
  }

  // ---------------- Topbar / Nav chrome ----------------
  function renderTop(){
    const top = document.getElementById('topbar');
    const t = I18N[state.lang];
    const showBack = state.screen === '__profile__' || state.history.length > 0;
    const isNight = state.theme === 'night';
    top.innerHTML = `
      <div class="brand">
        ${showBack ? `<button id="backBtn" class="btn ghost sm" style="padding:8px">${ICONS.chevronBack}</button>` : ''}
        <span class="icon3d sm" style="--i1:var(--glow);--i2:var(--gold2)">${ICONS.dashboard}</span>
        <span>${t.appName}</span>
      </div>
      <button id="quickThemeBtn" class="btn ghost sm" style="padding:8px" title="${isNight ? (state.lang==='ar'?'التبديل للنهاري':'Switch to day') : (state.lang==='ar'?'التبديل لليلي':'Switch to night')}">
        ${isNight ? ICONS.sun : ICONS.moon}
      </button>
    `;
    const back = document.getElementById('backBtn');
    if(back) back.addEventListener('click', goBack);
    const quickTheme = document.getElementById('quickThemeBtn');
    if(quickTheme) quickTheme.addEventListener('click', ()=>{ setTheme(state.theme === 'night' ? 'day' : 'night'); renderTop(); });
  }

  function renderNav(){
    const nav = document.getElementById('navbar');
    const curIsPrimary = PRIMARY_KEYS.includes(state.screen);
    nav.innerHTML = NAV.map(n=>{
      const active = n.key === 'more' ? !curIsPrimary : state.screen === n.key;
      return `<button type="button" class="navbtn ${active?'active':''}" data-go="${n.key}">
        <span class="icon3d sm" style="--i1:${n.i1};--i2:${n.i2}">${ICONS[n.key]}</span>
        <span>${navLabel(n.key, I18N[state.lang])}</span>
      </button>`;
    }).join('');
    nav.querySelectorAll('[data-go]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const key = b.getAttribute('data-go');
        if(key === 'more'){ openMoreSheet(); return; }
        state.history=[]; go(key);
      });
    });
  }

  // ---------------- "More" hub sheet (the other sections live here) ----------------
  function openMoreSheet(){
    const t = I18N[state.lang];
    const title = state.lang==='ar' ? 'المزيد من الأقسام' : 'More sections';
    const tilesHtml = MORE_ITEMS.map(n=>`
      <button type="button" class="more-tile" data-more-go="${n.key}">
        <span class="icon3d" style="--i1:${n.i1};--i2:${n.i2}">${ICONS[n.key]}</span>
        <span class="more-tile-label">${navLabel(n.key, t)}</span>
      </button>
    `).join('');
    const html = `
      <h2 class="h2" style="margin-bottom:14px">${title}</h2>
      <div class="more-grid">${tilesHtml}</div>
    `;
    openOverlay(html, (sheet)=>{
      sheet.querySelectorAll('[data-more-go]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const key = btn.getAttribute('data-more-go');
          closeOverlay();
          state.history=[];
          go(key);
        });
      });
    });
  }

  function setLang(l){
    state.lang = l; saveUI({lang:state.lang, theme:state.theme, accent:state.accent});
    applyDocAttrs(); renderTop(); renderNav(); renderScreen(state.screen, true);
  }
  function setTheme(th){
    state.theme = th; saveUI({lang:state.lang, theme:state.theme, accent:state.accent});
    applyDocAttrs();
  }
  function setAccent(a){
    state.accent = a; saveUI({lang:state.lang, theme:state.theme, accent:state.accent});
    applyDocAttrs();
  }

  // ---------------- Inject module CSS ----------------
  function injectModuleCSS(){
    const styleEl = document.createElement('style');
    styleEl.id = 'moduleStyles';
    styleEl.textContent = [CSS_DASHBOARD, CSS_EMPLOYEES, CSS_CONTRACTORS, CSS_VISITORS, CSS_COMPANIESORGS,
      CSS_DOCUMENTS, CSS_ALERTS, CSS_REPORTS, CSS_SETTINGS, CSS_PROFILE,
      CSS_LIBRARY, CSS_FORMS, CSS_ARCHIVE].join('\n');
    document.head.appendChild(styleEl);
  }

  // ---------------- Boot ----------------
  function boot(){
    applyDocAttrs();
    injectModuleCSS();
    renderTop();
    renderNav();
    renderScreen('dashboard', true);
  }
  boot();
})();

</script>
</body>
</html>
