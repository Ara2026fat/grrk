<style>
/* ============================================================
   GRRK — نظام اللمعان البصري (Luster Design System)
   Adapted from "سرّ اللمعان" (أُفق) — CSS-only glass, NO backdrop-filter.
   Augmented with: 3D icon shading, shimmer sweep, elevation depth,
   screen-transition choreography. Single-file app, ar(RTL)/en(LTR).
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

:root{
  --display:'Space Grotesk','Tajawal',sans-serif;
  --body:'Tajawal','Space Grotesk',sans-serif;
  --radius-lg:26px; --radius-md:16px; --radius-sm:12px;
  --dur-fast:.12s; --dur-base:.16s; --dur-slow:.26s; --dur-scene:.42s;
  --ease:cubic-bezier(.22,.9,.26,1);
}

[data-theme="night"]{
  color-scheme:dark;
  --void:#0B0D14; --void2:#0E1017; --lift1:#1A1F33; --lift2:#151A28;
  --ink:#E7E9F4; --ink-soft:#9195AB; --ink-faint:#5B6078;
  --glass:linear-gradient(158deg, rgba(255,255,255,.065), rgba(255,255,255,.02));
  --glass-line:rgba(255,255,255,.09);
  --glass-shadow:0 20px 50px rgba(0,0,0,.48), 0 2px 0 rgba(255,255,255,.03) inset;
  --edge:rgba(255,255,255,.22);
  --flat:rgba(255,255,255,.035); --flat-line:rgba(255,255,255,.065);
  --line:rgba(255,255,255,.08); --solid:#1B2030;
  --glow:#4F72E0; --glow-tint:rgba(79,114,224,.18);
  --gold:#F2C879; --gold2:#C9932E;
  --ok:#52E3A6; --warn:#FFC168; --danger:#FF6B81;
  --btn-bg:rgba(79,114,224,.2); --btn-line:rgba(79,114,224,.4); --btn-ink:#C3D1FA;
  --shimmer:rgba(255,255,255,.5);
  --app-bg:radial-gradient(1100px 560px at 50% -120px, rgba(79,114,224,.17), transparent 70%), var(--void);
}
[data-theme="day"]{
  color-scheme:light;
  --void:#F3F2EC; --void2:#ECEAE1; --lift1:#FFFFFF; --lift2:#F7F6F0;
  --ink:#1C1E2A; --ink-soft:#5B5F72; --ink-faint:#9497A6;
  --glass:linear-gradient(158deg, rgba(255,255,255,.75), rgba(255,255,255,.4));
  --glass-line:rgba(0,0,0,.07);
  --glass-shadow:0 16px 38px rgba(40,40,60,.1), 0 2px 0 rgba(255,255,255,.6) inset;
  --edge:rgba(255,255,255,.95);
  --flat:rgba(0,0,0,.028); --flat-line:rgba(0,0,0,.06);
  --line:rgba(0,0,0,.07); --solid:#EDEBE2;
  --glow:#2541A8; --glow-tint:rgba(37,65,168,.12);
  --gold:#B9872E; --gold2:#8A6416;
  --ok:#188A5E; --warn:#A06A00; --danger:#C83C53;
  --btn-bg:rgba(37,65,168,.14); --btn-line:rgba(37,65,168,.34); --btn-ink:#1C2E7A;
  --shimmer:rgba(255,255,255,.85);
  --app-bg:radial-gradient(1100px 560px at 50% -120px, rgba(37,65,168,.12), transparent 70%), var(--void);
}

/* ---------- Accent color variants (layered on top of night/day) ---------- */
/* forest — deep, rich green */
:root[data-theme="night"][data-accent="forest"]{
  --glow:#1F9E63; --glow-tint:rgba(31,158,99,.18);
  --btn-bg:rgba(31,158,99,.2); --btn-line:rgba(31,158,99,.4); --btn-ink:#B7F0D3;
  --app-bg:radial-gradient(1100px 560px at 50% -120px, rgba(31,158,99,.16), transparent 70%), var(--void);
}
:root[data-theme="day"][data-accent="forest"]{
  --glow:#146B45; --glow-tint:rgba(20,107,69,.12);
  --btn-bg:rgba(20,107,69,.14); --btn-line:rgba(20,107,69,.32); --btn-ink:#0E4A30;
  --app-bg:radial-gradient(1100px 560px at 50% -120px, rgba(20,107,69,.1), transparent 70%), var(--void);
}
/* graphite — steel gray, understated and technical */
:root[data-theme="night"][data-accent="graphite"]{
  --glow:#8792A6; --glow-tint:rgba(135,146,166,.18);
  --btn-bg:rgba(135,146,166,.2); --btn-line:rgba(135,146,166,.4); --btn-ink:#D7DBE4;
  --app-bg:radial-gradient(1100px 560px at 50% -120px, rgba(135,146,166,.15), transparent 70%), var(--void);
}
:root[data-theme="day"][data-accent="graphite"]{
  --glow:#444E5E; --glow-tint:rgba(68,78,94,.12);
  --btn-bg:rgba(68,78,94,.12); --btn-line:rgba(68,78,94,.3); --btn-ink:#2B3240;
  --app-bg:radial-gradient(1100px 560px at 50% -120px, rgba(68,78,94,.1), transparent 70%), var(--void);
}

*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{
  background:var(--app-bg); color:var(--ink); font-family:var(--body);
  line-height:1.6; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none; min-height:100vh;
  transition:background var(--dur-slow) var(--ease), color var(--dur-slow) var(--ease);
}
[dir="rtl"] body{font-family:'Tajawal','Space Grotesk',sans-serif}
button, input, textarea, select{font-family:inherit}
.font-variant-tabular, .num{font-variant-numeric:tabular-nums}

/* ---------- Elevation system: exactly ONE .glass hero per screen ---------- */
.glass{
  background:var(--glass); border:1px solid var(--glass-line);
  border-radius:var(--radius-lg); box-shadow:var(--glass-shadow);
  padding:22px 20px; position:relative; overflow:hidden;
}
.glass::before{
  content:''; position:absolute; inset:0 14% auto; height:1px; border-radius:1px;
  background:linear-gradient(90deg,transparent,var(--edge),transparent);
}
.glass::after{ /* slow shimmer sweep for the "hero" surface */
  content:''; position:absolute; top:0; bottom:0; width:40%; left:-60%;
  background:linear-gradient(100deg, transparent, var(--shimmer), transparent);
  opacity:.06; animation:sweep 7s ease-in-out infinite;
  pointer-events:none;
}
@keyframes sweep{ 0%{left:-60%} 45%{left:120%} 100%{left:120%} }

.card, .flat{
  background:var(--flat); border:1px solid var(--flat-line);
  border-radius:var(--radius-md); padding:16px 18px;
  transition:border-color var(--dur-base) var(--ease), background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.card.pressable:active{ transform:scale(.985) }
.divider{ height:1px; background:var(--line); border:0; margin:10px 0 }

/* ---------- Typography ---------- */
h1,.h1{font-family:var(--display); font-weight:700; font-size:clamp(22px,5vw,30px); letter-spacing:-.3px}
h2,.h2{font-family:var(--display); font-weight:600; font-size:19px}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint)}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint); font-size:13px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--btn-bg); border:1px solid var(--btn-line); color:var(--btn-ink);
  padding:13px 18px; border-radius:15px; font-family:var(--display); font-size:15px; font-weight:500;
  transition:background var(--dur-base) ease, transform var(--dur-fast) ease, box-shadow var(--dur-base) ease;
  cursor:pointer; width:100%;
}
.btn:hover{ filter:brightness(1.12) }
.btn:active{ transform:scale(.988) }
.btn.block{ width:100% } .btn.auto{ width:auto }
.btn.primary{ background:linear-gradient(160deg, var(--glow), var(--gold2)); border-color:transparent; color:#fff; box-shadow:0 10px 24px -8px var(--glow-tint) }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); font-size:14px; padding:10px 14px; font-family:var(--body) }
.btn.sm{ padding:9px 14px; font-size:13px; width:auto; border-radius:12px }
.btn.danger{ background:rgba(255,107,129,.14); border-color:rgba(255,107,129,.34); color:var(--danger) }
.fab{
  position:fixed; inset-inline-end:20px; bottom:calc(204px + env(safe-area-inset-bottom));
  width:58px; height:58px; border-radius:50%; display:grid; place-items:center;
  background:linear-gradient(160deg, var(--glow), var(--gold2)); color:#fff; border:none;
  box-shadow:0 14px 30px -8px var(--glow-tint), 0 0 0 1px rgba(255,255,255,.14) inset;
  cursor:pointer; z-index:40; transition:transform var(--dur-fast) var(--ease);
}
.fab:active{ transform:scale(.92) }

/* ---------- Choice / list rows ---------- */
.row{ display:flex; align-items:center; gap:12px; padding:13px 2px; border-bottom:1px dashed var(--line) }
.row:last-child{ border-bottom:0 }
.choice{
  display:block; width:100%; text-align:start; background:var(--flat); border:1px solid var(--flat-line);
  border-radius:15px; padding:15px 16px; margin-bottom:9px; cursor:pointer;
  transition:border-color var(--dur-base) ease, background var(--dur-base) ease;
}
.choice.active{ background:var(--glass); border-color:var(--glow) }

/* ---------- Badges / status ---------- */
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 11px; border-radius:99px; }
.badge.ok{ background:rgba(82,227,166,.14); color:var(--ok) }
.badge.warn{ background:rgba(255,193,104,.16); color:var(--warn) }
.badge.danger{ background:rgba(255,107,129,.14); color:var(--danger) }
.badge.neutral{ background:var(--flat); color:var(--ink-soft) }

/* ---------- 3D glow icon tiles ---------- */
.icon3d{
  width:46px; height:46px; border-radius:16px; display:grid; place-items:center; flex:none;
  background:radial-gradient(120% 120% at 25% 20%, rgba(255,255,255,.5), transparent 55%), linear-gradient(155deg, var(--i1,var(--glow)), var(--i2,var(--gold2)));
  box-shadow:0 10px 20px -8px var(--i1,var(--glow)), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.18);
  color:#fff; position:relative; overflow:hidden;
}
.icon3d.sm{ width:32px; height:32px; border-radius:11px }
.icon3d svg{ width:22px; height:22px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)) }
.icon3d.sm svg{ width:17px; height:17px }

/* ---------- KPI stat tile ---------- */
.stat{ position:relative; padding:18px 16px; border-radius:18px; background:var(--flat); border:1px solid var(--flat-line); overflow:hidden }
.stat .val{ font-family:var(--display); font-size:28px; font-weight:700; font-variant-numeric:tabular-nums }
.stat .lbl{ font-size:12.5px; color:var(--ink-soft); margin-top:2px }
.stat .trend{ position:absolute; inset-inline-end:14px; top:16px; font-size:12px; font-weight:700 }
.stat .trend.up{ color:var(--ok) } .stat .trend.down{ color:var(--danger) }

/* ---------- Progress / expiry meter ---------- */
.meter{ position:relative; height:9px; border-radius:99px; background:var(--flat); overflow:hidden }
.meter i{ position:absolute; inset-inline-start:0; top:0; bottom:0; border-radius:99px; transition:width .9s var(--ease) }

/* ---------- App shell: nav ---------- */
.app-shell{ max-width:980px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 18px 14px; position:sticky; top:0; z-index:30; background:linear-gradient(var(--void) 72%, transparent); }
.brand{ display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:17px }
.main{ flex:1; padding:6px 16px 240px; }
.navbar{
  position:fixed; inset-inline:0; bottom:0; z-index:35;
  display:grid; grid-template-columns:repeat(5, 1fr); gap:2px 0;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(158deg, var(--lift1), var(--lift2)); border-top:1px solid var(--glass-line);
  box-shadow:0 -14px 40px rgba(0,0,0,.28);
}
.navbtn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:5px 2px; border-radius:10px; transition:color var(--dur-base) ease; min-width:0 }
.navbtn svg{ width:21px; height:21px }
.navbtn.active{ color:var(--glow) }
.navbtn.active .icon3d{ box-shadow:0 10px 20px -6px var(--glow-tint), inset 0 1px 0 rgba(255,255,255,.4) }
.navbtn span{ font-size:9.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

/* ---------- Screen transitions ---------- */
.screen{ animation:scene-in var(--dur-scene) var(--ease) both }
@keyframes scene-in{ from{ opacity:0; transform:translateY(10px) scale(.985) } to{ opacity:1; transform:none } }
.screen.leaving{ animation:scene-out var(--dur-base) ease both }
@keyframes scene-out{ to{ opacity:0; transform:translateY(-6px) scale(.98) } }
.stagger > *{ animation:rise .4s var(--ease) both }
.stagger > *:nth-child(1){animation-delay:.02s} .stagger > *:nth-child(2){animation-delay:.06s}
.stagger > *:nth-child(3){animation-delay:.1s} .stagger > *:nth-child(4){animation-delay:.14s}
.stagger > *:nth-child(5){animation-delay:.18s} .stagger > *:nth-child(6){animation-delay:.22s}
@keyframes rise{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

/* ---------- Modal / sheet ---------- */
.overlay{ position:fixed; inset:0; background:rgba(5,6,12,.55); display:grid; place-items:center; padding:16px; z-index:200; animation:fade .2s ease }
@keyframes fade{ from{opacity:0} to{opacity:1} }
.sheet{
  max-width:460px; width:100%; max-height:88vh; overflow:auto; animation:sheet-in .3s var(--ease) both;
  background:linear-gradient(158deg, var(--lift1), var(--lift2));
}
.sheet::before, .sheet::after{ opacity:.5 }
@keyframes sheet-in{ from{ opacity:0; transform:translateY(24px) scale(.97) } to{ opacity:1; transform:none } }

.field{ margin-bottom:14px }
.field label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px }
.field input, .field select, .field textarea{
  width:100%; background:var(--flat); border:1px solid var(--flat-line); border-radius:12px;
  padding:12px 14px; color:var(--ink); font-size:15px; outline:none;
  transition:border-color var(--dur-base) ease, box-shadow var(--dur-base) ease;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--glow); box-shadow:0 0 0 3px var(--glow-tint) }

.empty{ text-align:center; padding:50px 20px; color:var(--ink-faint) }
.toast{ position:fixed; inset-inline:16px; bottom:calc(208px + env(safe-area-inset-bottom)); max-width:420px; margin:auto; background:var(--solid); color:var(--ink); border:1px solid var(--glass-line); padding:13px 18px; border-radius:14px; font-size:14px; z-index:300; animation:sheet-in .25s var(--ease) }

::-webkit-scrollbar{ width:0; height:0 }
</style>

  <script>

/* ============================================================
   GRRK — Data Layer (localStorage, no backend)
   Single source of truth all modules read/write through.
   ============================================================ */
const DB_KEY = 'grrk_db_v1';

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function daysUntil(dateStr){ if(!dateStr) return null; const d=new Date(dateStr), n=new Date(); d.setHours(0,0,0,0); n.setHours(0,0,0,0); return Math.round((d-n)/86400000); }
function expiryStatus(dateStr){ const d=daysUntil(dateStr); if(d===null) return 'neutral'; if(d<0) return 'danger'; if(d<=30) return 'warn'; return 'ok'; }

  ],

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  saveDB(SEED);
  return JSON.parse(JSON.stringify(SEED));
}
function saveDB(db){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }

const DB = {
  state: loadDB(),
  list(coll){ return this.state[coll] || []; },
  get(coll, id){ return (this.state[coll]||[]).find(x=>x.id===id); },
  add(coll, item){ item.id = item.id || uid(coll[0]); (this.state[coll]=this.state[coll]||[]).push(item); saveDB(this.state); return item; },
  update(coll, id, patch){ const arr=this.state[coll]||[]; const i=arr.findIndex(x=>x.id===id); if(i>-1){ arr[i]=Object.assign({}, arr[i], patch); saveDB(this.state); return arr[i]; } },
  remove(coll, id){ this.state[coll] = (this.state[coll]||[]).filter(x=>x.id!==id); saveDB(this.state); },
  reset(){ this.state = JSON.parse(JSON.stringify(SEED)); saveDB(this.state); },
  allDocuments(){ return this.list('documents'); },
  expiringDocuments(withinDays=45){
    return this.allDocuments().map(d=>({...d, daysLeft:daysUntil(d.expiryDate), status:expiryStatus(d.expiryDate)}))
      .filter(d=>d.daysLeft!==null && d.daysLeft<=withinDays)
      .sort((a,b)=>a.daysLeft-b.daysLeft);
  },
  entityLabel(type, id){
    const map = {employee:'employees', contractor:'contractors', company:'companies', visitor:'visitors', organization:'organizations'};
    const row = this.get(map[type], id);
    if(!row) return '—';
    return row.nameAr || row.nameEn || '—';
  }
};

/* ============================================================
   GRRK — Export & Share utilities (shared across all modules)
   Uses CDN libraries loaded in <head>: XLSX (SheetJS), jsPDF, html2canvas.
   All functions are defensive: if a library failed to load (e.g. the
   device is offline), they fall back gracefully with a toast instead
   of throwing.
   ============================================================ */
const GRRK_EXPORT = (function(){

  function isAr(){ return (document.documentElement.getAttribute('lang') || 'ar') === 'ar'; }
  function tr(ar, en){ return isAr() ? ar : en; }

  function notify(msg){
    // Modules pass their own ctx.showToast; this is a last-resort fallback
    // for code paths that don't have ctx in scope.
    try{
      const el = document.getElementById('toastEl');
      if(el){ el.textContent = msg; el.style.display='block'; setTimeout(()=>{ el.style.display='none'; }, 2600); return; }
    }catch(e){}
    console.warn('[GRRK export]', msg);
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
  }

  // Share a File via the native OS share sheet (WhatsApp/Email/etc. on mobile).
  // Falls back to downloading the file if Web Share (with files) isn't supported —
  // the user can then attach it manually from their downloads/files app.
  async function shareFile(blob, filename, mimeType, title, showToastFn){
    const toast = showToastFn || notify;
    const file = new File([blob], filename, {type: mimeType});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: title || filename});
        return 'shared';
      }
    }catch(err){
      // user cancelled the share sheet — not an error, do nothing further
      if(err && err.name === 'AbortError') return 'cancelled';
    }
    // Fallback: just download it, and tell the user how to send it themselves.
    downloadBlob(blob, filename);
    toast(tr('تم تنزيل الملف — أرفقه يدوياً في واتساب أو البريد', 'File downloaded — attach it manually in WhatsApp or email'));
    return 'downloaded';
  }

  // Share plain text/a link (always works — every browser with Web Share supports text).
  async function shareText(text, title, showToastFn){
    const toast = showToastFn || notify;
    try{
      if(navigator.share){ await navigator.share({text, title: title || ''}); return 'shared'; }
    }catch(err){
      if(err && err.name === 'AbortError') return 'cancelled';
    }
    try{ await navigator.clipboard.writeText(text); toast(tr('تم نسخ الرابط','Link copied')); return 'copied'; }
    catch(e){ toast(tr('تعذرت المشاركة','Could not share')); return 'failed'; }
  }

  // ---- Excel export ----
  // rows: array of plain objects (keys become column headers, in insertion order)
  function exportExcel(rows, filename, sheetName){
    if(typeof XLSX === 'undefined'){ notify(tr('مكتبة إكسل غير متاحة (تحتاج اتصال إنترنت أول مرة)','Excel library unavailable (needs internet the first time)')); return null; }
    const ws = XLSX.utils.json_to_sheet(rows || []);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Sheet1');
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    return new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }

  // ---- PDF export (simple tabular report) ----
  // columns: [{key,label}], rows: array of objects
  function exportPDF(title, columns, rows){
    const JsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    if(!JsPDFCtor){ notify(tr('مكتبة PDF غير متاحة (تحتاج اتصال إنترنت أول مرة)','PDF library unavailable (needs internet the first time)')); return null; }
    const doc = new JsPDFCtor({orientation:'p', unit:'pt', format:'a4'});
    const marginX = 40; let y = 50;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(String(title || 'GRRK Report'), marginX, y); y += 14;
    doc.setFontSize(9); doc.setFont('helvetica','normal');
    doc.text(new Date().toISOString().slice(0,10), marginX, y); y += 20;

    const colWidth = (595 - marginX*2) / columns.length;
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    columns.forEach((c,i)=> doc.text(String(c.label).slice(0,28), marginX + i*colWidth, y));
    y += 6; doc.setLineWidth(0.5); doc.line(marginX, y, 595-marginX, y); y += 14;
    doc.setFont('helvetica','normal');
    (rows||[]).forEach(row=>{
      if(y > 780){ doc.addPage(); y = 50; }
      columns.forEach((c,i)=>{
        const val = row[c.key] == null ? '' : String(row[c.key]);
        doc.text(val.slice(0,30), marginX + i*colWidth, y);
      });
      y += 16;
    });
    return doc.output('blob');
  }

  // ---- Image export: snapshot a DOM element (e.g. a report card) as PNG ----
  async function exportImage(el){
    if(typeof html2canvas === 'undefined'){ notify(tr('مكتبة الصور غير متاحة (تحتاج اتصال إنترنت أول مرة)','Image library unavailable (needs internet the first time)')); return null; }
    const canvas = await html2canvas(el, {backgroundColor: getComputedStyle(document.body).backgroundColor || '#0B0D14', scale: 2});
    return new Promise(resolve=> canvas.toBlob(blob=> resolve(blob), 'image/png'));
  }

  return { downloadBlob, shareFile, shareText, exportExcel, exportPDF, exportImage };
})();

// Mount function — called by the shell router.
function renderEmployees(root, ctx){
  const lang = ctx.lang;
  const isAr = lang === 'ar';
  const t = ctx.t;

  const L = {
    title: isAr ? 'الموظفون' : 'Employees',
    totalLbl: isAr ? 'إجمالي الموظفين' : 'Total employees',
    searchPh: isAr ? 'ابحث بالاسم أو الوظيفة أو الإدارة...' : 'Search by name, role or department...',
    role: isAr ? 'الوظيفة' : 'Role',
    dept: isAr ? 'الإدارة' : 'Department',
    nationalId: isAr ? 'رقم الهوية' : 'National ID',
    phone: isAr ? 'الهاتف' : 'Phone',
    email: isAr ? 'البريد الإلكتروني' : 'Email',
    idExpiry: isAr ? 'تاريخ انتهاء الهوية' : 'ID expiry date',
    status: isAr ? 'الحالة' : 'Status',
    nameAr: isAr ? 'الاسم (عربي)' : 'Name (Arabic)',
    nameEn: isAr ? 'الاسم (إنجليزي)' : 'Name (English)',
    addTitle: isAr ? 'إضافة موظف' : 'Add Employee',
    editTitle: isAr ? 'تعديل موظف' : 'Edit Employee',
    detailTitle: isAr ? 'تفاصيل الموظف' : 'Employee Details',
    confirmDeleteTitle: isAr ? 'تأكيد الحذف' : 'Confirm Delete',
    confirmDeleteMsg: isAr ? 'هل أنت متأكد من حذف هذا الموظف؟ لا يمكن التراجع عن هذا الإجراء.' : 'Are you sure you want to delete this employee? This action cannot be undone.',
    savedMsg: isAr ? 'تم حفظ بيانات الموظف' : 'Employee saved',
    deletedMsg: isAr ? 'تم حذف الموظف' : 'Employee deleted',
    activeStatus: isAr ? 'نشط' : 'active',
    inactiveLbl: isAr ? 'غير نشط' : 'Inactive',
    activeLbl: isAr ? 'نشط' : 'Active',
    expired: t.expired,
    expiringSoon: t.expiringSoon,
    valid: t.valid,
    daysLeft: t.daysLeft,
    noExpiry: isAr ? 'بدون تاريخ' : 'No date',
    required: isAr ? 'الاسم والوظيفة مطلوبان' : 'Name and role are required',
    exportExcel: isAr ? 'تصدير Excel' : 'Export Excel',
    exportPDF: isAr ? 'تصدير PDF' : 'Export PDF',
    colName: isAr ? 'الاسم' : 'Name',
    colRole: isAr ? 'الوظيفة' : 'Role',
    colDept: isAr ? 'الإدارة' : 'Department',
    colPhone: isAr ? 'الهاتف' : 'Phone',
    colIdExpiry: isAr ? 'تاريخ انتهاء الهوية' : 'ID Expiry',
    colStatus: isAr ? 'الحالة' : 'Status',
    reportTitle: isAr ? 'تقرير الموظفين' : 'Employees Report',
  };

  function daysUntil(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr), n = new Date();
    d.setHours(0,0,0,0); n.setHours(0,0,0,0);
    return Math.round((d - n) / 86400000);
  }
  function expiryStatus(dateStr){
    const d = daysUntil(dateStr);
    if(d === null) return 'neutral';
    if(d < 0) return 'danger';
    if(d <= 30) return 'warn';
    return 'ok';
  }
  function statusText(dateStr){
    const st = expiryStatus(dateStr);
    const d = daysUntil(dateStr);
    if(st === 'neutral') return L.noExpiry;
    if(st === 'danger') return L.expired;
    if(st === 'warn') return `${d} ${L.daysLeft}`;
    return L.valid;
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function initials(emp){
    const name = isAr ? (emp.nameAr || emp.nameEn || '') : (emp.nameEn || emp.nameAr || '');
    const parts = name.trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return '?';
    if(parts.length === 1) return parts[0].slice(0,2);
    return (parts[0][0] || '') + (parts[1][0] || '');
  }
  function iconSvgPerson(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg>`;
  }
  function iconSvgPencil(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>`;
  }
  function iconSvgTrash(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M7 7l1 13h8l1-13"/></svg>`;
  }

  // gradient pairs cycling per row for distinct icon tiles
  const GRADS = [
    ['#8C94E8','#C9932E'], ['#52E3A6','#1C8F6B'], ['#FFC168','#B9872E'],
    ['#6FB1FF','#3C5FD9'], ['#F2879B','#C83C53'], ['#B38CF2','#6A4FB0'],
  ];

  let searchTerm = '';

  function getFiltered(){
    const all = DB.list('employees');
    if(!searchTerm.trim()) return all;
    const q = searchTerm.trim().toLowerCase();
    return all.filter(e => {
      const hay = [e.nameAr, e.nameEn, e.role, e.dept].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  function displayName(e){ return isAr ? (e.nameAr || e.nameEn || '—') : (e.nameEn || e.nameAr || '—'); }

  function rowHtml(e, idx){
    const st = expiryStatus(e.idExpiry);
    const [i1, i2] = GRADS[idx % GRADS.length];
    return `
      <div class="card pressable emp-row" data-id="${esc(e.id)}" role="button" tabindex="0">
        <div class="icon3d" style="--i1:${i1};--i2:${i2}">
          <span class="emp-initials">${esc(initials(e))}</span>
        </div>
        <div class="emp-main">
          <div class="emp-name">${esc(displayName(e))}</div>
          <div class="emp-sub">${esc(e.role || '')}${e.dept ? ' · ' + esc(e.dept) : ''}</div>
        </div>
        <div class="emp-badge-wrap">
          <span class="badge ${st}">${esc(statusText(e.idExpiry))}</span>
        </div>
      </div>
    `;
  }

  function statusLabelText(e){ return e.status === 'inactive' ? L.inactiveLbl : L.activeLbl; }

  function exportRows(){
    return getFiltered().map(e => ({
      [L.colName]: displayName(e),
      [L.colRole]: e.role || '',
      [L.colDept]: e.dept || '',
      [L.colPhone]: e.phone || '',
      [L.colIdExpiry]: e.idExpiry || '',
      [L.colStatus]: statusLabelText(e),
    }));
  }

  async function doExportExcel(){
    const blob = GRRK_EXPORT.exportExcel(exportRows(), 'employees.xlsx', L.title);
    if(!blob) return;
    const filename = `GRRK-employees-${new Date().toISOString().slice(0,10)}.xlsx`;
    await GRRK_EXPORT.shareFile(blob, filename, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', L.title, ctx.showToast);
  }

  async function doExportPDF(){
    const columns = [
      {key:'name', label: L.colName},
      {key:'role', label: L.colRole},
      {key:'dept', label: L.colDept},
      {key:'phone', label: L.colPhone},
      {key:'idExpiry', label: L.colIdExpiry},
      {key:'status', label: L.colStatus},
    ];
    const rows = getFiltered().map(e => ({
      name: displayName(e), role: e.role || '', dept: e.dept || '',
      phone: e.phone || '', idExpiry: e.idExpiry || '', status: statusLabelText(e),
    }));
    const blob = GRRK_EXPORT.exportPDF(L.reportTitle, columns, rows);
    if(!blob) return;
    const filename = `GRRK-employees-${new Date().toISOString().slice(0,10)}.pdf`;
    await GRRK_EXPORT.shareFile(blob, filename, 'application/pdf', L.title, ctx.showToast);
  }

  function renderList(){
    const listEl = root.querySelector('#empList');
    const countEl = root.querySelector('#empCount');
    if(!listEl) return;
    const filtered = getFiltered();
    if(countEl) countEl.textContent = DB.list('employees').length;
    if(filtered.length === 0){
      listEl.innerHTML = `<div class="empty">${esc(t.empty)}</div>`;
      listEl.classList.remove('stagger');
      return;
    }
    listEl.classList.add('stagger');
    listEl.innerHTML = filtered.map((e, i) => rowHtml(e, i)).join('');
    listEl.querySelectorAll('.emp-row').forEach(rowEl => {
      rowEl.addEventListener('click', () => openDetail(rowEl.getAttribute('data-id')));
      rowEl.addEventListener('keydown', ev => {
        if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); openDetail(rowEl.getAttribute('data-id')); }
      });
    });
  }

  function formHtml(emp){
    const e = emp || {};
    return `
      <h2 class="h2" style="margin-bottom:16px">${emp ? esc(L.editTitle) : esc(L.addTitle)}</h2>
      <form id="empForm">
        <div class="field">
          <label>${esc(L.nameAr)}</label>
          <input type="text" name="nameAr" value="${esc(e.nameAr || '')}" />
        </div>
        <div class="field">
          <label>${esc(L.nameEn)}</label>
          <input type="text" name="nameEn" value="${esc(e.nameEn || '')}" />
        </div>
        <div class="field">
          <label>${esc(L.role)}</label>
          <input type="text" name="role" value="${esc(e.role || '')}" />
        </div>
        <div class="field">
          <label>${esc(L.dept)}</label>
          <input type="text" name="dept" value="${esc(e.dept || '')}" />
        </div>
        <div class="field">
          <label>${esc(L.nationalId)}</label>
          <input type="text" name="nationalId" value="${esc(e.nationalId || '')}" />
        </div>
        <div class="field">
          <label>${esc(L.phone)}</label>
          <input type="text" name="phone" value="${esc(e.phone || '')}" />
        </div>
        <div class="field">
          <label>${esc(L.email)}</label>
          <input type="email" name="email" value="${esc(e.email || '')}" />
        </div>
        <div class="field">
          <label>${esc(L.idExpiry)}</label>
          <input type="date" name="idExpiry" value="${esc(e.idExpiry || '')}" />
        </div>
        <div class="field">
          <label>${esc(L.status)}</label>
          <select name="status">
            <option value="active" ${e.status === 'active' || !e.status ? 'selected' : ''}>${esc(L.activeLbl)}</option>
            <option value="inactive" ${e.status === 'inactive' ? 'selected' : ''}>${esc(L.inactiveLbl)}</option>
          </select>
        </div>
        <button type="submit" class="btn primary block">${esc(t.save)}</button>
      </form>
    `;
  }

  function openForm(emp){
    ctx.openOverlay(formHtml(emp), overlayEl => {
      const formEl = overlayEl.querySelector('#empForm');
      formEl.addEventListener('submit', ev => {
        ev.preventDefault();
        const fd = new FormData(formEl);
        const data = {
          nameAr: (fd.get('nameAr') || '').toString().trim(),
          nameEn: (fd.get('nameEn') || '').toString().trim(),
          role: (fd.get('role') || '').toString().trim(),
          dept: (fd.get('dept') || '').toString().trim(),
          nationalId: (fd.get('nationalId') || '').toString().trim(),
          phone: (fd.get('phone') || '').toString().trim(),
          email: (fd.get('email') || '').toString().trim(),
          idExpiry: (fd.get('idExpiry') || '').toString().trim(),
          status: (fd.get('status') || 'active').toString(),
        };
        if(!data.nameAr && !data.nameEn){ ctx.showToast(L.required); return; }
        if(!data.role){ ctx.showToast(L.required); return; }
        if(emp && emp.id){
          DB.update('employees', emp.id, data);
        } else {
          DB.add('employees', data);
        }
        ctx.closeOverlay();
        ctx.showToast(L.savedMsg);
        renderList();
      });
    });
  }

  function confirmDeleteHtml(){
    return `
      <h2 class="h2" style="margin-bottom:14px">${esc(L.confirmDeleteTitle)}</h2>
      <p class="emp-confirm-txt">${esc(L.confirmDeleteMsg)}</p>
      <div class="emp-actions">
        <button type="button" class="btn ghost" id="empCancelDel">${esc(t.cancel)}</button>
        <button type="button" class="btn danger" id="empConfirmDel">${esc(t.delete)}</button>
      </div>
    `;
  }

  function openDetail(id){
    const emp = DB.get('employees', id);
    if(!emp) return;
    const st = expiryStatus(emp.idExpiry);
    const [i1, i2] = GRADS[0];
    const html = `
      <div class="emp-detail-head">
        <div class="icon3d" style="--i1:${i1};--i2:${i2}">
          <span class="emp-initials">${esc(initials(emp))}</span>
        </div>
        <div>
          <div class="emp-detail-name">${esc(displayName(emp))}</div>
          <div class="emp-detail-sub">${esc(emp.role || '')}${emp.dept ? ' · ' + esc(emp.dept) : ''}</div>
        </div>
      </div>
      <div class="emp-grid">
        <div><div class="k">${esc(L.nameAr)}</div><div class="v">${esc(emp.nameAr || '—')}</div></div>
        <div><div class="k">${esc(L.nameEn)}</div><div class="v">${esc(emp.nameEn || '—')}</div></div>
        <div><div class="k">${esc(L.role)}</div><div class="v">${esc(emp.role || '—')}</div></div>
        <div><div class="k">${esc(L.dept)}</div><div class="v">${esc(emp.dept || '—')}</div></div>
        <div><div class="k">${esc(L.nationalId)}</div><div class="v num">${esc(emp.nationalId || '—')}</div></div>
        <div><div class="k">${esc(L.phone)}</div><div class="v num">${esc(emp.phone || '—')}</div></div>
        <div><div class="k">${esc(L.email)}</div><div class="v">${esc(emp.email || '—')}</div></div>
        <div><div class="k">${esc(L.idExpiry)}</div><div class="v num">${esc(emp.idExpiry || '—')}</div></div>
        <div><div class="k">${esc(L.status)}</div><div class="v">${emp.status === 'inactive' ? esc(L.inactiveLbl) : esc(L.activeLbl)}</div></div>
        <div><div class="k">${esc(L.idExpiry)} — ${esc(t.status || '')}</div><div class="v"><span class="badge ${st}">${esc(statusText(emp.idExpiry))}</span></div></div>
      </div>
      <div class="emp-actions">
        <button type="button" class="btn ghost" id="empEditBtn">${esc(t.edit)}</button>
        <button type="button" class="btn danger" id="empDeleteBtn">${esc(t.delete)}</button>
      </div>
    `;
    ctx.openOverlay(html, overlayEl => {
      overlayEl.querySelector('#empEditBtn').addEventListener('click', () => {
        ctx.closeOverlay();
        openForm(emp);
      });
      overlayEl.querySelector('#empDeleteBtn').addEventListener('click', () => {
        ctx.openOverlay(confirmDeleteHtml(), confirmEl => {
          confirmEl.querySelector('#empCancelDel').addEventListener('click', () => {
            ctx.closeOverlay();
            openDetail(id);
          });
          confirmEl.querySelector('#empConfirmDel').addEventListener('click', () => {
            DB.remove('employees', id);
            ctx.closeOverlay();
            ctx.showToast(L.deletedMsg);
            renderList();
          });
        });
      });
    });
  }

  root.innerHTML = `
    <div>
      <div class="glass">
        <div class="emp-hero-row">
          <div>
            <div class="emp-count" id="empCount">0</div>
            <div class="emp-count-lbl">${esc(L.totalLbl)}</div>
          </div>
        </div>
        <div class="field emp-search">
          <input type="text" id="empSearchInput" placeholder="${esc(L.searchPh)}" />
        </div>
        <div class="emp-export-row">
          <button type="button" class="btn sm" id="empExportExcel">${esc(L.exportExcel)}</button>
          <button type="button" class="btn sm" id="empExportPDF">${esc(L.exportPDF)}</button>
        </div>
      </div>
      <div class="emp-list stagger" id="empList"></div>
    </div>
    <button type="button" class="fab" id="empFab" aria-label="${esc(t.add)}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  `;

  const searchInput = root.querySelector('#empSearchInput');
  searchInput.addEventListener('input', () => {
    searchTerm = searchInput.value;
    renderList();
  });

  root.querySelector('#empFab').addEventListener('click', () => openForm(null));
  root.querySelector('#empExportExcel').addEventListener('click', doExportExcel);
  root.querySelector('#empExportPDF').addEventListener('click', doExportPDF);

  renderList();
}

    nameArLbl: isAr ? 'الاسم (عربي)' : 'Name (Arabic)',
    nameEnLbl: isAr ? 'الاسم (إنجليزي)' : 'Name (English)',
    addTitle: isAr ? 'إضافة مقاول' : 'Add contractor',
    editTitle: isAr ? 'تعديل مقاول' : 'Edit contractor',
    detailTitle: isAr ? 'تفاصيل المقاول' : 'Contractor details',
    confirmDeleteTitle: isAr ? 'تأكيد الحذف' : 'Confirm deletion',
    confirmDeleteMsg: isAr ? 'هل تريد حذف هذا المقاول؟ لا يمكن التراجع عن هذا الإجراء.' : 'Delete this contractor? This action cannot be undone.',
    savedAdd: isAr ? 'تمت إضافة المقاول' : 'Contractor added',
    savedEdit: isAr ? 'تم حفظ التعديلات' : 'Changes saved',
    deleted: isAr ? 'تم حذف المقاول' : 'Contractor deleted',
    expiredLbl: isAr ? 'منتهي' : 'Expired',
    daysAgo: isAr ? 'يوم مضى' : 'days ago',
    daysLeft: isAr ? 'يوم متبقٍ' : 'days left',
    noDate: isAr ? 'غير محدد' : 'Not set',
    required: isAr ? 'الاسم ورقم التواصل مطلوبان' : 'Name and contact are required',
    statusActive: isAr ? 'نشط' : 'active',
    statusInactive: isAr ? 'غير نشط' : 'inactive',
    exportExcel: isAr ? 'تصدير Excel' : 'Export Excel',

    colName: isAr ? 'الاسم' : 'Name',
    colService: isAr ? 'نوع الخدمة' : 'Service',
    colContact: isAr ? 'رقم التواصل' : 'Contact',
    colContractEnd: isAr ? 'نهاية العقد' : 'Contract End',
    colStatus: isAr ? 'الحالة' : 'Status',
    reportTitle: isAr ? 'تقرير المقاولين' : 'Contractors Report',
  };

  function daysUntilLocal(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr), n = new Date();
    d.setHours(0,0,0,0); n.setHours(0,0,0,0);
    return Math.round((d - n) / 86400000);
  }
  function statusOf(dateStr){
    const d = daysUntilLocal(dateStr);
    if(d === null) return 'neutral';
    if(d < 0) return 'danger';
    if(d <= 30) return 'warn';
    return 'ok';
  }
  function badgeText(dateStr){
    const d = daysUntilLocal(dateStr);
    if(d === null) return L.noDate;
    if(d < 0) return `${Math.abs(d)} ${L.daysAgo} · ${L.expiredLbl}`;
    return `${d} ${L.daysLeft}`;
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function nameOf(c){ return (isAr ? (c.nameAr || c.nameEn) : (c.nameEn || c.nameAr)) || '—'; }

  const iconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="7" width="18" height="13" rx="2"/>
    <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    <path d="M3 12h18"/>
    <path d="M10 12v2h4v-2"/>
  </svg>`;

  const warnIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:40px;height:40px;color:var(--danger)">
    <path d="M12 9v4"/>
    <path d="M12 17h.01"/>
    <path d="M10.3 3.9 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
  </svg>`;

  let searchQuery = '';

  function getList(){
    const all = DB.list('contractors');
    const q = searchQuery.trim().toLowerCase();
    let filtered = all;
    if(q){
      filtered = all.filter(c => {
        const hay = [c.nameAr, c.nameEn, c.service, c.contact].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      });
    }
    return filtered.slice().sort((a,b) => {
      const da = daysUntilLocal(a.contractEnd), db = daysUntilLocal(b.contractEnd);
      if(da === null && db === null) return 0;
      if(da === null) return 1;
      if(db === null) return -1;
      return da - db;
    });
  }

  function statusLabelText(c){ return c.status === 'inactive' ? L.statusInactive : L.statusActive; }

  function exportRows(){
    return getList().map(c => ({
      [L.colName]: nameOf(c),
      [L.colService]: c.service || '',
      [L.colContact]: c.contact || '',
      [L.colContractEnd]: c.contractEnd || '',
      [L.colStatus]: statusLabelText(c),
    }));
  }

  async function doExportExcel(){
    const blob = GRRK_EXPORT.exportExcel(exportRows(), 'contractors.xlsx', L.title);
    if(!blob) return;
    const filename = `GRRK-contractors-${new Date().toISOString().slice(0,10)}.xlsx`;
    await GRRK_EXPORT.shareFile(blob, filename, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', L.title, ctx.showToast);
  }

  async function doExportPDF(){
    const columns = [
      {key:'name', label: L.colName},
      {key:'service', label: L.colService},
      {key:'contact', label: L.colContact},
      {key:'contractEnd', label: L.colContractEnd},
      {key:'status', label: L.colStatus},
    ];
    const rows = getList().map(c => ({
      name: nameOf(c), service: c.service || '', contact: c.contact || '',
      contractEnd: c.contractEnd || '', status: statusLabelText(c),
    }));
    const blob = GRRK_EXPORT.exportPDF(L.reportTitle, columns, rows);
    if(!blob) return;
    const filename = `GRRK-contractors-${new Date().toISOString().slice(0,10)}.pdf`;
    await GRRK_EXPORT.shareFile(blob, filename, 'application/pdf', L.title, ctx.showToast);
  }

  function renderList(){
    const listEl = root.querySelector('.con-list');
    const emptyEl = root.querySelector('.con-empty-wrap');
    const items = getList();
    if(!items.length){
      listEl.innerHTML = '';
      listEl.style.display = 'none';
      emptyEl.style.display = '';
      emptyEl.innerHTML = `<div class="empty">${esc(t.empty)}</div>`;
      return;
    }
    listEl.style.display = '';
    emptyEl.style.display = 'none';
    listEl.innerHTML = items.map(c => {
      const st = statusOf(c.contractEnd);
      return `
      <button class="card pressable con-row" data-id="${esc(c.id)}" type="button">
        <div class="icon3d" style="--i1:#6C7AE0;--i2:#3C4590">${iconSvg}</div>
        <div class="con-info">
          <div class="con-name">${esc(nameOf(c))}</div>
          <div class="con-sub">${esc(c.service || '—')}</div>
        </div>
        <div class="con-side">
          <span class="badge ${st}">${esc(badgeText(c.contractEnd))}</span>
          <span class="con-contact num">${esc(c.contact || '—')}</span>
        </div>
      </button>`;
    }).join('');
    listEl.querySelectorAll('.con-row').forEach(btn => {
      btn.addEventListener('click', () => openDetail(btn.getAttribute('data-id')));
    });
  }

  function renderHeroStats(){
    const all = DB.list('contractors');
    const expiringCount = all.filter(c => {
      const d = daysUntilLocal(c.contractEnd);
      return d !== null && d >= 0 && d <= 30;
    }).length;
    root.querySelector('.con-stat-total .val').textContent = all.length;
    root.querySelector('.con-stat-expiring .val').textContent = expiringCount;
  }

  function refresh(){
    renderHeroStats();
    renderList();
  }

  function openDetail(id){
    const c = DB.get('contractors', id);
    if(!c) return;
    const st = statusOf(c.contractEnd);
    const html = `
      <div class="glass sheet">
        <h2 class="h2">${esc(L.detailTitle)}</h2>
        <div class="con-detail-grid">
          <div class="con-detail-item"><span class="k">${esc(L.nameArLbl)}</span><span class="v">${esc(c.nameAr || '—')}</span></div>
          <div class="con-detail-item"><span class="k">${esc(L.nameEnLbl)}</span><span class="v">${esc(c.nameEn || '—')}</span></div>
          <div class="con-detail-item"><span class="k">${esc(L.service)}</span><span class="v">${esc(c.service || '—')}</span></div>
          <div class="con-detail-item"><span class="k">${esc(L.contact)}</span><span class="v num">${esc(c.contact || '—')}</span></div>
          <div class="con-detail-item"><span class="k">${esc(L.contractEnd)}</span><span class="v"><span class="badge ${st} num">${esc(c.contractEnd || L.noDate)} · ${esc(badgeText(c.contractEnd))}</span></span></div>
          <div class="con-detail-item"><span class="k">${esc(L.statusField)}</span><span class="v">${esc(c.status || L.statusActive)}</span></div>
        </div>
        <div class="con-actions">
          <button class="btn ghost con-close-btn" type="button">${esc(t.cancel)}</button>
          <button class="btn danger con-delete-btn" type="button">${esc(t.delete)}</button>
          <button class="btn primary con-edit-btn" type="button">${esc(t.edit)}</button>
        </div>
      </div>`;
    ctx.openOverlay(html, (overlayEl) => {
      overlayEl.querySelector('.con-close-btn').addEventListener('click', () => ctx.closeOverlay());
      overlayEl.querySelector('.con-edit-btn').addEventListener('click', () => openForm(c));
      overlayEl.querySelector('.con-delete-btn').addEventListener('click', () => openDeleteConfirm(c));
    });
  }

  function openDeleteConfirm(c){
    const html = `
      <div class="glass sheet con-confirm">
        <div class="con-warn-icon">${warnIconSvg}</div>
        <h2 class="h2">${esc(L.confirmDeleteTitle)}</h2>
        <p class="muted" style="margin-top:8px">${esc(L.confirmDeleteMsg)}</p>
        <div class="con-actions">
          <button class="btn ghost con-cancel-del" type="button">${esc(t.cancel)}</button>
          <button class="btn danger con-confirm-del" type="button">${esc(t.delete)}</button>
        </div>
      </div>`;
    ctx.openOverlay(html, (overlayEl) => {
      overlayEl.querySelector('.con-cancel-del').addEventListener('click', () => openDetail(c.id));
      overlayEl.querySelector('.con-confirm-del').addEventListener('click', () => {
        DB.remove('contractors', c.id);
        ctx.closeOverlay();
        refresh();
        ctx.showToast(L.deleted);
      });
    });
  }

  function openForm(existing){
    const isEdit = !!existing;
    const c = existing || { nameAr:'', nameEn:'', service:'', contact:'', contractEnd:'', status:'active' };
    const html = `
      <div class="glass sheet">
        <h2 class="h2">${esc(isEdit ? L.editTitle : L.addTitle)}</h2>
        <form class="con-form" style="margin-top:14px">
          <div class="field">
            <label>${esc(L.nameArLbl)}</label>
            <input type="text" name="nameAr" value="${esc(c.nameAr)}" />
          </div>
          <div class="field">
            <label>${esc(L.nameEnLbl)}</label>
            <input type="text" name="nameEn" value="${esc(c.nameEn)}" />
          </div>
          <div class="field">
            <label>${esc(L.service)}</label>
            <input type="text" name="service" value="${esc(c.service)}" />
          </div>
          <div class="field">
            <label>${esc(L.contact)}</label>
            <input type="tel" name="contact" value="${esc(c.contact)}" />
          </div>
          <div class="field">
            <label>${esc(L.contractEnd)}</label>
            <input type="date" name="contractEnd" value="${esc(c.contractEnd)}" />
          </div>
          <div class="con-actions">
            <button type="button" class="btn ghost con-form-cancel">${esc(t.cancel)}</button>
            <button type="submit" class="btn primary">${esc(t.save)}</button>
          </div>
        </form>
      </div>`;
    ctx.openOverlay(html, (overlayEl) => {
      const form = overlayEl.querySelector('.con-form');
      overlayEl.querySelector('.con-form-cancel').addEventListener('click', () => {
        if(isEdit) openDetail(c.id); else ctx.closeOverlay();
      });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const nameAr = (fd.get('nameAr') || '').toString().trim();
        const nameEn = (fd.get('nameEn') || '').toString().trim();
        const contact = (fd.get('contact') || '').toString().trim();
        if(!(nameAr || nameEn) || !contact){
          ctx.showToast(L.required);
          return;
        }
        const patch = {
          nameAr, nameEn,
          service: (fd.get('service') || '').toString().trim(),
          contact,
          contractEnd: (fd.get('contractEnd') || '').toString(),
          status: c.status || 'active',
        };
        if(isEdit){
          DB.update('contractors', c.id, patch);
          ctx.closeOverlay();
          refresh();
          ctx.showToast(L.savedEdit);
        } else {
          DB.add('contractors', patch);
          ctx.closeOverlay();
          refresh();
          ctx.showToast(L.savedAdd);
        }
      });
    });
  }

  root.innerHTML = `
    <div class="con-wrap">
      <div class="glass">
        <div class="eyebrow">${esc(L.title)}</div>
        <h1 class="h1">${esc(L.title)}</h1>
        <div class="con-stats">
          <div class="stat con-stat-total">
            <div class="val num">0</div>
            <div class="lbl">${esc(L.total)}</div>
          </div>
          <div class="stat con-stat-expiring">
            <div class="val num">0</div>
            <div class="lbl">${esc(L.expiringSoon)}</div>
          </div>
        </div>
        <div class="con-search">
          <input type="search" class="con-search-input" placeholder="${esc(L.searchPh)}" />
        </div>
        <div class="con-export-row">
          <button type="button" class="btn sm con-export-excel">${esc(L.exportExcel)}</button>
          <button type="button" class="btn sm con-export-pdf">${esc(L.exportPDF)}</button>
        </div>
      </div>
      <div class="con-list stagger"></div>
      <div class="con-empty-wrap"></div>
    </div>
    <button class="fab con-fab" type="button" aria-label="${esc(t.add)}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px">
        <path d="M12 5v14"/><path d="M5 12h14"/>
      </svg>
    </button>
  `;

  root.querySelector('.con-search-input').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderList();
  });
  root.querySelector('.con-fab').addEventListener('click', () => openForm(null));
  root.querySelector('.con-export-excel').addEventListener('click', doExportExcel);
  root.querySelector('.con-export-pdf').addEventListener('click', doExportPDF);

  refresh();
}

// Mount function — called by the shell router.
function renderVisitors(root, ctx){
  const lang = ctx.lang;
  const isAr = lang === 'ar';
  const L = {
    title: isAr ? 'الزوار' : 'Visitors',
    upcoming: isAr ? 'زيارات قادمة' : 'Upcoming visits',
    searchPh: isAr ? 'ابحث بالاسم أو الجهة...' : 'Search by name or organization...',
    org: isAr ? 'الجهة' : 'Organization',
    purpose: isAr ? 'الغرض من الزيارة' : 'Purpose',
    visitDate: isAr ? 'تاريخ الزيارة' : 'Visit date',
    status: isAr ? 'الحالة' : 'Status',
    nameAr: isAr ? 'الاسم (عربي)' : 'Name (Arabic)',
    nameEn: isAr ? 'الاسم (إنجليزي)' : 'Name (English)',
    scheduled: isAr ? 'مجدولة' : 'Scheduled',
    completed: isAr ? 'مكتملة' : 'Completed',
    cancelled: isAr ? 'ملغاة' : 'Cancelled',
    addTitle: isAr ? 'إضافة زائر' : 'Add visitor',
    editTitle: isAr ? 'تعديل بيانات الزائر' : 'Edit visitor',
    detailTitle: isAr ? 'تفاصيل الزيارة' : 'Visit details',
    confirmDeleteTitle: isAr ? 'تأكيد الحذف' : 'Confirm delete',
    confirmDeleteMsg: isAr ? 'سيتم حذف سجل هذا الزائر نهائياً. هل أنت متأكد؟' : 'This visitor record will be permanently deleted. Are you sure?',
    markCompleted: isAr ? 'إنهاء الزيارة' : 'Mark completed',
    markCancelled: isAr ? 'إلغاء الزيارة' : 'Cancel visit',
    savedMsg: isAr ? 'تم حفظ بيانات الزائر' : 'Visitor saved',
    deletedMsg: isAr ? 'تم حذف الزائر' : 'Visitor deleted',
    statusUpdated: isAr ? 'تم تحديث الحالة' : 'Status updated',
    requiredMsg: isAr ? 'الاسم والتاريخ مطلوبان' : 'Name and date are required',
    exportExcel: isAr ? 'تصدير Excel' : 'Export Excel',
    exportPDF: isAr ? 'تصدير PDF' : 'Export PDF',
    colName: isAr ? 'الاسم' : 'Name',
    colOrg: isAr ? 'الجهة' : 'Organization',
    colPurpose: isAr ? 'الغرض' : 'Purpose',
    colVisitDate: isAr ? 'تاريخ الزيارة' : 'Visit Date',
    colStatus: isAr ? 'الحالة' : 'Status',
    reportTitle: isAr ? 'تقرير الزوار' : 'Visitors Report',
  };

  root.innerHTML = '';

  const screen = document.createElement('div');
  screen.className = '';

  let query = '';

  function todayStr(){
    const d = new Date(); d.setHours(0,0,0,0);
    return d.toISOString().slice(0,10);
  }

  function statusBadgeClass(status){
    if(status === 'completed') return 'ok';
    if(status === 'cancelled') return 'danger';
    return 'neutral';
  }
  function statusLabel(status){
    if(status === 'completed') return L.completed;
    if(status === 'cancelled') return L.cancelled;
    return L.scheduled;
  }

  function iconCalendar(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5" width="17" height="16" rx="3"></rect>
      <path d="M8 3v4M16 3v4M3.5 10h17"></path>
      <path d="M8.5 14l1.3 1.3L12.5 12.5"></path>
    </svg>`;
  }

  function getData(){
    return DB.list('visitors').slice().sort((a,b)=> (a.visitDate||'').localeCompare(b.visitDate||''));
  }

  function filtered(){
    const all = getData();
    if(!query.trim()) return all;
    const q = query.trim().toLowerCase();
    return all.filter(v=>
      (v.nameAr||'').toLowerCase().includes(q) ||
      (v.nameEn||'').toLowerCase().includes(q) ||
      (v.org||'').toLowerCase().includes(q)
    );
  }

  function upcomingCount(){
    const t = todayStr();
    return getData().filter(v=> v.visitDate && v.visitDate >= t && v.status === 'scheduled').length;
  }

  function fieldLabel(v, which){
    if(which==='name') return isAr ? (v.nameAr || v.nameEn || '—') : (v.nameEn || v.nameAr || '—');
    return '';
  }

  function buildHero(){
    return `
      <div class="glass">
        <div class="vis-hero-row">
          <div class="vis-hero-stat">
            <div class="val num">${upcomingCount()}</div>
            <div class="lbl">${L.upcoming}</div>
          </div>
          <div class="icon3d" style="--i1:#8C94E8;--i2:#C9932E">${iconCalendar()}</div>
        </div>
        <div class="vis-search">
          <input type="text" id="visSearchInput" placeholder="${L.searchPh}" value="${escapeAttr(query)}" />
        </div>
        <div class="vis-export-row">
          <button type="button" class="btn sm" id="visExportExcel">${L.exportExcel}</button>
          <button type="button" class="btn sm" id="visExportPDF">${L.exportPDF}</button>
        </div>
      </div>
    `;
  }

  function statusLabelText(v){ return statusLabel(v.status); }

  function exportRows(){
    return filtered().map(v => ({
      [L.colName]: fieldLabel(v, 'name'),
      [L.colOrg]: v.org || '',
      [L.colPurpose]: v.purpose || '',
      [L.colVisitDate]: v.visitDate || '',
      [L.colStatus]: statusLabelText(v),
    }));
  }

  async function doExportExcel(){
    const blob = GRRK_EXPORT.exportExcel(exportRows(), 'visitors.xlsx', L.title);
    if(!blob) return;
    const filename = `GRRK-visitors-${new Date().toISOString().slice(0,10)}.xlsx`;
    await GRRK_EXPORT.shareFile(blob, filename, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', L.title, ctx.showToast);
  }

  async function doExportPDF(){
    const columns = [
      {key:'name', label: L.colName},
      {key:'org', label: L.colOrg},
      {key:'purpose', label: L.colPurpose},
      {key:'visitDate', label: L.colVisitDate},
      {key:'status', label: L.colStatus},
    ];
    const rows = filtered().map(v => ({
      name: fieldLabel(v, 'name'), org: v.org || '', purpose: v.purpose || '',
      visitDate: v.visitDate || '', status: statusLabelText(v),
    }));
    const blob = GRRK_EXPORT.exportPDF(L.reportTitle, columns, rows);
    if(!blob) return;
    const filename = `GRRK-visitors-${new Date().toISOString().slice(0,10)}.pdf`;
    await GRRK_EXPORT.shareFile(blob, filename, 'application/pdf', L.title, ctx.showToast);
  }

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  function buildRow(v){
    const name = fieldLabel(v, 'name');
    const sub = [v.org, v.purpose].filter(Boolean).join(' · ');
    return `
      <button class="card pressable vis-row" data-id="${escapeAttr(v.id)}">
        <div class="icon3d sm" style="--i1:#52E3A6;--i2:#5B63C4">${iconCalendar()}</div>
        <div class="vis-row-main">
          <div class="vis-row-name">${escapeHtml(name)}</div>
          <div class="vis-row-sub">${escapeHtml(sub)}</div>
        </div>
        <div class="vis-row-end">
          <div class="vis-row-date num">${escapeHtml(v.visitDate||'—')}</div>
          <span class="badge ${statusBadgeClass(v.status)}">${statusLabel(v.status)}</span>
        </div>
      </button>
    `;
  }

  function buildList(){
    const rows = filtered();
    if(rows.length === 0){
      return `<div class="empty">${escapeHtml(ctx.t.empty)}</div>`;
    }
    return `<div class="vis-list stagger">${rows.map(buildRow).join('')}</div>`;
  }

  function renderBody(){
    screen.innerHTML = `
      ${buildHero()}
      <div id="visListWrap">${buildList()}</div>
    `;
    attachBodyEvents();
  }

  function attachBodyEvents(){
    const input = screen.querySelector('#visSearchInput');
    if(input){
      input.addEventListener('input', (e)=>{
        query = e.target.value;
        const wrap = screen.querySelector('#visListWrap');
        if(wrap) wrap.innerHTML = buildList();
        attachRowEvents();
      });
    }
    const exportExcelBtn = screen.querySelector('#visExportExcel');
    if(exportExcelBtn) exportExcelBtn.addEventListener('click', doExportExcel);
    const exportPdfBtn = screen.querySelector('#visExportPDF');
    if(exportPdfBtn) exportPdfBtn.addEventListener('click', doExportPDF);
    attachRowEvents();
  }

  function attachRowEvents(){
    screen.querySelectorAll('.vis-row').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-id');
        const v = DB.get('visitors', id);
        if(v) openDetail(v);
      });
    });
  }

  function openDetail(v){
    const html = `
      <div class="sheet glass">
        <div class="vis-sheet-title">${L.detailTitle}</div>
        <div class="vis-detail-row"><span class="vis-detail-k">${L.nameAr}</span><span class="vis-detail-v">${escapeHtml(v.nameAr||'—')}</span></div>
        <div class="vis-detail-row"><span class="vis-detail-k">${L.nameEn}</span><span class="vis-detail-v">${escapeHtml(v.nameEn||'—')}</span></div>
        <div class="vis-detail-row"><span class="vis-detail-k">${L.org}</span><span class="vis-detail-v">${escapeHtml(v.org||'—')}</span></div>
        <div class="vis-detail-row"><span class="vis-detail-k">${L.purpose}</span><span class="vis-detail-v">${escapeHtml(v.purpose||'—')}</span></div>
        <div class="vis-detail-row"><span class="vis-detail-k">${L.visitDate}</span><span class="vis-detail-v num">${escapeHtml(v.visitDate||'—')}</span></div>
        <div class="vis-detail-row"><span class="vis-detail-k">${L.status}</span><span class="badge ${statusBadgeClass(v.status)}">${statusLabel(v.status)}</span></div>

        <div class="vis-quickrow">
          <button class="btn sm" id="visMarkCompleted" ${v.status==='completed' ? 'disabled' : ''}>${L.markCompleted}</button>
          <button class="btn sm danger" id="visMarkCancelled" ${v.status==='cancelled' ? 'disabled' : ''}>${L.markCancelled}</button>
        </div>

        <div class="vis-actions">
          <button class="btn auto" id="visEditBtn">${ctx.t.edit}</button>
          <button class="btn danger auto" id="visDeleteBtn">${ctx.t.delete}</button>
        </div>
      </div>
    `;
    ctx.openOverlay(html, (overlayEl)=>{
      overlayEl.querySelector('#visMarkCompleted').addEventListener('click', ()=>{
        DB.update('visitors', v.id, {status:'completed'});
        ctx.showToast(L.statusUpdated);
        ctx.closeOverlay();
        renderBody();
      });
      overlayEl.querySelector('#visMarkCancelled').addEventListener('click', ()=>{
        DB.update('visitors', v.id, {status:'cancelled'});
        ctx.showToast(L.statusUpdated);
        ctx.closeOverlay();
        renderBody();
      });
      overlayEl.querySelector('#visEditBtn').addEventListener('click', ()=>{
        ctx.closeOverlay();
        openForm(v);
      });
      overlayEl.querySelector('#visDeleteBtn').addEventListener('click', ()=>{
        openDeleteConfirm(v);
      });
    });
  }

  function openDeleteConfirm(v){
    const html = `
      <div class="sheet glass">
        <div class="vis-sheet-title">${L.confirmDeleteTitle}</div>
        <p class="muted" style="margin-bottom:16px">${L.confirmDeleteMsg}</p>
        <div class="vis-actions">
          <button class="btn auto" id="visCancelDelete">${ctx.t.cancel}</button>
          <button class="btn danger auto" id="visConfirmDelete">${ctx.t.delete}</button>
        </div>
      </div>
    `;
    ctx.openOverlay(html, (overlayEl)=>{
      overlayEl.querySelector('#visCancelDelete').addEventListener('click', ()=>{
        ctx.closeOverlay();
      });
      overlayEl.querySelector('#visConfirmDelete').addEventListener('click', ()=>{
        DB.remove('visitors', v.id);
        ctx.showToast(L.deletedMsg);
        ctx.closeOverlay();
        renderBody();
      });
    });
  }

  function openForm(existing){
    const isEdit = !!existing;
    const v = existing || {nameAr:'', nameEn:'', org:'', purpose:'', visitDate:'', status:'scheduled'};
    const html = `
      <div class="sheet glass">
        <div class="vis-sheet-title">${isEdit ? L.editTitle : L.addTitle}</div>
        <form id="visForm">
          <div class="field">
            <label>${L.nameAr}</label>
            <input type="text" id="visNameAr" value="${escapeAttr(v.nameAr)}" />
          </div>
          <div class="field">
            <label>${L.nameEn}</label>
            <input type="text" id="visNameEn" value="${escapeAttr(v.nameEn)}" />
          </div>
          <div class="field">
            <label>${L.org}</label>
            <input type="text" id="visOrg" value="${escapeAttr(v.org)}" />
          </div>
          <div class="field">
            <label>${L.purpose}</label>
            <input type="text" id="visPurpose" value="${escapeAttr(v.purpose)}" />
          </div>
          <div class="field">
            <label>${L.visitDate}</label>
            <input type="date" id="visDate" value="${escapeAttr(v.visitDate)}" />
          </div>
          <div class="field">
            <label>${L.status}</label>
            <select id="visStatus">
              <option value="scheduled" ${v.status==='scheduled'?'selected':''}>${L.scheduled}</option>
              <option value="completed" ${v.status==='completed'?'selected':''}>${L.completed}</option>
              <option value="cancelled" ${v.status==='cancelled'?'selected':''}>${L.cancelled}</option>
            </select>
          </div>
          <div class="vis-actions">
            <button type="button" class="btn auto" id="visFormCancel">${ctx.t.cancel}</button>
            <button type="submit" class="btn primary auto" id="visFormSave">${ctx.t.save}</button>
          </div>
        </form>
      </div>
    `;
    ctx.openOverlay(html, (overlayEl)=>{
      overlayEl.querySelector('#visFormCancel').addEventListener('click', ()=>{
        ctx.closeOverlay();
      });
      overlayEl.querySelector('#visForm').addEventListener('submit', (e)=>{
        e.preventDefault();
        const nameAr = overlayEl.querySelector('#visNameAr').value.trim();
        const nameEn = overlayEl.querySelector('#visNameEn').value.trim();
        const org = overlayEl.querySelector('#visOrg').value.trim();
        const purpose = overlayEl.querySelector('#visPurpose').value.trim();
        const visitDate = overlayEl.querySelector('#visDate').value;
        const status = overlayEl.querySelector('#visStatus').value;

        if((!nameAr && !nameEn) || !visitDate){
          ctx.showToast(L.requiredMsg);
          return;
        }

        const patch = {nameAr, nameEn, org, purpose, visitDate, status};
        if(isEdit){
          DB.update('visitors', existing.id, patch);
        } else {
          DB.add('visitors', patch);
        }
        ctx.showToast(L.savedMsg);
        ctx.closeOverlay();
        renderBody();
      });
    });
  }

  const fab = document.createElement('button');
  fab.className = 'fab';
  fab.setAttribute('aria-label', L.addTitle);
  fab.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px"><path d="M12 5v14M5 12h14"/></svg>`;
  fab.addEventListener('click', ()=> openForm(null));

  renderBody();
  root.appendChild(screen);
  root.appendChild(fab);
}

// Mount function — called by the shell router.
function renderCompaniesOrgs(root, ctx){
  const lang = ctx.lang;
  const isAr = lang === 'ar';
  const t = ctx.t;

  const L = {
    companiesTab: isAr ? 'الشركات' : 'Companies',
    orgsTab: isAr ? 'الجهات' : 'Organizations',
    crNumber: isAr ? 'السجل التجاري' : 'CR Number',
    sector: isAr ? 'القطاع' : 'Sector',
    licenseExpiry: isAr ? 'انتهاء الترخيص' : 'License Expiry',
    status: isAr ? 'الحالة' : 'Status',
    nameAr: isAr ? 'الاسم (عربي)' : 'Name (Arabic)',
    nameEn: isAr ? 'الاسم (إنجليزي)' : 'Name (English)',
    type: isAr ? 'النوع' : 'Type',
    contactPerson: isAr ? 'جهة الاتصال' : 'Contact Person',
    relationship: isAr ? 'نوع العلاقة' : 'Relationship',
    addCompany: isAr ? 'إضافة شركة' : 'Add Company',
    addOrg: isAr ? 'إضافة جهة' : 'Add Organization',
    editCompany: isAr ? 'تعديل شركة' : 'Edit Company',
    editOrg: isAr ? 'تعديل جهة' : 'Edit Organization',
    companyDetails: isAr ? 'تفاصيل الشركة' : 'Company Details',
    orgDetails: isAr ? 'تفاصيل الجهة' : 'Organization Details',
    confirmDelete: isAr ? 'هل أنت متأكد من الحذف؟ لا يمكن التراجع عن هذا الإجراء.' : 'Are you sure you want to delete? This cannot be undone.',
    savedCompany: isAr ? 'تم حفظ بيانات الشركة' : 'Company saved',
    savedOrg: isAr ? 'تم حفظ بيانات الجهة' : 'Organization saved',
    deletedCompany: isAr ? 'تم حذف الشركة' : 'Company deleted',
    deletedOrg: isAr ? 'تم حذف الجهة' : 'Organization deleted',
    activeStatus: isAr ? 'نشط' : 'Active',
    inactiveStatus: isAr ? 'غير نشط' : 'Inactive',
    hero: isAr ? 'الشركات والجهات' : 'Companies & Organizations',
    heroSub: isAr ? 'إدارة الشركاء التجاريين والجهات الحكومية' : 'Manage business partners and government entities',
    exportExcel: isAr ? 'تصدير Excel' : 'Export Excel',
    exportPDF: isAr ? 'تصدير PDF' : 'Export PDF',
  };

  let state = root.__co_state || { tab: 'companies', q: '' };
  root.__co_state = state;

  function daysLeft(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr), n = new Date();
    d.setHours(0,0,0,0); n.setHours(0,0,0,0);
    return Math.round((d-n)/86400000);
  }
  function expStatus(dateStr){
    const d = daysLeft(dateStr);
    if(d===null) return 'neutral';
    if(d<0) return 'danger';
    if(d<=30) return 'warn';
    return 'ok';
  }
  function statusBadgeText(dateStr){
    const d = daysLeft(dateStr);
    const st = expStatus(dateStr);
    if(st==='neutral') return '—';
    if(st==='danger') return t.expired || (isAr?'منتهي الصلاحية':'Expired');
    return Math.abs(d) + ' ' + (t.daysLeft || (isAr?'يوم متبقٍ':'days left'));
  }

  const ICON_BUILDING = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="10" height="18" rx="1"/><path d="M14 8h6v13H4"/><path d="M7 7h4M7 11h4M7 15h4"/><path d="M17 12h.01M17 16h.01"/></svg>`;
  const ICON_GOV = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 5H3l9-5z"/><path d="M5 10v9M9 10v9M15 10v9M19 10v9"/><path d="M3 21h18"/></svg>`;

  function nameOf(rec){ return isAr ? (rec.nameAr || rec.nameEn) : (rec.nameEn || rec.nameAr); }

  function matches(rec, q){
    if(!q) return true;
    q = q.toLowerCase();
    return Object.values(rec).some(v => typeof v === 'string' && v.toLowerCase().includes(q));
  }

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function companyRow(rec){
    const st = expStatus(rec.licenseExpiry);
    return `
      <button class="card pressable co-row" data-id="${rec.id}" data-kind="company">
        <div class="icon3d" style="--i1:#5B63C4;--i2:#2E3480">${ICON_BUILDING}</div>
        <div class="co-main">
          <div class="co-name">${escapeHtml(nameOf(rec))}</div>
          <div class="co-sub">${escapeHtml(rec.sector||'—')} · ${escapeHtml(rec.crNumber||'—')}</div>
        </div>
        <div class="co-side">
          <span class="badge ${st}">${statusBadgeText(rec.licenseExpiry)}</span>
        </div>
      </button>`;
  }

  function orgRow(rec){
    return `
      <button class="card pressable co-row" data-id="${rec.id}" data-kind="organization">
        <div class="icon3d" style="--i1:#B9872E;--i2:#8A6416">${ICON_GOV}</div>
        <div class="co-main">
          <div class="co-name">${escapeHtml(nameOf(rec))}</div>
          <div class="co-sub">${escapeHtml(rec.type||'—')} · ${escapeHtml(rec.relationship||'—')}</div>
        </div>
        <div class="co-side">
          <span class="badge neutral">${escapeHtml(rec.contactPerson||'—')}</span>
        </div>
      </button>`;
  }

  function listHtml(){
    const coll = state.tab === 'companies' ? 'companies' : 'organizations';
    const all = DB.list(coll).filter(r => matches(r, state.q));
    if(all.length === 0){
      return `<div class="empty">${escapeHtml(t.empty || (isAr?'لا توجد بيانات بعد':'No data yet'))}</div>`;
    }
    const rows = all.map(r => state.tab === 'companies' ? companyRow(r) : orgRow(r)).join('');
    return `<div class="co-list stagger">${rows}</div>`;
  }

  function renderList(){
    const listEl = root.querySelector('.co-list-wrap');
    if(listEl) listEl.innerHTML = listHtml();
    bindRowEvents();

  function bindRowEvents(){
    root.querySelectorAll('.co-row').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');

        openDetail(kind, id);
      });
    });
  }

    const rec = DB.get(coll, id);
    if(!rec) return;

    let html;
    if(kind === 'company'){
      const st = expStatus(rec.licenseExpiry);
      html = `
        <div class="glass sheet" style="padding:22px 20px">
          <h2 class="h2">${escapeHtml(L.companyDetails)}</h2>
          <div class="co-detail-grid">
            <div class="co-detail-item"><span class="k">${escapeHtml(L.nameAr)}</span><span class="v">${escapeHtml(rec.nameAr||'—')}</span></div>
            <div class="co-detail-item"><span class="k">${escapeHtml(L.nameEn)}</span><span class="v">${escapeHtml(rec.nameEn||'—')}</span></div>

            <div class="co-detail-item"><span class="k">${escapeHtml(L.licenseExpiry)}</span><span class="v"><span class="badge ${st}">${escapeHtml(rec.licenseExpiry||'—')} · ${statusBadgeText(rec.licenseExpiry)}</span></span></div>
            <div class="co-detail-item"><span class="k">${escapeHtml(L.status)}</span><span class="v">${rec.status==='active' ? escapeHtml(L.activeStatus) : escapeHtml(L.inactiveStatus)}</span></div>
          </div>
          <div class="co-actions">
            <button class="btn ghost" data-act="edit">${escapeHtml(t.edit || (isAr?'تعديل':'Edit'))}</button>
            <button class="btn danger" data-act="delete">${escapeHtml(t.delete || (isAr?'حذف':'Delete'))}</button>
          </div>
        </div>`;
    } else {
      html = `

          </div>
        </div>`;
    }

      overlayEl.querySelector('[data-act="edit"]').addEventListener('click', () => {
        ctx.closeOverlay();
        openForm(kind, rec);
      });
      overlayEl.querySelector('[data-act="delete"]').addEventListener('click', () => {

      });

  }

  function confirmDelete(kind, rec){
    const html = `
      <div class="glass sheet" style="padding:22px 20px">
        <div class="co-confirm">
          <h2 class="h2">${escapeHtml(t.delete || (isAr?'حذف':'Delete'))}</h2>
          <p class="muted" style="margin-top:10px">${escapeHtml(L.confirmDelete)}</p>
        </div>
        <div class="co-actions">
          <button class="btn ghost" data-act="cancel">${escapeHtml(t.cancel || (isAr?'إلغاء':'Cancel'))}</button>
          <button class="btn danger" data-act="confirm">${escapeHtml(t.delete || (isAr?'حذف':'Delete'))}</button>
        </div>
      </div>`;
    ctx.openOverlay(html, (overlayEl) => {
      overlayEl.querySelector('[data-act="cancel"]').addEventListener('click', () => {
        ctx.closeOverlay();
        openDetail(kind, rec.id);

      });
    });
  }

  function openForm(kind, rec){
    const isEdit = !!rec;

    let fieldsHtml, title;

    if(kind === 'company'){
      title = isEdit ? L.editCompany : L.addCompany;
      fieldsHtml = `
        <div class="field"><label>${escapeHtml(L.nameAr)}</label><input type="text" name="nameAr" value="${escapeHtml(r.nameAr||'')}"></div>

        <div class="field"><label>${escapeHtml(L.sector)}</label><input type="text" name="sector" value="${escapeHtml(r.sector||'')}"></div>

          <select name="status">

        <div class="field"><label>${escapeHtml(L.type)}</label><input type="text" name="type" value="${escapeHtml(r.type||'')}"></div>
        <div class="field"><label>${escapeHtml(L.contactPerson)}</label><input type="text" name="contactPerson" value="${escapeHtml(r.contactPerson||'')}"></div>
        <div class="field"><label>${escapeHtml(L.relationship)}</label><input type="text" name="relationship" value="${escapeHtml(r.relationship||'')}"></div>`;
    }

    const html = `
      <div class="glass sheet" style="padding:22px 20px">
