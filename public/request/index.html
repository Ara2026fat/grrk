<html lang="ar" dir="rtl" data-theme="day" data-accent="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>طلبات الخدمات — GRRK</title>

<style>
/* ============================================================
   GRRK — نظام اللمعان البصري (Luster Design System)
   Adapted from "سرّ اللمعان" (أُفق) — CSS-only glass, NO backdrop-filter.
   Augmented with: 3D icon shading, shimmer sweep, elevation depth,
   screen-transition choreography. Single-file app, ar(RTL)/en(LTR).
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

:root{
  --display:'Space Grotesk','Tajawal',sans-serif;
  --body:'Tajawal','Space Grotesk',sans-serif;
  --radius-lg:26px; --radius-md:16px; --radius-sm:12px;
  --dur-fast:.12s; --dur-base:.16s; --dur-slow:.26s; --dur-scene:.42s;
  --ease:cubic-bezier(.22,.9,.26,1);
}

[data-theme="night"]{
  color-scheme:dark;
  --void:#0B0D14; --void2:#0E1017; --lift1:#1A1F33; --lift2:#151A28;
  --ink:#E7E9F4; --ink-soft:#9195AB; --ink-faint:#5B6078;
  --glass:linear-gradient(158deg, rgba(255,255,255,.065), rgba(255,255,255,.02));
  --glass-line:rgba(255,255,255,.09);
  --glass-shadow:0 20px 50px rgba(0,0,0,.48), 0 2px 0 rgba(255,255,255,.03) inset;
  --edge:rgba(255,255,255,.22);
  --flat:rgba(255,255,255,.035); --flat-line:rgba(255,255,255,.065);
  --line:rgba(255,255,255,.08); --solid:#1B2030;
  --glow:#4F72E0; --glow-tint:rgba(79,114,224,.18);
  --gold:#F2C879; --gold2:#C9932E;
  --ok:#52E3A6; --warn:#FFC168; --danger:#FF6B81;
  --btn-bg:rgba(79,114,224,.2); --btn-line:rgba(79,114,224,.4); --btn-ink:#C3D1FA;
  --shimmer:rgba(255,255,255,.5);
  --app-bg:radial-gradient(1100px 560px at 50% -40px, rgba(79,114,224,.34), transparent 72%), var(--void);
  --icon-hl:rgba(255,255,255,.5); /* glossy highlight baked into every icon3d tile */
}
[data-theme="day"]{
  color-scheme:light;
  /* The page background sits a visible shade below pure white so the
     glass cards (--lift1, pure white) and icon tiles actually read as
     lifted/frosted surfaces instead of blending into the page. */
  --void:#EAE7DD; --void2:#E2DDCF; --lift1:#FFFFFF; --lift2:#FBFAF5;
  --ink:#1C1E2A; --ink-soft:#5B5F72; --ink-faint:#9497A6;
  --glass:linear-gradient(158deg, rgba(255,255,255,.94), rgba(255,255,255,.6));
  --glass-line:rgba(20,22,40,.1);
  --glass-shadow:0 20px 42px rgba(40,40,70,.15), 0 2px 0 rgba(255,255,255,.75) inset;
  --edge:rgba(255,255,255,.95);
  --flat:rgba(0,0,0,.035); --flat-line:rgba(0,0,0,.08);
  --line:rgba(0,0,0,.08); --solid:#FFFFFF;
  --glow:#2541A8; --glow-tint:rgba(37,65,168,.16);
  --gold:#B9872E; --gold2:#8A6416;
  --ok:#188A5E; --warn:#A06A00; --danger:#C83C53;
  --btn-bg:rgba(37,65,168,.16); --btn-line:rgba(37,65,168,.4); --btn-ink:#1C2E7A;
  --shimmer:rgba(255,255,255,.85);
  --app-bg:radial-gradient(900px 520px at 50% -90px, rgba(37,65,168,.34), transparent 68%), var(--void);
  /* A brighter gloss highlight than the earlier near-zero value — enough
     to give icon tiles a real glassy sheen without washing the accent
     color out against the page. */
  --icon-hl:rgba(255,255,255,.32);
}

/* ---------- Accent color variants (layered on top of night/day) ---------- */
/* forest — deep, rich green */
:root[data-theme="night"][data-accent="forest"]{
  --glow:#1F9E63; --glow-tint:rgba(31,158,99,.18);
  --btn-bg:rgba(31,158,99,.2); --btn-line:rgba(31,158,99,.4); --btn-ink:#B7F0D3;
  --app-bg:radial-gradient(1100px 560px at 50% -40px, rgba(31,158,99,.32), transparent 72%), var(--void);
}
:root[data-theme="day"][data-accent="forest"]{
  --glow:#146B45; --glow-tint:rgba(20,107,69,.16);
  --btn-bg:rgba(20,107,69,.17); --btn-line:rgba(20,107,69,.38); --btn-ink:#0E4A30;
  --app-bg:radial-gradient(900px 520px at 50% -90px, rgba(20,107,69,.3), transparent 68%), var(--void);
}
/* graphite — steel gray, understated and technical */
:root[data-theme="night"][data-accent="graphite"]{
  --glow:#8792A6; --glow-tint:rgba(135,146,166,.18);
  --btn-bg:rgba(135,146,166,.2); --btn-line:rgba(135,146,166,.4); --btn-ink:#D7DBE4;
  --app-bg:radial-gradient(1100px 560px at 50% -40px, rgba(135,146,166,.3), transparent 72%), var(--void);
}
:root[data-theme="day"][data-accent="graphite"]{
  --glow:#444E5E; --glow-tint:rgba(68,78,94,.16);
  --btn-bg:rgba(68,78,94,.16); --btn-line:rgba(68,78,94,.36); --btn-ink:#2B3240;
  --app-bg:radial-gradient(900px 520px at 50% -90px, rgba(68,78,94,.3), transparent 68%), var(--void);
}
/* amber — warm, glossy honey-gold accent */
:root[data-theme="night"][data-accent="amber"]{
  --glow:#F0B93C; --glow-tint:rgba(240,185,60,.2);
  --btn-bg:rgba(240,185,60,.22); --btn-line:rgba(240,185,60,.44); --btn-ink:#FBE4A3;
  --app-bg:radial-gradient(1100px 560px at 50% -40px, rgba(240,185,60,.36), transparent 72%), var(--void);
}
:root[data-theme="day"][data-accent="amber"]{
  --glow:#9C6B12; --glow-tint:rgba(156,107,18,.18);
  --btn-bg:rgba(156,107,18,.18); --btn-line:rgba(156,107,18,.4); --btn-ink:#5C3E08;
  --app-bg:radial-gradient(900px 520px at 50% -90px, rgba(156,107,18,.34), transparent 68%), var(--void);
}

*{box-sizing:border-box; margin:0}
html,body{height:100%}
/* Prevent the browser from silently shifting scroll position to "compensate"
   for layout reflow above the fold — this happens when the web fonts finish
   loading just after first paint (FOUT) and resize the text, which otherwise
   made the page look like it opened scrolled past the hero straight to
   whatever was next. */
html{ overflow-anchor:none; }
body{
  background:var(--app-bg); background-attachment:fixed; color:var(--ink); font-family:var(--body);
  line-height:1.6; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none; min-height:100vh;
  transition:background var(--dur-slow) var(--ease), color var(--dur-slow) var(--ease);
}
/* background-attachment:fixed pins the accent-colored glow to the viewport
   (not the document), so it stays visible behind every screen regardless of
   how tall the content is or how far the person has scrolled — otherwise
   the gradient (anchored near the top of the document) scrolls out of view
   on any screen taller than one viewport and the accent reads as "gone". */
[dir="rtl"] body{font-family:'Tajawal','Space Grotesk',sans-serif}
button, input, textarea, select{font-family:inherit}
.font-variant-tabular, .num{font-variant-numeric:tabular-nums}

/* ---------- Elevation system: exactly ONE .glass hero per screen ---------- */
.glass{
  background:var(--glass); border:1px solid var(--glass-line);
  border-radius:var(--radius-lg); box-shadow:var(--glass-shadow);
  padding:22px 20px; position:relative; overflow:hidden;
}
.glass::before{
  /* accent-tinted hairline so the chosen accent color reads clearly on the
     hero card itself, not only in the faint ambient page glow behind it */
  content:''; position:absolute; inset:0 14% auto; height:1.5px; border-radius:1px;
  background:linear-gradient(90deg,transparent,var(--glow),transparent);
  opacity:.55;
}
/* The old full-card shimmer sweep (a slow light sweeping across the ENTIRE
   hero card) read as a scanner/printhead pass over the whole screen rather
   than a glossy accent — removed from .glass. The shine now lives only on
   the small app/section icon tiles (.icon3d), see below, where a quick
   glossy flash actually looks premium instead of a full-screen gimmick. */

.card, .flat{
  background:var(--flat); border:1px solid var(--flat-line);
  border-radius:var(--radius-md); padding:16px 18px;
  transition:border-color var(--dur-base) var(--ease), background var(--dur-base) var(--ease), transform var(--dur-fast) var(--ease);
}
.card.pressable:active{ transform:scale(.985) }
.divider{ height:1px; background:var(--line); border:0; margin:10px 0 }

/* ---------- Typography ---------- */
h1,.h1{font-family:var(--display); font-weight:700; font-size:clamp(22px,5vw,30px); letter-spacing:-.3px}
h2,.h2{font-family:var(--display); font-weight:600; font-size:19px}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint)}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint); font-size:13px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--btn-bg); border:1px solid var(--btn-line); color:var(--btn-ink);
  padding:13px 18px; border-radius:15px; font-family:var(--display); font-size:15px; font-weight:500;
  transition:background var(--dur-base) ease, transform var(--dur-fast) ease, box-shadow var(--dur-base) ease;
  cursor:pointer; width:100%;
}
.btn:hover{ filter:brightness(1.12) }
.btn:active{ transform:scale(.988) }
.btn.block{ width:100% } .btn.auto{ width:auto }
.btn.primary{ background:linear-gradient(160deg, var(--glow), var(--gold2)); border-color:transparent; color:#fff; box-shadow:0 10px 24px -8px var(--glow-tint) }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); font-size:14px; padding:10px 14px; font-family:var(--body) }
.btn.sm{ padding:9px 14px; font-size:13px; width:auto; border-radius:12px }
.btn.danger{ background:rgba(255,107,129,.14); border-color:rgba(255,107,129,.34); color:var(--danger) }
.fab{
  /* A normal in-flow element (last child, right after the row list) —
     NOT floating/fixed — so it can never overlap a row's text/badge.
     margin-inline-start:auto pushes it to the trailing edge, same spot
     it used to float over; margin-top gives it breathing room from the
     last row. */
  display:grid; place-items:center;
  margin-block:22px 4px; margin-inline-start:auto; margin-inline-end:4px;
  width:58px; height:58px; border-radius:50%;
  background:linear-gradient(160deg, var(--glow), var(--gold2)); color:#fff; border:none;
  box-shadow:0 14px 30px -8px var(--glow-tint), 0 0 0 1px rgba(255,255,255,.14) inset;
  cursor:pointer; z-index:1; transition:transform var(--dur-fast) var(--ease);
}
.fab:active{ transform:scale(.92) }

/* ---------- Choice / list rows ---------- */
.row{ display:flex; align-items:center; gap:12px; padding:13px 2px; border-bottom:1px dashed var(--line) }
.row:last-child{ border-bottom:0 }
.choice{
  display:block; width:100%; text-align:start; background:var(--flat); border:1px solid var(--flat-line);
  border-radius:15px; padding:15px 16px; margin-bottom:9px; cursor:pointer;
  transition:border-color var(--dur-base) ease, background var(--dur-base) ease;
}
.choice.active{ background:var(--glass); border-color:var(--glow) }

/* ---------- Badges / status ---------- */
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 11px; border-radius:99px; }
.badge.ok{ background:rgba(82,227,166,.14); color:var(--ok) }
.badge.warn{ background:rgba(255,193,104,.16); color:var(--warn) }
.badge.danger{ background:rgba(255,107,129,.14); color:var(--danger) }
.badge.neutral{ background:var(--flat); color:var(--ink-soft) }

/* ---------- 3D glow icon tiles ---------- */
.icon3d{
  width:52px; height:52px; border-radius:17px; display:grid; place-items:center; flex:none;
  background:radial-gradient(120% 120% at 25% 20%, var(--icon-hl), transparent 55%), linear-gradient(155deg, var(--i1,var(--glow)), var(--i2,var(--gold2)));
  box-shadow:0 14px 26px -8px var(--i1,var(--glow)), 0 2px 6px -2px var(--i1,var(--glow)), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 6px rgba(0,0,0,.2);
  color:#fff; position:relative; overflow:hidden;
}
.icon3d.sm{ width:36px; height:36px; border-radius:12px }
.icon3d svg{ width:24px; height:24px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)) }
.icon3d.sm svg{ width:19px; height:19px }
/* Glossy shine confined to the icon tile itself (not the whole screen),
   and — instead of every icon shimmering together — only ONE icon on the
   page lights up at a time, in a slow relay from icon to icon. The relay
   itself is driven by shell.js toggling .chase-on on one .icon3d at a
   time; this is just the per-icon sweep that plays while that class is on. */
.icon3d::after{
  content:''; position:absolute; top:0; bottom:0; width:40%; left:-60%;
  background:linear-gradient(100deg, transparent, var(--shimmer), transparent);
  opacity:0; pointer-events:none;
}
.icon3d.chase-on::after{ opacity:.22; animation:icon-sweep 1.8s ease-in-out 1 both; }
@keyframes icon-sweep{ 0%{left:-60%} 100%{left:120%} }

/* ---------- KPI stat tile ---------- */
.stat{ position:relative; padding:18px 16px; border-radius:18px; background:var(--flat); border:1px solid var(--flat-line); overflow:hidden; box-shadow:0 10px 22px -16px var(--glow-tint) }
.stat .val{ font-family:var(--display); font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--glow) }
.stat .lbl{ font-size:12.5px; color:var(--ink-soft); margin-top:2px }
.stat .trend{ position:absolute; inset-inline-end:14px; top:16px; font-size:12px; font-weight:700 }
.stat .trend.up{ color:var(--ok) } .stat .trend.down{ color:var(--danger) }

/* ---------- Progress / expiry meter ---------- */
.meter{ position:relative; height:9px; border-radius:99px; background:var(--flat); overflow:hidden }
.meter i{ position:absolute; inset-inline-start:0; top:0; bottom:0; border-radius:99px; transition:width .9s var(--ease) }

/* ---------- App shell: nav ---------- */
.app-shell{ max-width:980px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 18px 14px; position:sticky; top:0; z-index:30; background:linear-gradient(var(--void) 72%, transparent); }
.brand{ display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:17px }
.brand-home{
  display:flex; align-items:center; gap:10px; background:none; border:none; padding:2px; margin:0;
  color:inherit; font:inherit; cursor:pointer; border-radius:12px;
  transition:transform var(--dur-fast) var(--ease), opacity var(--dur-base) ease;
}
.brand-home:active{ transform:scale(.96) }
.brand-home:disabled{ cursor:default }
/* Back button: a solid, unmistakable chip (not a faint ghost icon) — the
   whole point is that it must be impossible to miss on a deep screen. */
.back-btn{
  display:grid; place-items:center; width:34px; height:34px; border-radius:11px; flex:none;
  background:var(--flat); border:1px solid var(--flat-line); color:var(--ink);
  cursor:pointer; transition:background var(--dur-base) ease, transform var(--dur-fast) var(--ease);
}
.back-btn svg{ width:19px; height:19px }
.back-btn:active{ transform:scale(.92); background:var(--glass) }
[dir="rtl"] .back-btn svg{ transform:scaleX(-1) } /* chevron points toward reading-start in RTL */
.main{ flex:1; padding:6px 16px 108px; }
.navbar{
  position:fixed; inset-inline:0; bottom:0; z-index:35;
  display:grid; grid-template-columns:repeat(3, 1fr); gap:2px 0;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(158deg, var(--lift1), var(--lift2)); border-top:1px solid var(--glass-line);
  box-shadow:0 -14px 40px rgba(0,0,0,.28);
}
.navbtn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:5px 2px; border-radius:10px; transition:color var(--dur-base) ease; min-width:0 }
.navbtn svg{ width:21px; height:21px }
.navbtn.active{ color:var(--glow) }
.navbtn.active .icon3d{ box-shadow:0 10px 20px -6px var(--glow-tint), inset 0 1px 0 rgba(255,255,255,.4) }
.navbtn span{ font-size:9.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

/* ---------- Screen transitions ---------- */
.screen{ animation:scene-in var(--dur-scene) var(--ease) both }
@keyframes scene-in{ from{ opacity:0; transform:translateY(10px) scale(.985) } to{ opacity:1; transform:none } }
.screen.leaving{ animation:scene-out var(--dur-base) ease both }
@keyframes scene-out{ to{ opacity:0; transform:translateY(-6px) scale(.98) } }
.stagger > *{ animation:rise .4s var(--ease) both }
.stagger > *:nth-child(1){animation-delay:.02s} .stagger > *:nth-child(2){animation-delay:.06s}
.stagger > *:nth-child(3){animation-delay:.1s} .stagger > *:nth-child(4){animation-delay:.14s}
.stagger > *:nth-child(5){animation-delay:.18s} .stagger > *:nth-child(6){animation-delay:.22s}
@keyframes rise{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

/* ---------- Modal / sheet ---------- */
.overlay{ position:fixed; inset:0; background:rgba(5,6,12,.55); display:grid; place-items:center; padding:16px; z-index:200; animation:fade .2s ease }
@keyframes fade{ from{opacity:0} to{opacity:1} }
.sheet{
  max-width:460px; width:100%; max-height:88vh; animation:sheet-in .3s var(--ease) both;
  /* overflow-x:hidden (not just overflow:auto) so .glass::after's animated shimmer sweep
     — which travels past 100% width — can never register as real scrollable content and
     push the sheet into an unintended horizontal scroll range */
  overflow-x:hidden; overflow-y:auto;
  background:linear-gradient(158deg, var(--lift1), var(--lift2));
}
.sheet::before, .sheet::after{ opacity:.5 }
@keyframes sheet-in{ from{ opacity:0; transform:translateY(24px) scale(.97) } to{ opacity:1; transform:none } }

.field{ margin-bottom:14px }
.field label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px }
.field input, .field select, .field textarea{
  width:100%; background:var(--flat); border:1px solid var(--flat-line); border-radius:12px;
  padding:12px 14px; color:var(--ink); font-size:15px; outline:none;
  transition:border-color var(--dur-base) ease, box-shadow var(--dur-base) ease;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--glow); box-shadow:0 0 0 3px var(--glow-tint) }

.empty{ text-align:center; padding:50px 20px; color:var(--ink-faint) }
.toast{ position:fixed; inset-inline:16px; bottom:calc(92px + env(safe-area-inset-bottom)); max-width:420px; margin:auto; background:var(--solid); color:var(--ink); border:1px solid var(--glass-line); padding:13px 18px; border-radius:14px; font-size:14px; z-index:300; animation:sheet-in .25s var(--ease) }

/* ---------- PWA install banner ---------- */
.install-banner{ position:fixed; inset-inline:14px; bottom:calc(92px + env(safe-area-inset-bottom)); max-width:460px; margin:auto; display:flex; align-items:center; gap:12px; background:var(--solid); color:var(--ink); border:1px solid var(--glass-line); padding:13px 14px; border-radius:16px; box-shadow:0 14px 30px -10px rgba(0,0,0,.28); z-index:260; animation:sheet-in .25s var(--ease) }
.install-banner .ib-icon{ flex:0 0 auto; width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; background:var(--btn-bg); color:var(--glow) }
.install-banner .ib-icon svg{ width:20px; height:20px }
.install-banner .ib-text{ flex:1; min-width:0 }
.install-banner .ib-title{ font-size:13.5px; font-weight:700; color:var(--ink) }
.install-banner .ib-sub{ font-size:12px; color:var(--ink-faint); margin-top:2px }
.install-banner .ib-actions{ display:flex; align-items:center; gap:6px; flex:0 0 auto }
.install-banner .ib-install{ background:var(--glow); color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer }
.install-banner .ib-close{ background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:6px; display:flex }
.install-banner .ib-close svg{ width:16px; height:16px }

/* ---------- "More" hub sheet ---------- */
.more-handle{ width:40px; height:4px; border-radius:99px; background:var(--flat-line); margin:0 auto 16px }
.more-sheet{ max-height:82vh; overflow-y:auto; overscroll-behavior:contain }
.more-group{ margin-bottom:20px }
.more-group:last-child{ margin-bottom:4px }
.more-group-label{ font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:10px; padding-inline-start:2px }
.more-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px }
.more-tile{
  display:flex; align-items:center; gap:12px; text-align:start; cursor:pointer;
  background:var(--flat); border:1px solid var(--flat-line); border-radius:var(--radius-md);
  padding:13px 14px; color:inherit; width:100%; min-width:0; /* let grid track shrink below content's
  intrinsic min size instead of overflowing the sheet (the RTL cut-off-on-the-left bug) */
  transition:border-color var(--dur-base) ease, background var(--dur-base) ease, transform var(--dur-fast) ease;
  animation:rise .36s var(--ease) both;
}
.more-tile:active{ transform:scale(.97) }

function srToday(){ return new Date().toLocaleDateString('ar-SA-u-ca-gregory'); }

function srOpenPrintDoc(title, bodyHtml){
  const html = '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + srEsc(title) + '</title><style>' + SR_PRINT_CSS + '</style></head><body><div class="bar"><button onclick="window.print()">طباعة / حفظ PDF</button> <button onclick="srBack()" style="margin-inline-start:10px;background:#dbe4ff">↩ رجوع للتطبيق</button></div><script>function srBack(){ try{ window.close(); }catch(e){} setTimeout(function(){ if(window.opener){ try{ window.opener.focus(); }catch(e){} } else { history.back(); } },150); }<\/script><div class="doc">' + bodyHtml + '</div></body></html>';
  const w = window.open('', '_blank');
  if(w){ w.document.open(); w.document.write(html); w.document.close(); return true; }
  const old = document.getElementById('sr-print'); if(old) old.remove();
  const el = document.createElement('div'); el.id = 'sr-print'; el.innerHTML = bodyHtml; document.body.appendChild(el);
  window.addEventListener('afterprint', ()=>{ const e = document.getElementById('sr-print'); if(e) e.remove(); }, { once:true });
  window.print();
  return true;
}

// "طلب دخول زوّار" — same layout as the official Word form (15 visitor rows, 72-hour rule).
// opts.stampSrc: image to print as the department stamp (admin approved copy only); omit for the user's copy.
function srPrintVisitForm(data, opts){
  opts = opts || {};
  const d = data || {};
  const vs = Array.isArray(d.visitors) ? d.visitors : [];
  const rows = [];
  for(let i=0;i<15;i++){
    const v = vs[i] || {};
    rows.push('<tr><td class="n">' + (i+1) + '</td><td>' + srEsc(v.name||'') + '</td><td>' + srEsc(v.nationality||'') + '</td><td>' + srEsc(v.idNumber||'') + '</td></tr>');
  }
  const meta = [];
  if(opts.requestId) meta.push('رقم الطلب: ' + srEsc(opts.requestId));
  meta.push(srToday());
  if(opts.statusLine) meta.push(srEsc(opts.statusLine));

    '<div class="hd"><img src="' + srAbs('../brand/logo-header.png') + '" alt=""><div class="ttl">طلب دخول<br>زوّار</div></div>' +
    '<div class="two">' +

        '<tr><td class="l">اسم الجهة</td><td>' + srEsc(d.hostEntityName||'') + '</td></tr>' +
        '<tr><td class="l">الإدارة المستضيفة</td><td>' + srEsc(d.hostDepartment||'') + '</td></tr>' +
        '<tr><td class="l">ممثل الإدارة</td><td>' + srEsc(d.hostRepresentative||'') + '</td></tr>' +
        '<tr><td class="l">رقم الجوال</td><td>' + srEsc(d.hostPhone||'') + '</td></tr>' +
        '<tr><td class="l">البريد الالكتروني</td><td>' + srEsc(d.hostEmail||'') + '</td></tr></table>' +
      '<table><tr><th colspan="2">تفاصيل الزيارة</th></tr>' +
        '<tr><td class="l">تاريخ بداية الزيارة</td><td>' + srEsc(d.visitStart||'') + '</td></tr>' +
        '<tr><td class="l">تاريخ نهاية الزيارة</td><td>' + srEsc(d.visitEnd||'') + '</td></tr>' +
        '<tr><td class="l">الغرض من الزيارة</td><td style="height:86px">' + srEsc(d.visitPurpose||'') + '</td></tr></table>' +
    '</div>' +
    '<table class="vt"><tr><th colspan="4" class="big">بيانات الزوار</th></tr>' +
      '<tr><th style="width:8%">عدد</th><th>الاسم</th><th>الجنسية</th><th>رقم الهوية / الإقامة / الجواز</th></tr>' + rows.join('') + '</table>' +
    '<div class="rules"><b>تعليمات يجب التقيد بها:</b><ol>' +
      '<li>يجب مغادرة المدينة عند انتهاء التصريح.</li>' +
      '<li>إبراز التصريح لرجال الأمن في بوابات الهيئة الملكية.</li>' +
      '<li>التقيد بالأنظمة المرورية.</li>' +
      '<li>يُشترط ألا تتجاوز مدة الزيارة (72) ساعة من بداية تاريخ التصريح.</li>' +
      '<li>في حالة التمديد يتم رفع طلب آخر لإدارة الأمن الصناعي والسلامة.</li>' +
      '<li>التقيّد بالزي الرسمي اثناء الزيارة والدخول للمقرات الرسمية.</li></ol></div>' +
    '<div class="note">' + meta.join(' — ') + '</div>' +
    (opts.stampSrc ? '<div class="stampbox"><img src="' + opts.stampSrc + '" alt=""></div>' : '');
  return srOpenPrintDoc('طلب دخول زوّار', body);

// GRRK — Public request page for representatives/employees (no admin data).
// Trimmed copy of modules/service-requests.js: only identify/register/
// formtype/wizard/done. No landing choice, no inbox, no connection-config
// screen — this page has exactly one job, and starts there immediately.
// SR_ICONS and SR_FORM_DEFS are NOT duplicated here — build.sh extracts
// them straight from modules/service-requests.js (the single source of
// truth for form fields), so the two pages can never drift apart.

// Same backend as the admin app (grrk-app), reached over plain fetch().
const SR_CFG = {
  url: 'https://script.google.com/macros/s/AKfycbyHSZZ3ZaNP9PuLayeQinDHhtS9PxfhnHD-6_XKka-rNqT0nVw8OSFnxFnEIJRYMQCsaQ/exec',
  token: 'grrk-vw0m8nmgaj'
};
const SR_SESSION_KEY = 'grrk_rep_session_v1';
function srLoadSession(){ try{ return JSON.parse(localStorage.getItem(SR_SESSION_KEY)) || null; }catch(e){ return null; } }
function srSaveSession(s){ try{ localStorage.setItem(SR_SESSION_KEY, JSON.stringify(s)); }catch(e){} }
function srClearSession(){ try{ localStorage.removeItem(SR_SESSION_KEY); }catch(e){} }

async function srApiPost(url, body){
  const res = await fetch(url, { method:'POST', body: JSON.stringify(body) });
  return res.json();
}
async function srApiGet(url, params){
  const qs = Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k]==null?'':params[k])).join('&');
  const res = await fetch(url + (url.includes('?') ? '&' : '?') + qs);
  return res.json();
}


function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2600);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iconCheck(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`; }
function iconTrash(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>`; }

// ---- Install prompt (Android: native prompt; iPhone: Share > Add to Home Screen) ----
(function initInstall(){
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  if(standalone) return;
  let dismissed = false; try{ dismissed = localStorage.getItem('grrk_req_inst_dismissed') === '1'; }catch(e){}
  if(dismissed) return;
  function bar(html, onGo){
    if(document.getElementById('inst-bar')) return;
    const el = document.createElement('div'); el.id = 'inst-bar'; el.className = 'inst-bar';
    el.innerHTML = '<img src="icon-192.png" alt=""><div class="t">' + html + '</div>' + (onGo ? '<button class="go" type="button">تثبيت</button>' : '') + '<button class="x" type="button" aria-label="إغلاق">✕</button>';
    document.body.appendChild(el);
    el.querySelector('.x').addEventListener('click', ()=>{ el.remove(); try{ localStorage.setItem('grrk_req_inst_dismissed','1'); }catch(e){} });
    if(onGo) el.querySelector('.go').addEventListener('click', ()=>{ onGo(); el.remove(); });
  }
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault(); deferred = e;
    bar('ثبّت تطبيق <b>طلبات الخدمات</b> على جوالك للوصول السريع', ()=>{ deferred.prompt(); });
  });
  const ua = navigator.userAgent || '';
  if(/iPhone|iPad|iPod/.test(ua) && !/CriOS|FxiOS/.test(ua)){
    setTimeout(()=> bar('لتثبيت التطبيق: اضغط زر <b>المشاركة</b> ثم <b>إضافة إلى الشاشة الرئيسية</b>'), 1500);
  }
})();

function startApp(){
  const root = document.getElementById('main');
  const cfg = SR_CFG;

  let session = srLoadSession();
  let view = 'formtype';
  let pendingForm = null;   // identify | register | formtype | wizard | done
  let wizardForm = null;
  let wizardStep = 0;
  let wizardData = {};
  let lastRequestId = '';
  let lastSubmitted = null;

  const CITY = 'مدينة رأس الخير للصناعات التعدينية';
  const backBtn = document.getElementById('backBtn');
  const SR_FORMS_BASE = 'forms/';
  function paintViewer(){
    const def = SR_FORM_DEFS[wizardForm];
    root.innerHTML = `
      <div class="glass" style="margin-bottom:14px">
        <div class="eyebrow">${esc(def.labelAr)}</div>
        <p class="muted" style="margin-top:8px">للعرض والطباعة فقط — النموذج الأصلي، يُعبّأ ورقيًا.</p>
        <button class="btn primary block" id="sr-v-print" style="margin-top:12px">طباعة / حفظ PDF</button>
        <a class="btn block" id="sr-v-pdf" href="${SR_FORMS_BASE}${def.pdfFile}" target="_blank" rel="noopener" style="margin-top:8px;display:block;text-align:center;text-decoration:none">فتح الملف الأصلي (PDF)</a>
      </div>
      ${def.viewFiles.map(f=>`<img class="sr-viewer-img" src="${SR_FORMS_BASE}${f}" alt="">`).join('')}
    `;
    root.querySelector('#sr-v-print').addEventListener('click', ()=>{
      srOpenPrintDoc(def.labelAr, def.viewFiles.map(f=>`<img class="pg" src="${srAbs(SR_FORMS_BASE+f)}" alt="">`).join(''));
    });
  }

  function startWizard(key){
    wizardForm = key; wizardStep = 0; wizardData = {};
    if(SR_FORM_DEFS[key].steps.some(st=>st.fields.some(f=>f.key==='entityType'))){
      wizardData.entityType = session && session.type==='employee' ? CITY : 'شركة / مؤسسة';
    }
    view = 'wizard';
  }
  function afterIdentify(){
    if(pendingForm){ const k = pendingForm; pendingForm = null; startWizard(k); }
    else view = 'formtype';
    paint();
  }
  function goBack(){
    if(view === 'identify'){ pendingForm=null; view='formtype'; }
    else if(view === 'register' || view === 'employee'){ view='identify'; }
    else if(view === 'wizard'){ view='formtype'; }
    else if(view === 'done' || view === 'viewer'){ view='formtype'; }
    else return;
    paint();
  }
  if(backBtn) backBtn.addEventListener('click', goBack);
  function paint(){
    if(backBtn) backBtn.hidden = (view === 'formtype');
    root.oninput = null; root.onchange = null;
    window.scrollTo(0,0);
    if(view === 'identify') return paintIdentify();
    if(view === 'register') return paintRegister();
    if(view === 'employee') return paintEmployee();
    if(view === 'viewer') return paintViewer();
    if(view === 'formtype') return paintFormType();
    if(view === 'wizard') return paintWizard();
    if(view === 'done') return paintDone();
  }

  function paintEmployee(){
    root.innerHTML = `
      <div class="glass" style="margin-bottom:16px">
        <div class="eyebrow">موظف مدينة رأس الخير</div>
        <p class="muted" style="margin-top:8px">بدون تسجيل مندوب — بياناتك فقط ليصلك إشعار الطلب.</p>
      </div>
      <div class="card">
        <div class="field"><label>الاسم</label><input type="text" id="sr-e-name"></div>
        <div class="field"><label>الرقم الوظيفي</label><input type="text" id="sr-e-no" dir="ltr"></div>
        <div class="field"><label>رقم الجوال</label><input type="tel" id="sr-e-phone" dir="ltr"></div>
        <div class="field"><label>البريد الإلكتروني (لإشعارك بالاعتماد)</label><input type="email" id="sr-e-email" dir="ltr"></div>
        <button class="btn primary block" id="sr-e-go">متابعة</button>
      </div>
    `;
    root.querySelector('#sr-e-go').addEventListener('click', ()=>{
      const name = root.querySelector('#sr-e-name').value.trim();
      const no = root.querySelector('#sr-e-no').value.trim();
      const phone = root.querySelector('#sr-e-phone').value.trim();
      const email = root.querySelector('#sr-e-email').value.trim();
      if(!name || !no || !phone){ showToast('الاسم والرقم الوظيفي والجوال مطلوبة'); return; }
      session = { type:'employee', name, company:CITY, employee_no:no, phone, email };
      srSaveSession(session);
      afterIdentify();
    });
  }

  function paintIdentify(){
    root.innerHTML = `
      <div class="glass" style="margin-bottom:16px">
        <div class="eyebrow">${pendingForm ? esc(SR_FORM_DEFS[pendingForm].labelAr) : 'تقديم طلب'}</div>
        <p class="muted" style="margin-top:8px">من أنت؟</p>
        <button class="btn primary block" id="sr-id-emp" style="margin-top:14px">أنا موظف في مدينة رأس الخير</button>
        <p class="muted" style="margin:16px 0 0">مندوب شركة؟ سجّل مرة واحدة وتحصل على رقمك الخاص.</p>
        <button class="btn block" id="sr-id-new" style="margin-top:10px">مندوب جديد — سجّل الآن</button>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:10px">لديّ رقم تسجيل</div>
        <div class="field"><label>رقم التسجيل (مثال: MND-0001)</label>
          <input type="text" id="sr-id-input" dir="ltr" placeholder="MND-0001">
        </div>
        <button class="btn block" id="sr-id-check">دخول</button>
      </div>
    `;
    root.querySelector('#sr-id-check').addEventListener('click', async ()=>{
      const repId = root.querySelector('#sr-id-input').value.trim();
      if(!repId){ showToast('اكتب رقم التسجيل'); return; }
      const btn = root.querySelector('#sr-id-check');
      btn.disabled = true; btn.textContent = 'جار التحقق...';
      try{
        const res = await srApiGet(cfg.url, { token:cfg.token, action:'get_rep', rep_id:repId });
        if(res.ok){
          session = { rep_id:res.rep.rep_id, name:res.rep.name, company:res.rep.company };
          srSaveSession(session);
          afterIdentify();
        }else{
          showToast('رقم التسجيل غير موجود');
          btn.disabled = false; btn.textContent = 'دخول';
        }
      }catch(e){
        showToast('تعذر الاتصال، حاول مرة أخرى');
        btn.disabled = false; btn.textContent = 'دخول';
      }
    });
    root.querySelector('#sr-id-new').addEventListener('click', ()=>{ view='register'; paint(); });
    root.querySelector('#sr-id-emp').addEventListener('click', ()=>{ view='employee'; paint(); });
  }

  function paintRegister(){
    root.innerHTML = `
      <div class="glass" style="margin-bottom:16px">
        <div class="eyebrow">تسجيل جديد</div>
        <p class="muted" style="margin-top:8px">بيانات بسيطة، مرة وحدة فقط</p>
      </div>
      <div class="card">
        <div class="field"><label>الاسم</label><input type="text" id="sr-r-name"></div>
        <div class="field"><label>الشركة / الجهة</label><input type="text" id="sr-r-company"></div>
        <div class="field"><label>رقم الجوال</label><input type="tel" id="sr-r-phone" dir="ltr"></div>
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="sr-r-email" dir="ltr"></div>
        <button class="btn primary block" id="sr-r-submit">تسجيل</button>
      </div>
      <button class="btn ghost block" id="sr-r-back" style="margin-top:12px">لديّ رقم تسجيل — رجوع</button>
    `;
    root.querySelector('#sr-r-back').addEventListener('click', ()=>{ view='identify'; paint(); });
    root.querySelector('#sr-r-submit').addEventListener('click', async ()=>{
      const name = root.querySelector('#sr-r-name').value.trim();
      const company = root.querySelector('#sr-r-company').value.trim();
      const phone = root.querySelector('#sr-r-phone').value.trim();
      const email = root.querySelector('#sr-r-email').value.trim();
      if(!name || !phone){ showToast('الاسم والجوال مطلوبان'); return; }
      const btn = root.querySelector('#sr-r-submit');
      btn.disabled = true; btn.textContent = 'جار التسجيل...';
      try{
        const res = await srApiPost(cfg.url, { token:cfg.token, action:'register_rep', name, company, phone, email });

          session = { rep_id:res.rep_id, name, company };

        <span class="sr-rep-text">
          <span class="sr-rep-name">${esc(session.name||'')}</span>

      });
    });
    const sw = root.querySelector('#sr-ft-switch');
    if(sw) sw.addEventListener('click', ()=>{ srClearSession(); session = null; view = 'formtype'; paint(); });
  }

  function renderFieldInput(f){
    const val = wizardData[f.key];
    if(f.type === 'select'){
      return `
        <div class="field">
          <label>${esc(f.labelAr)}</label>
          <select id="sr-f-${f.key}">
            <option value="" disabled ${!val?'selected':''}>اختر...</option>
            ${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
          </select>
        </div>
      `;
    }
    if(f.type === 'textarea'){
      return `<div class="field"><label>${esc(f.labelAr)}</label><textarea id="sr-f-${f.key}" rows="4">${esc(val||'')}</textarea></div>`;
    }
    if(f.type === 'date'){
      return `<div class="field"><label>${esc(f.labelAr)}</label><input type="date" id="sr-f-${f.key}" value="${esc(val||'')}"></div>`;
    }
    return `<div class="field"><label>${esc(f.labelAr)}</label><input type="text" id="sr-f-${f.key}" value="${esc(val||'')}"></div>`;
  }

  function renderVisitorsTable(){
    if(!Array.isArray(wizardData.visitors) || wizardData.visitors.length === 0){
      wizardData.visitors = [{ name:'', nationality:'', idNumber:'' }];
    }
    return `
      <div id="sr-visitors-wrap">
        ${wizardData.visitors.map((v,i)=>`
          <div class="sr-visitor-row">
            ${wizardData.visitors.length > 1 ? `<button type="button" class="sr-visitor-remove" data-rm="${i}">${iconTrash()}</button>` : ''}
            <div class="field" style="margin-bottom:6px"><label>${wizardForm==='entry_permit' ? 'اسم الفرد' : 'اسم الزائر'} ${i+1}</label><input type="text" class="sr-v-name" data-idx="${i}" value="${esc(v.name)}"></div>
            <div class="field" style="margin-bottom:6px"><label>الجنسية</label><input type="text" class="sr-v-nat" data-idx="${i}" value="${esc(v.nationality)}"></div>
            <div class="field" style="margin-bottom:0"><label>رقم الهوية / الإقامة / الجواز</label><input type="text" class="sr-v-id" data-idx="${i}" dir="ltr" value="${esc(v.idNumber)}"></div>
            ${wizardForm==='entry_permit' ? `<div class="field" style="margin-top:6px;margin-bottom:0"><label>الاسم باللغة الانجليزية</label><input type="text" class="sr-v-en" data-idx="${i}" dir="ltr" value="${esc(v.englishName||'')}"></div>` : ''}
          </div>
        `).join('')}
      </div>
      <button type="button" class="btn ghost sr-add-visitor" id="sr-add-visitor">${wizardForm==='entry_permit' ? '+ إضافة فرد' : '+ إضافة زائر'}</button>
    `;
  }

  function wireVisitorsTable(){
    const wrap = root.querySelector('#sr-visitors-wrap');
    if(!wrap) return;
    root.querySelectorAll('.sr-v-name').forEach(el=> el.addEventListener('input', e=>{ wizardData.visitors[+e.target.dataset.idx].name = e.target.value; }));
    root.querySelectorAll('.sr-v-nat').forEach(el=> el.addEventListener('input', e=>{ wizardData.visitors[+e.target.dataset.idx].nationality = e.target.value; }));
    root.querySelectorAll('.sr-v-en').forEach(el=> el.addEventListener('input', e=>{ wizardData.visitors[+e.target.dataset.idx].englishName = e.target.value; }));
    root.querySelectorAll('.sr-v-id').forEach(el=> el.addEventListener('input', e=>{ wizardData.visitors[+e.target.dataset.idx].idNumber = e.target.value; }));
    root.querySelectorAll('[data-rm]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        collectAll(SR_FORM_DEFS[wizardForm]);
        wizardData.visitors.splice(+btn.getAttribute('data-rm'), 1);
        paintWizard();
      });
    });
    const addBtn = root.querySelector('#sr-add-visitor');
    if(addBtn){
      addBtn.addEventListener('click', ()=>{
        const maxV = wizardForm==='entry_permit' ? 20 : 15;
        if(wizardData.visitors.length >= maxV){ showToast('الحد الأقصى ' + maxV); return; }
        collectAll(SR_FORM_DEFS[wizardForm]);
        wizardData.visitors.push({ name:'', nationality:'', idNumber:'' });
        paintWizard();
      });
    }
  }

  function collectStepValues(step){
    step.fields.forEach(f=>{
      if(f.type === 'visitorsTable') return;
      const el = root.querySelector('#sr-f-'+f.key);
      if(el) wizardData[f.key] = el.value;
    });
  }
  function collectAll(def){ def.steps.forEach(collectStepValues); }

  // The official-form look: same labels, same order, filled live as the user types.
  function formTableHtml(def, data){
    const rows = [];
    def.steps.forEach(st=> st.fields.forEach(f=>{
      if(f.type === 'visitorsTable'){
        (data.visitors && data.visitors.length ? data.visitors : [{}]).forEach((v,i)=>{
          rows.push(`<tr><td class="k">${wizardForm==='entry_permit'?'فرد':'زائر'} ${i+1}</td><td>${esc([v.name,v.nationality,v.idNumber,v.englishName].filter(Boolean).join(' — '))}</td></tr>`);
        });
      } else {
        rows.push(`<tr><td class="k">${esc(f.labelAr)}</td><td>${esc(data[f.key]||'')}</td></tr>`);
      }
    }));
    return `<table>${rows.join('')}</table>`;
  }
  function submitterRowsHtml(){
    if(!session) return '';
    const sub = session.type==='employee' ? ('الرقم الوظيفي ' + (session.employee_no||'')) : (session.rep_id||'');
    return `<table style="margin-bottom:10px"><tr><td class="k">مقدّم الطلب</td><td>${esc(session.name||'')} ${esc(sub)}</td></tr><tr><td class="k">الجهة / الشركة</td><td>${esc(session.company||'')}</td></tr><tr><td class="k">الجوال</td><td>${esc(session.phone||'')}</td></tr></table>`;
  }
  function printForm(def, data, reqId){
    if(def === SR_FORM_DEFS.visit_request){ srPrintVisitForm(data, { requestId:reqId }); return; }
    if(def === SR_FORM_DEFS.entry_permit){
      srPrintPermit({ id: reqId || '' }, (data.visitors||[]).map(v=>({ name:v.name, nat:v.nationality, id:v.idNumber, en:v.englishName })), data.permitFrom||'', data.permitTo||'', '', data.employerName||'', '', 'تصريح دخول أفراد', { draft:true });
      return;
    }
    const today = new Date().toLocaleDateString('ar-SA-u-ca-gregory');
    srOpenPrintDoc(def.labelAr, srLetterhead() + `<h1>${esc(def.labelAr)}</h1><div class="sub">${reqId ? ('رقم الطلب: '+esc(reqId)+' — ') : ''}${today}</div>` + submitterRowsHtml() + formTableHtml(def, data));
  }

  function validateForm(def){
    for(const st of def.steps){
      const optStep = /إن وجد|إضافية/.test(st.titleAr);
      if(optStep) continue;
      const miss = st.fields.find(f=> f.type!=='visitorsTable' && !/contract|previous|unified/i.test(f.key) && !String(wizardData[f.key]||'').trim());
      if(miss) return 'عبّئ: ' + miss.labelAr;
    }
    if(def.steps.some(st=>st.fields.some(f=>f.type==='visitorsTable'))){
      const vs = (wizardData.visitors||[]).filter(v=>v.name && v.name.trim());
      if(vs.length === 0) return wizardForm==='entry_permit' ? 'أضف فردًا واحدًا على الأقل' : 'أضف زائرًا واحدًا على الأقل';
      if((wizardData.visitors||[]).some(v=> (v.name||v.nationality||v.idNumber) && !(v.name && v.nationality && v.idNumber))) return 'أكمل بيانات كل زائر (الاسم والجنسية والهوية)';
    }
    if(wizardForm === 'visit_request'){
      const d1 = new Date(wizardData.visitStart), d2 = new Date(wizardData.visitEnd);
      const days = Math.round((d2 - d1)/86400000);
      if(d2 < d1) return 'تاريخ نهاية الزيارة قبل بدايتها';
      if(days > 2) return 'مدة تصريح الزائر 3 أيام كحد أقصى (72 ساعة)';
    }
    if(wizardForm === 'entry_permit'){
      const e1 = new Date(wizardData.permitFrom), e2 = new Date(wizardData.permitTo);
      const ed = Math.round((e2 - e1)/86400000);
      if(e2 < e1) return 'تاريخ نهاية التصريح قبل بدايته';
      if(ed > 13) return 'مدة تصريح دخول الأفراد 14 يومًا كحد أقصى (أسبوعان)';
    }
    return '';
  }

  function paintWizard(){
    const def = SR_FORM_DEFS[wizardForm];
    root.innerHTML = `
      <div class="sr-paper" id="sr-pv">
        ${'<div class="lh"><img src="'+srAbs('../brand/letterhead.png')+'" alt=""></div>'}
        <h1>${esc(def.labelAr)}</h1>
        ${submitterRowsHtml()}
        <div id="sr-pv-table"></div>
      </div>
      <div class="glass" style="margin-top:14px">
        <div class="eyebrow" style="text-align:center">${esc(def.labelAr)}</div>
        <p class="muted" style="text-align:center;margin:6px 0 0">${wizardForm==='visit_request' ? 'مدة تصريح الزائر: 3 أيام كحد أقصى (72 ساعة).' : wizardForm==='entry_permit' ? 'مدة تصريح دخول الأفراد: 14 يومًا كحد أقصى (أسبوعان).' : 'عبّئ الحقول وسيظهر الشكل الرسمي في الأعلى مباشرة.'}</p>
        ${def.steps.map(st=>`
          <div class="sr-step-title" style="margin-top:18px">${esc(st.titleAr||'')}</div>
          ${st.fields.map(f=> f.type==='visitorsTable' ? renderVisitorsTable() : renderFieldInput(f)).join('')}
        `).join('')}
        <div class="sr-wizard-actions" style="margin-top:18px">
          <button class="btn ghost" id="sr-w-print" type="button">طباعة النموذج</button>
          <button class="btn primary" id="sr-w-next" type="button">إرسال الطلب</button>
        </div>
      </div>
    `;
    function refresh(){ collectAll(def); root.querySelector('#sr-pv-table').innerHTML = formTableHtml(def, wizardData); }
    refresh();
    root.oninput = refresh; root.onchange = refresh;
    wireVisitorsTable();
    const pair = wizardForm==='entry_permit' ? ['permitFrom','permitTo',13] : ['visitStart','visitEnd',2];
    const endEl = root.querySelector('#sr-f-'+pair[1]), startEl = root.querySelector('#sr-f-'+pair[0]);
    if(startEl && endEl){
      const lim = ()=>{
        if(!startEl.value){ endEl.removeAttribute('max'); endEl.removeAttribute('min'); return; }
        const d = new Date(startEl.value); endEl.min = startEl.value;
        d.setDate(d.getDate()+pair[2]); endEl.max = d.toISOString().slice(0,10);
      };
      startEl.addEventListener('change', lim); lim();
    }
    root.querySelector('#sr-w-print').addEventListener('click', ()=>{ refresh(); printForm(def, wizardData, ''); });
    root.querySelector('#sr-w-next').addEventListener('click', async ()=>{
      collectAll(def);
      const err = validateForm(def);
      if(err){ showToast(err); return; }
      const btn = root.querySelector('#sr-w-next');
      btn.disabled = true; btn.textContent = 'جار الإرسال...';
      try{
        const res = await srApiPost(cfg.url, {
          token: cfg.token,
          form_type: wizardForm,
          ...(session.type==='employee'
            ? { submitter_type:'employee', submitter_name:session.name, submitter_phone:session.phone, submitter_email:session.email||'', company:session.company }
            : { rep_id: session.rep_id, submitter_type:'rep' }),
          payload: wizardData,
        });
        if(res.ok){
          lastRequestId = res.id;
          lastSubmitted = { def, data: JSON.parse(JSON.stringify(wizardData)) };
          view = 'done';
          paint();
        }else{
          showToast('تعذر إرسال الطلب');
          btn.disabled = false; btn.textContent = 'إرسال الطلب';
        }
      }catch(e){
        showToast('تعذر الاتصال');
        btn.disabled = false; btn.textContent = 'إرسال الطلب';
      }
    });
  }

  function paintDone(){
    root.innerHTML = `
      <div class="glass" style="text-align:center">
        <div class="sr-done-icon">${iconCheck()}</div>
        <div class="h2">تم استلام طلبك</div>
        <div class="muted" style="margin-top:6px">رقم الطلب</div>
        <div class="sr-big-id">${esc(lastRequestId)}</div>
        <p class="muted" style="margin-top:6px">راح يوصلك إيميل فور مراجعته</p>
        <button class="btn block" id="sr-done-print" style="margin-top:16px">طباعة طلبك</button>
        <button class="btn primary block" id="sr-done-another" style="margin-top:10px">تقديم طلب آخر</button>
      </div>
    `;
    root.querySelector('#sr-done-print').addEventListener('click', ()=>{ if(lastSubmitted) printForm(lastSubmitted.def, lastSubmitted.data, lastRequestId); });
    root.querySelector('#sr-done-another').addEventListener('click', ()=>{ view='formtype'; paint(); });
  }

  paint();
}

document.addEventListener('DOMContentLoaded', startApp);
</script>
</body>
</html>
